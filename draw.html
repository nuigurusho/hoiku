<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>おえかき</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css?v=21">
<style>
  /* おえかきは がめん ぜんぶを つかう。どうぐは ドロワー(よこから 出る はこ)に しまう */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; inset: 0; }
  main {
    padding: 0 0 96px;          /* した=ミニどうぐバーの ばしょを あける */
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .paper {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(120,80,40,.2);
    padding: 8px;
  }
  #drawCanvas {
    display: block;
    border-radius: 10px;
    background: #fff;
    touch-action: none;
    width: auto;
    height: auto;
    max-width: calc(100vw - 130px);          /* ひだり=もどる みぎ=どうぐ の ぶん */
    max-height: calc(100vh - 130px);
    max-height: calc(100dvh - 130px);
    cursor: crosshair;
  }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 6px 0 4px; }
  .swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
    cursor: pointer;
  }
  .swatch.active { outline: 4px solid #212529; transform: scale(1.08); }
  .sizes { display: flex; gap: 10px; align-items: center; justify-content: flex-start; margin: 6px 0; }
  .size-btn {
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 3px solid #e8cbae;
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .size-btn.active { border-color: #212529; background: #fff0f6; }
  .size-btn .dot { background: #4a3f35; border-radius: 50%; }
  .drawer h3 { margin: 14px 0 4px; font-size: 17px; }
  .tool-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tool-row .btn { font-size: 16px; padding: 10px 16px; box-shadow: 0 4px 0 var(--shade); }
  .tool-row .btn:active { transform: translateY(4px); box-shadow: none; }
  .cat-row label.radio { display: block; margin: 6px 0; font-size: 16px; }

  /* スマホ:ミニどうぐバーが 何だんにも ならないように ちぢめる。
     もどす・やりなおしは 矢じるしだけに する */
  @media (max-width: 560px) {
    main { padding-bottom: 86px; }
    #drawCanvas {
      max-width: calc(100vw - 108px);
      max-height: calc(100vh - 120px);
      max-height: calc(100dvh - 120px);
    }
    .minibar { gap: 5px; padding: 6px 7px; }
    .minibar .btn { font-size: 15px; padding: 8px 11px; }
    .minibar .btn.big { font-size: 16px; padding: 9px 12px; }
    .minibar .now { width: 34px; height: 34px; border-width: 3px; }
    .minibar .btn .t { display: none; }
  }
  /* もっと せまい スマホ */
  @media (max-width: 400px) {
    .minibar { gap: 4px; padding: 5px 6px; }
    .minibar .btn { font-size: 14px; padding: 7px 9px; }
    .minibar .btn.big { font-size: 15px; padding: 8px 10px; }
    .minibar .now { width: 30px; height: 30px; }
  }
</style>
</head>
<body data-chrome="game">
<header class="bar">
  <a class="back" href="index.html">← もどる</a>
  <h1><img class="bar-icon" src="assets/buttons/draw.png" alt=""> おえかき</h1>
  <div class="spacer"></div>
</header>

<main>
  <div class="paper">
    <canvas id="drawCanvas" width="820" height="1040"></canvas>
  </div>
</main>

<!-- した:よく つかう ものだけ うかせる -->
<div class="minibar">
  <button class="now" id="nowColor" title="いろを えらぶ" aria-label="いろを えらぶ"></button>
  <button class="btn blue" id="undoBtn">↩<span class="t"> もどす</span></button>
  <button class="btn blue" id="redoBtn">↪<span class="t"> やりなおし</span></button>
  <button class="btn gray" id="eraserBtn">けしゴム</button>
  <button class="btn green big" id="saveBtn">✔ ほぞん<span class="t">する</span></button>
  <button class="btn green big hidden" id="overwriteBtn">✔ うわがき<span class="t"> ほぞん</span></button>
</div>

<!-- みぎ:どうぐばこ(ドロワー) -->
<button class="drawer-handle" id="toolsHandle">🎨 どうぐ</button>
<div class="drawer-scrim hidden" id="toolsScrim"></div>
<aside class="drawer" id="toolsDrawer" aria-label="どうぐばこ">
  <button class="drawer-close" id="toolsClose">✕ とじる</button>
  <div class="panel">
    <h3 style="margin-top:0">いろ</h3>
    <div class="swatches" id="swatches"></div>

    <h3>ふとさ</h3>
    <div class="sizes" id="sizes"></div>

    <h3>どうぐ</h3>
    <div class="tool-row">
      <button class="btn purple" id="fillBtn">ぬりつぶし</button>
      <button class="btn yellow" id="clearBtn">ぜんぶけす</button>
    </div>
    <p class="note" id="toolHint" style="margin:6px 0 0">ペンで かけます</p>

    <h3 id="catTitle">なんの え?</h3>
    <div class="cat-row" id="catRow">
      <label class="radio"><input type="radio" name="cat" value="char" checked> 🧍 キャラクターの絵</label>
      <label class="radio"><input type="radio" name="cat" value="bg"> 🏞️ はいけいの絵</label>
      <label class="radio"><input type="radio" name="cat" value="pic"> 🖼️ 写真・絵</label>
      <label class="radio"><input type="radio" name="cat" value="fuku"> 😀 ふくわらいパーツ</label>
    </div>

    <div class="tool-row hidden" id="saveNewRow" style="margin-top:14px">
      <button class="btn blue" id="saveNewBtn" style="flex:1">べつの えとして ほぞん</button>
    </div>
    <div class="tool-row" style="margin-top:10px">
      <button class="btn yellow" id="openBtn" style="flex:1">とりこんだ えを なおす</button>
    </div>

    <h3>かきかたの コツ</h3>
    <p class="note" style="line-height:1.7">
      キャラクターは <b>こく・はっきり</b> 大きく かくと よく うごきます(白いところは すけて見えます)。<br>
      🦋ちょうちょ を つくるときは <b>はねを1まいだけ</b> かいて、あとで「うごきせってい」で ちょうちょを えらんでね。<br>
      こまかい せってい(うごき・まちがいスポット)は <a href="create.html">つくる</a> でできます。
    </p>
  </div>
</aside>

<script src="js/core.js?v=20"></script>
<script src="js/rig.js?v=15"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

const COLORS = [
  "#333333", "#e03131", "#f76707", "#ffd43b", "#2f9e44", "#1971c2",
  "#4dabf7", "#ae3ec9", "#f06595", "#a5682a", "#ffc9a0", "#ffffff",
];
const SIZES = [6, 14, 26, 44];

const state = {
  color: "#333333",
  size: 14,
  tool: "pen",   // "pen" / "eraser" / "fill"
  drawing: false,
  last: null,
  undo: [],      // もどす用の スナップショット(dataURL)
  redo: [],      // やりなおし用
};
const HISTORY_MAX = 15;   // もどす・やりなおし とも これだけ さかのぼれる
const isEraser = () => state.tool === "eraser";

const cv = $("drawCanvas");
const ctx = cv.getContext("2d");

/* 白い紙で スタート */
function fillWhite() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, cv.width, cv.height);
}
fillWhite();

/* ---------- パレット ---------- */
COLORS.forEach((col, i) => {
  const s = document.createElement("div");
  s.className = "swatch" + (col === state.color ? " active" : "");
  s.style.background = col;
  if (col === "#ffffff") s.style.borderColor = "#dee2e6";
  s.title = col === "#ffffff" ? "しろ" : "";
  s.onclick = () => {
    Sound.tap();
    state.color = col;
    if (isEraser()) state.tool = "pen";   // いろを えらんだら ペン(か ぬりつぶし)に もどる
    syncTools();
  };
  s.dataset.color = col;
  $("swatches").appendChild(s);
});

/* ---------- ふとさ ---------- */
SIZES.forEach((sz) => {
  const b = document.createElement("button");
  b.className = "size-btn" + (sz === state.size ? " active" : "");
  b.dataset.size = sz;
  const dot = document.createElement("span");
  dot.className = "dot";
  const d = Math.min(38, sz);
  dot.style.width = d + "px";
  dot.style.height = d + "px";
  b.appendChild(dot);
  b.onclick = () => { Sound.tap(); state.size = sz; syncTools(); };
  $("sizes").appendChild(b);
});

const TOOL_HINT = {
  pen: "ペンで かけます",
  eraser: "けしゴム:なぞった ところが しろく なります",
  fill: "ぬりつぶし:かこまれた ところを タッチすると いろが つきます",
};
function syncTools() {
  $("swatches").querySelectorAll(".swatch").forEach((s) =>
    s.classList.toggle("active", !isEraser() && s.dataset.color === state.color));
  $("sizes").querySelectorAll(".size-btn").forEach((b) =>
    b.classList.toggle("active", +b.dataset.size === state.size));
  $("eraserBtn").classList.toggle("green", isEraser());
  $("eraserBtn").classList.toggle("gray", !isEraser());
  $("nowColor").style.background = isEraser() ? "#ffffff" : state.color;
  $("fillBtn").classList.toggle("green", state.tool === "fill");
  $("fillBtn").classList.toggle("purple", state.tool !== "fill");
  $("toolHint").textContent = TOOL_HINT[state.tool];
}

/* ---------- もどす / やりなおし ----------
   かく まえの じょうたいを 1まいの えとして とっておき、
   「もどす」で 1つ まえへ、「やりなおし」で 1つ さきへ すすむ。

   ・れんだ しても こわれないように、1つずつ じゅんばんに しょりする。
     え の よみこみは 時間が かかるので、いっぺんに はしらせると
     さいごに おわった ものが かちのこり、1回しか もどらなく 見える。
   ・のこりが ない ときは ボタンを うすくして おせなくする。
     「おしても なにも おきない」を なくす。 */
function snapshot() {
  try { return cv.toDataURL("image/png"); } catch (e) { return null; }   // メモリ不足などで しっぱいする ことがある
}

function pushHistory() {
  const url = snapshot();
  if (!url) return;
  state.undo.push(url);
  if (state.undo.length > HISTORY_MAX) state.undo.shift();
  state.redo.length = 0;              // あたらしく かいたら やりなおしは 消える
  syncHistory();
}

function clearHistory() {
  state.undo.length = 0;
  state.redo.length = 0;
  syncHistory();
}

function syncHistory() {
  $("undoBtn").disabled = !state.undo.length;
  $("redoBtn").disabled = !state.redo.length;
}

async function paintFrom(url) {
  const img = await Util.loadImage(url);
  ctx.clearRect(0, 0, cv.width, cv.height);
  fillWhite();
  ctx.drawImage(img, 0, 0);
}

/* おした ぶんを 1つずつ じゅんばんに しょりする */
let historyQueue = Promise.resolve();
function stepHistory(from, to) {
  historyQueue = historyQueue.then(async () => {
    if (!from.length) return;
    const cur = snapshot();
    const url = from.pop();
    if (cur) {
      to.push(cur);
      if (to.length > HISTORY_MAX) to.shift();
    }
    Sound.tap();
    await paintFrom(url);
    syncHistory();
  }).catch(() => {});
}
const undo = () => stepHistory(state.undo, state.redo);
const redo = () => stepHistory(state.redo, state.undo);

/* ---------- ぬりつぶし(バケツ) ----------
   タッチした ところと にた いろの ところを ひとつづきに ぬる。
   えんぴつの せんは いろが ちがうので、せんの てまえで とまる。 */
function hexRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function floodFill(sx, sy, hex) {
  const w = cv.width, h = cv.height;
  sx = Math.floor(Util.clamp(sx, 0, w - 1));
  sy = Math.floor(Util.clamp(sy, 0, h - 1));
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const at = (x, y) => (y * w + x) * 4;
  const s = at(sx, sy);
  const sr = d[s], sg = d[s + 1], sb = d[s + 2];
  const [fr, fg, fb] = hexRgb(hex);
  // すでに おなじ いろなら なにも しない(むげんループよけ)
  if (Math.abs(sr - fr) < 6 && Math.abs(sg - fg) < 6 && Math.abs(sb - fb) < 6) return false;

  const TOL = 60;                       // せんの ふちの ぼやけも すこし ぬる
  const seen = new Uint8Array(w * h);
  const near = (i) =>
    Math.abs(d[i] - sr) <= TOL && Math.abs(d[i + 1] - sg) <= TOL && Math.abs(d[i + 2] - sb) <= TOL;

  const stack = [[sx, sy]];
  while (stack.length) {
    const [px, py] = stack.pop();
    let x = px;
    while (x >= 0 && !seen[py * w + x] && near(at(x, py))) x--;   // ひだり端まで
    x++;
    let up = false, down = false;
    for (; x < w && !seen[py * w + x] && near(at(x, py)); x++) {  // みぎへ ぬっていく
      const i = at(x, py);
      d[i] = fr; d[i + 1] = fg; d[i + 2] = fb; d[i + 3] = 255;
      seen[py * w + x] = 1;
      if (py > 0) {
        const okUp = !seen[(py - 1) * w + x] && near(at(x, py - 1));
        if (okUp && !up) { stack.push([x, py - 1]); up = true; }
        else if (!okUp) up = false;
      }
      if (py < h - 1) {
        const okDown = !seen[(py + 1) * w + x] && near(at(x, py + 1));
        if (okDown && !down) { stack.push([x, py + 1]); down = true; }
        else if (!okDown) down = false;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return true;
}

/* ---------- えがく ---------- */
function strokeStyle() {
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = state.size;
  ctx.strokeStyle = isEraser() ? "#ffffff" : state.color;
}

cv.addEventListener("pointerdown", (e) => {
  Sound.ensure();
  pushHistory();
  const at = Util.canvasPos(cv, e);
  if (state.tool === "fill") {
    if (floodFill(at.x, at.y, state.color)) Sound.pop();
    else { state.undo.pop(); syncHistory(); Sound.tap(); }
    return;
  }
  state.drawing = true;
  state.last = at;
  strokeStyle();
  // 点をうつ(タップだけでも かける)
  ctx.beginPath();
  ctx.arc(state.last.x, state.last.y, state.size / 2, 0, 7);
  ctx.fillStyle = isEraser() ? "#ffffff" : state.color;
  ctx.fill();
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  if (!state.drawing) return;
  const p = Util.canvasPos(cv, e);
  strokeStyle();
  ctx.beginPath();
  ctx.moveTo(state.last.x, state.last.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  state.last = p;
});
const endStroke = () => { state.drawing = false; };
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("pointerleave", endStroke);

/* ---------- どうぐ ---------- */
$("eraserBtn").onclick = () => { Sound.tap(); state.tool = isEraser() ? "pen" : "eraser"; syncTools(); };
$("fillBtn").onclick = () => { Sound.tap(); state.tool = state.tool === "fill" ? "pen" : "fill"; syncTools(); };
$("undoBtn").onclick = undo;
$("redoBtn").onclick = redo;
$("clearBtn").onclick = () => {
  if (!confirm("かいた えを ぜんぶ けしますか?")) return;
  pushHistory();
  fillWhite();
  Sound.tap();
};

/* ---------- ほぞん ---------- */
function isBlank() {
  // 白いところだけかどうか ざっくり判定
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  for (let i = 0; i < d.length; i += 4 * 97) { // 間引きサンプリング
    if (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) return false;
  }
  return true;
}

/* 「つくる」画面から きたとき:なにを かくかは きまっているので えらばせない */
const q = new URLSearchParams(location.search);
const fixedCat = (() => {
  const c = q.get("cat");
  return ["char", "bg", "pic", "fuku"].includes(c) ? c : null;
})();
const CAT_NAME = { char: "キャラクターの ぜんしん", bg: "はいけい", pic: "しゃしん・え", fuku: "キャラクターの かお" };
const CAT_BASE = { char: "キャラ", bg: "はいけい", pic: "え", fuku: "ふくわらい" };
if (fixedCat) {
  document.querySelector(`input[name="cat"][value="${fixedCat}"]`).checked = true;
  $("catRow").classList.add("hidden");
  $("catTitle").textContent = CAT_NAME[fixedCat] + " を かこう!";
}

/* ---------- とりこんだ えを なおす ---------- */
let editRec = null;          // なおしているとき、その レコード

async function loadForEdit(rec) {
  editRec = rec;
  const img = await Util.loadImage(rec.dataURL);
  // もとの えの たてよこ比の まま かけるように キャンバスを あわせる
  const max = rec.cat === "char" ? 900 : 1100;
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  cv.width = Math.max(1, Math.round(img.width * sc));
  cv.height = Math.max(1, Math.round(img.height * sc));
  fillWhite();
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  clearHistory();

  const r = document.querySelector(`input[name="cat"][value="${rec.cat}"]`);
  if (r) r.checked = true;
  $("catRow").classList.add("hidden");
  $("catTitle").textContent = `「${rec.name || "なまえなし"}」を なおしています`;
  $("saveBtn").classList.add("hidden");
  $("overwriteBtn").classList.remove("hidden");
  $("saveNewRow").classList.remove("hidden");
  Ui.msg("なおして いいよ!", 1200, "#51cf66");
}

/* 「とりこんだ えを なおす」ボタン:えらび がめんを だす */
$("openBtn").onclick = async () => {
  Sound.tap();
  const recs = await Store.ensureSamples();
  const rec = await Picker.one({
    title: "どの えを なおす?",
    note: "えらんだ えの うえから かけます",
    records: recs,
    selectedId: editRec && editRec.id,
  });
  if (rec) loadForEdit(rec);
};

/* ?edit=<id> で ちょくせつ ひらく(つくる画面からの ちかみち) */
(async () => {
  const id = q.get("edit");
  if (!id) return;
  const all = await Store.ensureSamples();
  const rec = all.find((r) => String(r.id) === String(id));
  if (rec) loadForEdit(rec);
  else Ui.msg("その えが みつからないよ", 1800, "#4dabf7");
})();

/* ---------- ほぞん ---------- */
/* いまの キャンバスを ほぞんサイズに ちぢめた canvas にする */
function outputCanvas(cat) {
  const max = cat === "char" ? 900 : 1100;
  const sc = Math.min(1, max / Math.max(cv.width, cv.height));
  const out = Util.makeCanvas(Math.round(cv.width * sc), Math.round(cv.height * sc));
  const octx = out.getContext("2d");
  octx.fillStyle = "#fff";
  octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(cv, 0, 0, out.width, out.height);
  return out;
}
const toDataURL = (out, cat) =>
  // キャラは 白ぬきの きれいさ優先で PNG、しゃしん/はいけいは JPEG
  cat === "char" ? out.toDataURL("image/png") : out.toDataURL("image/jpeg", 0.9);

function afterSave(msg) {
  Sound.good();
  Ui.confetti(1800, 90);
  Ui.msg(msg, 1500, "#51cf66");
  // 「つくる」画面から きたときは そこへ もどる
  if (fixedCat || editRec) setTimeout(() => { location.href = "create.html"; }, 1500);
}

/* あたらしく ほぞん(なおしている ときは「べつの えとして」) */
async function saveAsNew() {
  if (isBlank()) { Ui.msg("なにか かいてね!", 1400, "#4dabf7"); return; }
  const cat = editRec ? editRec.cat : document.querySelector('input[name="cat"]:checked').value;
  const base = CAT_BASE[cat];
  const existing = await Store.all(cat);
  const suggest = editRec ? `${editRec.name || base}のつづき` : `${base}${existing.length + 1}`;
  const nm = prompt("なまえを いれてください", suggest);
  if (nm === null) return;

  const rec = { name: nm.trim() || base, cat, dataURL: toDataURL(outputCanvas(cat), cat) };
  if (cat === "char") rec.rig = { ...Rig.DEFAULT, ...((editRec && editRec.rig) || {}) };
  await Store.put(rec);
  afterSave("ほぞんしたよ!");
}

/* うわがき(なまえ・うごきせってい・まちがいスポットなどは そのまま のこす) */
async function saveOverwrite() {
  if (!editRec) return;
  if (!confirm(`「${editRec.name || "なまえなし"}」を かきかえますか?`)) return;
  editRec.dataURL = toDataURL(outputCanvas(editRec.cat), editRec.cat);
  await Store.put(editRec);
  afterSave("うわがき しました!");
}

$("saveBtn").onclick = saveAsNew;
$("saveNewBtn").onclick = saveAsNew;
$("overwriteBtn").onclick = saveOverwrite;

/* ---------- どうぐばこ(ドロワー)の あけしめ ---------- */
const drawer = $("toolsDrawer"), scrim = $("toolsScrim");
function openTools(on) {
  Sound.tap();
  drawer.classList.toggle("open", on);
  scrim.classList.toggle("hidden", !on);
  $("toolsHandle").classList.toggle("hidden", on);
}
$("toolsHandle").onclick = () => openTools(true);
$("toolsClose").onclick  = () => openTools(false);
scrim.onclick            = () => openTools(false);
$("nowColor").onclick    = () => openTools(true);
/* いろ・ふとさを えらんだら すぐ かけるように とじる */
drawer.addEventListener("click", (e) => {
  if (e.target.closest(".swatch, .size-btn")) openTools(false);
});

syncTools();
syncHistory();      // はじめは もどす・やりなおし とも おせない
</script>
</body>
