<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あそぶ — みんなの ゲームパック</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="css/style.css?v=64">
</head>
<body data-back-href="play.html">
<main class="hub-page">
  <div class="settings-bar">
    <a class="settings-fab" href="settings.html" title="せってい(おとなのひとよう)" aria-label="せってい おとなのひとよう">
      <img src="assets/buttons/settings.svg?v=2" alt="せってい">
    </a>
  </div>
  <h1 style="margin:0"><a class="logo-home" href="index.html" aria-label="表紙へ戻る"><img class="logo hub-logo" src="assets/logo.png" width="900" height="600" alt="みんなの ゲームパック"></a></h1>
  <div class="play-list-head">
    <h2 class="play-list-title" id="listTitle"></h2>
  </div>
  <div class="tiles play-list-tiles" id="gameList"></div>
</main>
<script src="js/core.js?v=51"></script>
<script>
"use strict";
const TYPE = ["solo", "duo", "multi", "games"].includes(new URLSearchParams(location.search).get("type"))
  ? new URLSearchParams(location.search).get("type") : "games";
const LABELS = { solo: "ひとりで", duo: "ふたりで", multi: "みんなで", games: "ゲーム別" };
const MODE_ICONS = {
  solo: "assets/buttons/mode-solo.svg?v=3",
  duo: "assets/buttons/mode-duo.svg?v=4",
  multi: "assets/buttons/mode-multi.svg?v=5",
  games: "assets/buttons/mode-games.svg?v=2",
};
const GAMES = {
  solo: [
    ["fukuwarai", "ふくわらい", ""], ["race", "かけっこ", "tier=gachi"], ["janken", "じゃんけん", "tier=gachi"],
    ["quiz", "４たくクイズ", "tier=gachi"], ["silhouette", "かげえクイズ", "tier=gachi"],
    ["diff", "まちがいさがし", "tier=gachi"], ["memory", "カードあわせ", "tier=gachi"],
    ["puzzle", "おえかきパズル", "tier=gachi"], ["adventure", "おえかきのたび", "tier=gachi"],
    ["mole", "もぐらたたき", "tier=gachi"], ["voice", "こえで ジャンプ", "tier=gachi"],
    ["rope", "なわとび", "tier=gachi"],
  ],
  duo: [["race", "かけっこ", "mode=vs"], ["sakasa", "さかさクイズ", ""]],
  multi: [
    ["quiz", "４たくクイズ", "mode=miru"], ["silhouette", "かげえクイズ", "mode=miru"],
    ["diff", "まちがいさがし", "mode=miru"], ["janken", "じゃんけん", "mode=crowd"],
    ["voice", "こえで ジャンプ", "mode=ren"],
  ],
  games: [
    ["fukuwarai", "ふくわらい", ""], ["race", "かけっこ", ""], ["janken", "じゃんけん", ""],
    ["quiz", "４たくクイズ", ""], ["silhouette", "かげえクイズ", ""], ["sakasa", "さかさクイズ", ""],
    ["diff", "まちがいさがし", ""], ["memory", "カードあわせ", ""], ["puzzle", "おえかきパズル", ""],
    ["adventure", "おえかきのたび", ""], ["mole", "もぐらたたき", ""],
    ["voice", "こえで ジャンプ", ""], ["rope", "なわとび", ""],
  ],
};
document.title = `${LABELS[TYPE]} — みんなの ゲームパック`;
document.getElementById("listTitle").innerHTML = `<img src="${MODE_ICONS[TYPE]}" alt="">${LABELS[TYPE]}`;
const list = document.getElementById("gameList");
for (const [key, label, query] of GAMES[TYPE]) {
  const a = document.createElement("a");
  a.className = "tile";
  const params = [query, `from=play-${TYPE}`].filter(Boolean).join("&");
  a.href = `games/${key}.html?${params}`;
  a.innerHTML = `<img class="icon" src="assets/buttons/${key}.png" alt="">`;
  a.append(label);
  list.appendChild(a);
}
Store.ensureSamples();
</script>
</body>
</html>
