<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>うんどうかい</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css?v=11">
<style>
  /* ===== うんどうかい(番組しんこう)だけの ちょうせい ===== */
  .uk-step {
    display: inline-block;
    background: var(--yellow);
    color: #7a5b00;
    font-size: 15px;
    font-weight: bold;
    border-radius: 999px;
    padding: 3px 14px;
    margin-bottom: 6px;
    box-shadow: 0 3px 0 var(--yellow-d);
  }
  .uk-panel { max-width: 900px; }
  .uk-mem { cursor: pointer; }
  .uk-mem:active { transform: scale(.94); }
  #progLbl { text-align: center; margin: 2px 0 6px; font-weight: bold; }
  .uk-skip { text-align: center; margin: 6px 0 0; }
  .uk-skip button { font-size: 14px; padding: 8px 16px; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="index.html">← もどる</a>
  <h1><img class="bar-icon" src="assets/buttons/undoukai.svg" alt=""> うんどうかい</h1>
  <div class="spacer"></div>
</header>

<main>
  <!-- ============ したく の がめん ============ -->
  <div id="setupScreen">
    <div class="panel uk-panel">
      <span class="uk-step">1</span>
      <h2 style="margin-top:0">さんかする キャラを えらんでね</h2>
      <div class="gallery" id="gallery"></div>
      <p class="note" id="selNote" style="font-size:17px;font-weight:bold;min-height:22px"></p>
    </div>

    <div class="panel uk-panel">
      <span class="uk-step">2</span>
      <h2 style="margin-top:0">チームわけ</h2>
      <p class="note">チーム名は タッチして じゆうに かえられます。キャラを タッチすると もう いっぽうの チームへ うつります。</p>
      <div class="mt-teams">
        <div class="mt-teamcol red">
          <input class="mt-teamname" id="nameRed" type="text" maxlength="12" value="あかチーム" aria-label="あかチームの なまえ">
          <div class="mt-members" id="redMembers"></div>
        </div>
        <div class="mt-vs">VS</div>
        <div class="mt-teamcol blue">
          <input class="mt-teamname" id="nameBlue" type="text" maxlength="12" value="あおチーム" aria-label="あおチームの なまえ">
          <div class="mt-members" id="blueMembers"></div>
        </div>
      </div>
      <div class="row"><button class="btn yellow" id="shuffleBtn">🎲 チームわけ シャッフル</button></div>
    </div>

    <div class="panel uk-panel">
      <span class="uk-step">3</span>
      <h2 style="margin-top:0">きょうぎを えらんでね</h2>
      <p class="note">オンにした きょうぎを、うえから じゅんばんに 再生します。</p>
      <div class="mt-rows" id="eventRows"></div>
      <div class="row"><button class="btn big pink" id="goBtn">けってい!</button></div>
      <p class="note" id="goNote" style="font-size:16px;font-weight:bold;min-height:22px"></p>
    </div>
  </div>

  <!-- ============ ほんばん の がめん ============ -->
  <div id="playScreen" class="hidden">
    <div class="mt-score">
      <div class="side red"><div class="nm" id="scNameRed">あかチーム</div><div class="pt"><span id="scPtRed">0</span><small>てん</small></div></div>
      <div class="mid">VS</div>
      <div class="side blue"><div class="nm" id="scNameBlue">あおチーム</div><div class="pt"><span id="scPtBlue">0</span><small>てん</small></div></div>
    </div>
    <p class="note" id="progLbl"></p>
    <div class="mt-hud">
      <span class="mt-red"  id="hudRed"></span>
      <span class="mt-mid"  id="hudMid"></span>
      <span class="mt-blue" id="hudBlue"></span>
    </div>
    <div class="mt-stage">
      <canvas id="cv" class="stage" width="1280" height="720"></canvas>
      <div class="mt-banner hidden" id="banner"></div>
      <div class="mt-over hidden" id="over"></div>
    </div>
    <div class="uk-skip" id="skipRow"><button class="btn gray" id="skipBtn">この きょうぎを とばす</button></div>
    <div class="mt-list hidden" id="finaleList"></div>
    <div class="row hidden" id="finaleRow"></div>
  </div>
</main>

<script src="js/core.js?v=12"></script>
<script src="js/rig.js?v=11"></script>
<script src="js/meet.js?v=11"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv");
const SAVE_KEY = "undoukai";

/* きょうぎ(この じゅんばんで 再生する) */
const EVENTS = [
  { key: "kakekko",   name: "かけっこ",       icon: "assets/buttons/race.png",      desc: "いっせいに スタート。じゅんいが てんすうに なるよ" },
  { key: "tamaire",   name: "たまいれ",       icon: "assets/buttons/tamaire.png",   desc: "左右に わかれて かごに 玉入れ。おおく 入れた ほうの かち" },
  { key: "dodgeball", name: "ドッヂボール",   icon: "assets/buttons/dodgeball.png", desc: "コートで たいせん。さいごまで のこった ほうの かち" },
  { key: "relay",     name: "リレー",         icon: "assets/buttons/relay.png",     desc: "トラックを 1しゅうずつ バトンタッチ。さきに ゴール!" },
];
const WIN_PT = 2, DRAW_PT = 1;

const ui = Meet.ui({ banner: $("banner"), hudRed: $("hudRed"), hudBlue: $("hudBlue"), hudMid: $("hudMid") });

/* ---- したくの じょうたい ---- */
let allChars = [];
const sel = new Set();                 // さんかする キャラの id
const side = new Map();                // id → "red" / "blue"
const on = { kakekko: true, tamaire: true, dodgeball: true, relay: true };
const names = { red: "あかチーム", blue: "あおチーム" };

/* ---- ほんばんの じょうたい ---- */
let actors = null;
let pts = { red: 0, blue: 0 };
let log = [];                          // [{ev, res}]
let runId = 0;
let skipReq = false;

const SCREENS = ["setupScreen", "playScreen"];
function show(id) { for (const s of SCREENS) $(s).classList.toggle("hidden", s !== id); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ============================================================
   したく:1. さんかする キャラ
   ============================================================ */
async function initSetup() {
  const recs = await Store.ensureSamples();
  allChars = recs.filter((r) => r.cat === "char");
  const saved = load();
  if (saved && saved.side) {
    for (const r of allChars) {
      const s = saved.side[r.id];
      if (s === "red" || s === "blue") { sel.add(r.id); side.set(r.id, s); }
    }
  }
  if (!sel.size) { for (const r of allChars) sel.add(r.id); balance(); }
  renderAll();
}

function renderAll() { renderNames(); renderGallery(); renderTeams(); renderEvents(); refreshGo(); save(); }

function renderGallery() {
  const el = $("gallery");
  el.innerHTML = "";
  for (const r of allChars) {
    const d = document.createElement("div");
    d.className = "thumb" + (sel.has(r.id) ? " selected" : "");
    d.innerHTML = `<img src="${r.dataURL}" alt=""><div class="name"></div>`;
    d.querySelector(".name").textContent = r.name || "";
    Ui.thumbFix(d.querySelector("img"), r);
    d.onclick = () => {
      Sound.tap();
      if (sel.has(r.id)) { sel.delete(r.id); side.delete(r.id); }
      else { sel.add(r.id); side.set(r.id, count("red") <= count("blue") ? "red" : "blue"); }
      fixTeams();
      renderAll();
    };
    el.appendChild(d);
  }
  const note = $("selNote");
  note.textContent = sel.size < 2
    ? `あと ${2 - sel.size}にん えらんでね(2にん いじょうで できるよ)`
    : `${sel.size}にんで うんどうかい!`;
  note.style.color = sel.size < 2 ? "#d6336c" : "#2f9e44";
}

/* ============================================================
   したく:2. チームわけ(なまえは じゆうに かえられる)
   ============================================================ */
function count(key) { let n = 0; for (const [, s] of side) if (s === key) n++; return n; }
function members(key) {
  return allChars
    .filter((r) => sel.has(r.id) && side.get(r.id) === key)
    .map((r) => ({ rec: r, name: r.name || "", voices: r.voices || null }));
}
/* かたほうの チームが 0にんに なったら、もう いっぽうから 1にん うつす */
function fixTeams() {
  for (const key of ["red", "blue"]) {
    const other = key === "red" ? "blue" : "red";
    while (count(key) === 0 && count(other) > 1) {
      const m = members(other)[members(other).length - 1];
      side.set(m.rec.id, key);
    }
  }
}
function balance() {
  const ids = Util.shuffle([...sel]);
  side.clear();
  ids.forEach((id, i) => side.set(id, i % 2 === 0 ? "red" : "blue"));
}

function renderTeams() {
  for (const key of ["red", "blue"]) {
    const box = $(key === "red" ? "redMembers" : "blueMembers");
    box.innerHTML = "";
    for (const m of members(key)) {
      const d = document.createElement("div");
      d.className = "mt-mem uk-mem";
      d.title = "タッチで もう いっぽうの チームへ";
      d.innerHTML = `<img src="${m.rec.dataURL}" alt=""><div class="nm"></div>`;
      d.querySelector(".nm").textContent = m.name;
      Ui.thumbFix(d.querySelector("img"), m.rec);
      d.onclick = () => {
        Sound.tap();
        side.set(m.rec.id, key === "red" ? "blue" : "red");
        renderAll();          // 0にんに なるのは わざと えらんだ ときだけ(けっていで しらせる)
      };
      box.appendChild(d);
    }
  }
}

function renderNames() {
  for (const key of ["red", "blue"]) $(key === "red" ? "nameRed" : "nameBlue").value = names[key];
}
for (const key of ["red", "blue"]) {
  const el = $(key === "red" ? "nameRed" : "nameBlue");
  el.oninput = () => {
    names[key] = el.value.trim() || (key === "red" ? "あかチーム" : "あおチーム");
    save();
  };
}
$("shuffleBtn").onclick = () => { Sound.pon(); balance(); renderAll(); };

/* ============================================================
   したく:3. きょうぎの オン・オフ
   ============================================================ */
function renderEvents() {
  const box = $("eventRows");
  box.innerHTML = "";
  EVENTS.forEach((ev, i) => {
    const row = document.createElement("div");
    row.className = "mt-row" + (on[ev.key] ? "" : " off");
    row.innerHTML = `
      <img class="ico" src="${ev.icon}" alt="">
      <div class="txt"><b></b><span></span></div>
      <button class="mt-toggle${on[ev.key] ? " on" : ""}" type="button" role="switch"
              aria-checked="${on[ev.key]}"><span class="knob"></span></button>`;
    row.querySelector("b").textContent = `${i + 1}. ${ev.name}`;
    row.querySelector(".txt span").textContent = ev.desc;
    row.querySelector(".mt-toggle").onclick = () => {
      Sound.tap();
      on[ev.key] = !on[ev.key];
      renderEvents();
      refreshGo();
      save();
    };
    box.appendChild(row);
  });
}

function chosen() { return EVENTS.filter((e) => on[e.key]); }

function refreshGo() {
  const list = chosen();
  const note = $("goNote"), btn = $("goBtn");
  let ng = "";
  if (count("red") < 1 || count("blue") < 1) ng = "どちらの チームにも 1にん いじょう 入れてね";
  else if (!list.length) ng = "きょうぎを 1つ いじょう オンにしてね";
  btn.disabled = !!ng;
  note.textContent = ng || `ぜん${list.length}きょうぎ:${list.map((e) => e.name).join(" → ")}`;
  note.style.color = ng ? "#d6336c" : "#2f9e44";
}

/* ---- したくの ほぞん(この たんまつの中だけ) ---- */
function save() {
  try {
    const s = {};
    for (const [id, v] of side) if (sel.has(id)) s[id] = v;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ names, on, side: s }));
  } catch (e) { /* つかえなくても もんだいなし */ }
}
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (!o) return null;
    if (o.names) { names.red = o.names.red || names.red; names.blue = o.names.blue || names.blue; }
    if (o.on) for (const k of Object.keys(on)) if (typeof o.on[k] === "boolean") on[k] = o.on[k];
    return o;
  } catch (e) { return null; }
}

/* ============================================================
   ほんばん:オンの きょうぎを じゅんばんに 再生
   ============================================================ */
$("goBtn").onclick = () => {
  if ($("goBtn").disabled) { Sound.bad(); return; }
  Sound.pon();
  runProgramme();
};

async function runProgramme() {
  const myRun = ++runId;
  const list = chosen();
  pts = { red: 0, blue: 0 };
  log = [];
  show("playScreen");
  $("banner").classList.add("hidden");
  $("skipRow").classList.add("hidden");
  $("finaleList").classList.add("hidden");
  $("finaleRow").classList.add("hidden");
  renderScore();

  card({ no: "うんどうかい", ttl: "よういちゅう…", sub: "キャラの じゅんびを しています" });
  actors = await Meet.actors({ red: members("red"), blue: members("blue") });
  if (myRun !== runId) return;

  card({
    no: `ぜん${list.length}きょうぎ`,
    ttl: "うんどうかい かいし!",
    sub: `${Meet.MARK.red} ${names.red}  VS  ${Meet.MARK.blue} ${names.blue}`,
  });
  Ui.confetti(1800, 90);
  Sound.fanfare();
  await pause(2600, "はじめるよ!");
  if (myRun !== runId) return;

  for (let i = 0; i < list.length; i++) {
    const ev = list[i];
    $("progLbl").textContent = `だい${i + 1}きょうぎ / ぜん${list.length}きょうぎ`;

    // --- きょうぎの しょうかい ---
    card({ no: `だい${i + 1}きょうぎ`, icon: ev.icon, ttl: ev.name, sub: ev.desc });
    Meet.drumroll();
    Sound.pon();
    await pause(2600, "はじめる!");
    if (myRun !== runId) return;

    // --- きょうぎ 本体 ---
    hideCard();
    $("skipRow").classList.remove("hidden");
    skipReq = false;
    let res = await Meet.run({ key: ev.key, cv, actors, names, ui, quick: true });
    if (myRun !== runId) return;
    $("skipRow").classList.add("hidden");
    $("banner").classList.add("hidden");
    if (!res) {
      if (!skipReq) return;                       // やめた
      res = { win: null, score: { red: 0, blue: 0 }, label: "とばした" };
    }

    // --- てんすう ---
    if (res.win) pts[res.win] += WIN_PT;
    else { pts.red += DRAW_PT; pts.blue += DRAW_PT; }
    log.push({ ev, res });
    renderScore();

    const lastOne = i === list.length - 1;
    card({
      no: `${ev.name} の けっか`,
      ttl: res.win ? `${Meet.MARK[res.win]} ${names[res.win]} の かち!` : "ひきわけ!",
      sub: `${res.label}  /  ${res.win ? `+${WIN_PT}てん` : `りょうチーム +${DRAW_PT}てん`}`,
      team: res.win,
    });
    if (res.win) { Sound.good(); Ui.confetti(1400, 70); }
    await pause(5200, lastOne ? "そうごう けっかへ!" : "つぎの きょうぎへ!");
    if (myRun !== runId) return;
  }

  finale(myRun);
}

/* ---- そうごう ゆうしょう はっぴょう ---- */
async function finale(myRun) {
  $("progLbl").textContent = "そうごう けっか";
  ui.hud({ red: "", blue: "", mid: "" });

  // ためて…
  card({ no: "そうごう けっか", ttl: "ゆうしょうは…?", sub: "ドキドキ…" });
  Meet.drumroll();
  await sleep(700); Meet.drumroll();
  await sleep(700); Meet.drumroll();
  await sleep(900);
  if (myRun !== runId) return;

  const win = pts.red === pts.blue ? null : (pts.red > pts.blue ? "red" : "blue");
  const cheering = win ? actors[win].slice() : actors.red.concat(actors.blue);
  Meet.celebrate({ cv, members: cheering, teamKey: win });

  Sound.fanfare();
  setTimeout(() => Sound.fanfare(), 900);
  Ui.confetti(5000, 260);
  setTimeout(() => Ui.confetti(4000, 200), 1200);
  Ui.msg(win ? "ゆうしょう!" : "どうてん!", 1800, win === "blue" ? "#1c7ed6" : "#d6336c");
  for (const a of cheering) if (a.voices) { Sound.playVoice(a.voices, ["joy"]); break; }

  // canvas の うえには タイトルだけ(みんなの おいわいが 見えるように)
  card({
    clear: true,
    team: win,
    no: `🏆 ${names.red} ${pts.red}てん  -  ${names.blue} ${pts.blue}てん`,
    ttl: win ? `ゆうしょう! ${Meet.MARK[win]} ${names[win]}` : "どうてん! りょうチーム ゆうしょう!",
    sub: win ? "おめでとう!! みんな よくがんばりました!" : "どちらも よくがんばりました!",
  });

  // きょうぎごとの けっかは ステージの 下に
  const list = $("finaleList");
  list.innerHTML = "";
  for (const l of log) {
    const li = document.createElement("div");
    li.className = "li";
    const ev = document.createElement("span");
    ev.className = "ev";
    ev.textContent = l.ev.name;
    const sc = document.createElement("span");
    sc.className = "sc";
    sc.textContent = l.res.label;
    const wn = document.createElement("span");
    wn.className = "wn" + (l.res.win ? " " + l.res.win : "");
    wn.textContent = l.res.win ? `${Meet.MARK[l.res.win]} ${names[l.res.win]}` : "ひきわけ";
    li.append(ev, sc, wn);
    list.appendChild(li);
  }
  list.classList.remove("hidden");

  const row = $("finaleRow");
  row.innerHTML = "";
  row.append(
    button("btn big pink", "もういちど うんどうかい!", () => { Sound.pon(); runProgramme(); }),
    button("btn big yellow", "せっていを かえる", () => { Sound.tap(); backToSetup(); }),
    button("btn gray", "トップへ", () => { Sound.tap(); location.href = "index.html"; }),
  );
  row.classList.remove("hidden");
  setTimeout(() => row.scrollIntoView({ behavior: "smooth", block: "end" }), 400);
}

function backToSetup() {
  runId++;
  Meet.stop();
  hideCard();
  $("banner").classList.add("hidden");
  $("finaleList").classList.add("hidden");
  $("finaleRow").classList.add("hidden");
  show("setupScreen");
  renderAll();
}

$("skipBtn").onclick = () => {
  Sound.tap();
  skipReq = true;
  Meet.stop();
};

/* ---- とくてんばん ---- */
function renderScore() {
  $("scNameRed").textContent = names.red;
  $("scNameBlue").textContent = names.blue;
  $("scPtRed").textContent = pts.red;
  $("scPtBlue").textContent = pts.blue;
}

/* ============================================================
   canvas の うえに かさねる カード
   ============================================================ */
function button(cls, label, fn) {
  const b = document.createElement("button");
  b.className = cls;
  b.type = "button";
  b.textContent = label;
  b.onclick = fn;
  return b;
}

/* o: {no, ttl, sub, icon, team} */
function card(o) {
  const box = $("over");
  box.className = "mt-over" + (o.clear ? " clear" : "");
  box.innerHTML = "";
  const c = document.createElement("div");
  c.className = "mt-card" + (o.team ? " " + o.team : "");
  if (o.icon) {
    const img = document.createElement("img");
    img.className = "ico";
    img.src = o.icon;
    img.alt = "";
    c.appendChild(img);
  }
  if (o.no) {
    const n = document.createElement("div");
    n.className = "no";
    n.textContent = o.no;
    c.appendChild(n);
  }
  const t = document.createElement("div");
  t.className = "ttl" + (o.team ? " " + o.team : "");
  t.textContent = o.ttl || "";
  c.appendChild(t);
  if (o.sub) {
    const s = document.createElement("div");
    s.className = "sub";
    s.textContent = o.sub;
    c.appendChild(s);
  }
  box.appendChild(c);
  return c;
}
function hideCard() { $("over").className = "mt-over hidden"; $("over").innerHTML = ""; }

/* まつ。ボタン(または がめんタッチ)で すぐ つぎへ すすめる */
function pause(ms, label) {
  return new Promise((resolve) => {
    const box = $("over");
    const c = box.querySelector(".mt-card");
    let done = false;
    const go = () => {
      if (done) return;
      done = true;
      clearTimeout(tid);
      box.removeEventListener("click", go);
      resolve();
    };
    if (c && label) {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(button("btn green", label + " ▶", () => { Sound.tap(); go(); }));
      c.appendChild(row);
    }
    box.addEventListener("click", go);
    const tid = setTimeout(go, ms);
  });
}

/* ---- 起動 ---- */
show("setupScreen");
initSetup();
</script>
</body>
</html>
