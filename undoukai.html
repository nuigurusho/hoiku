<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>うんどうかい</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="css/style.css?v=57">
<style>
  /* ===== うんどうかい(番組しんこう)だけの ちょうせい ===== */
  .uk-step {
    display: inline-block;
    background: var(--yellow);
    color: #7a5b00;
    font-size: 15px;
    font-weight: bold;
    border-radius: 999px;
    padding: 3px 14px;
    margin-bottom: 6px;
    box-shadow: 0 3px 0 var(--yellow-d);
  }
  .uk-panel { max-width: 900px; }
  .uk-mem { cursor: grab; touch-action: none; }
  .uk-mem:active { transform: scale(.94); }
  .uk-mem.dragging { opacity: .28; cursor: grabbing; }
  .mt-teamcol.drag-over {
    outline: 6px solid var(--yellow);
    outline-offset: 4px;
    transform: translateY(-3px);
  }
  .uk-drag-ghost {
    position: fixed;
    z-index: 300;
    width: 92px;
    margin: 0;
    pointer-events: none;
    transform: translate(-50%, -62%) rotate(-4deg) scale(1.06);
    filter: drop-shadow(0 10px 8px rgba(80,50,20,.24));
    opacity: .96;
  }
  .uk-skip { text-align: center; margin: 6px 0 0; }
  .uk-skip button { font-size: 14px; padding: 8px 16px; }
  .uk-timer {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    min-width: 104px;
    padding: 9px 18px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #6b5d4d;
    box-shadow: 0 3px 0 rgba(107,93,77,.18);
    font-size: clamp(24px, 3.2vw, 34px);
    font-weight: 800;
    line-height: 1;
    text-align: center;
    pointer-events: none;
  }
  /* 競技間だけを覆う虹色の幕。結果や説明は載せず、次のステージへ
     切り替わる瞬間だけを隠す。速度は RAINBOW_WIPE_MS で一括調整する。 */
  .uk-rainbow-transition {
    position: fixed;
    inset: 0;
    z-index: 500;
    overflow: hidden;
    visibility: hidden;
    pointer-events: none;
  }
  .uk-rainbow-transition.running { visibility: visible; pointer-events: auto; }
  .uk-rainbow-sheet {
    position: absolute;
    left: -160vw;
    top: -100vh;
    width: 420vw;
    height: 300vh;
    display: flex;
    flex-direction: column;
    transform: translate(-30%, -100%) rotate(-28deg);
    will-change: transform;
  }
  .uk-rainbow-transition.running .uk-rainbow-sheet {
    animation: ukRainbowWipe var(--uk-rainbow-ms) linear both;
  }
  .uk-rainbow-sheet span { flex: 1 1 0; min-height: 0; }
  .uk-rainbow-sheet span:nth-child(1) { background: #ff70a6; }
  .uk-rainbow-sheet span:nth-child(2) { background: #ff9f43; }
  .uk-rainbow-sheet span:nth-child(3) { background: #ffe45e; }
  .uk-rainbow-sheet span:nth-child(4) { background: #78d96b; }
  .uk-rainbow-sheet span:nth-child(5) { background: #56d6d2; }
  .uk-rainbow-sheet span:nth-child(6) { background: #62a8f6; }
  .uk-rainbow-sheet span:nth-child(7) { background: #aa7be8; }
  @keyframes ukRainbowWipe {
    0%, 10% { transform: translate(-30%, -100%) rotate(-28deg); }
    24% { transform: translate(-10%, -15%) rotate(-28deg); }
    50% { transform: translate(0, 0) rotate(-28deg); }
    76% { transform: translate(10%, 15%) rotate(-28deg); }
    90%, 100% { transform: translate(30%, 100%) rotate(-28deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .uk-rainbow-transition { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="index.html">← もどる</a>
  <h1><img class="bar-icon" src="assets/buttons/undoukai.png" alt=""> うんどうかい</h1>
  <div class="spacer"></div>
</header>

<main>
  <!-- ============ したく の がめん ============ -->
  <div id="setupScreen">
    <div class="panel uk-panel">
      <span class="uk-step">1</span>
      <h2 style="margin-top:0">さんかする キャラを えらんでね</h2>
      <p class="sel-count" id="selNote"></p>
      <div class="row compact select-all-actions"><button class="btn yellow select-all-btn" id="selectAllBtn">ぜんキャラ えらぶ</button><button class="btn gray select-all-btn" id="clearAllBtn">ぜんキャラ はずす</button></div>
      <div class="gallery" id="gallery"></div>
    </div>

    <div class="panel uk-panel">
      <span class="uk-step">2</span>
      <h2 style="margin-top:0">チームわけ</h2>
      <div class="uk-team-choice">
        <span>じぶんで チームを きめる</span>
        <button class="mt-toggle" id="teamMode" type="button" role="switch" aria-checked="false" aria-label="じぶんで チームを きめる"><span class="knob"></span></button>
      </div>
      <p class="note" id="autoTeamNote">はじまる まえに チームを はっぴょうします。</p>
      <div id="manualTeamUi" class="hidden">
        <p class="note">チーム名は タッチして かえられます。キャラは タッチ、または もう いっぽうへ ドラッグで うつせます。</p>
        <div class="mt-teams">
          <div class="mt-teamcol red">
            <input class="mt-teamname" id="nameRed" type="text" maxlength="12" value="あかチーム" aria-label="あかチームの なまえ">
            <div class="mt-members" id="redMembers"></div>
          </div>
          <div class="mt-vs">VS</div>
          <div class="mt-teamcol blue">
            <input class="mt-teamname" id="nameBlue" type="text" maxlength="12" value="あおチーム" aria-label="あおチームの なまえ">
            <div class="mt-members" id="blueMembers"></div>
          </div>
        </div>
        <div class="row"><button class="btn yellow" id="shuffleBtn">🎲 シャッフル</button></div>
      </div>
    </div>

    <div class="panel uk-panel">
      <span class="uk-step">3</span>
      <h2 style="margin-top:0">きょうぎを えらんでね</h2>
      <p class="note">オンにした きょうぎを、うえから じゅんばんに 再生します。</p>
      <div class="mt-rows" id="eventRows"></div>
      <div class="row"><button class="btn big green" id="goBtn">きめた！</button></div>
      <p class="note" id="goNote" style="font-size:16px;font-weight:bold;min-height:22px"></p>
    </div>
  </div>

  <!-- ============ ほんばん の がめん ============ -->
  <div id="playScreen" class="hidden">
    <!-- あそんでいる あいだ、ステージの 上には得点や進行を置かない。
         たまいれの残り時間だけ上部中央に出し、それ以外は競技のあいだの
         カード(インサート)の中で見せる。 -->
    <div class="mt-stage">
      <canvas id="cv" class="stage" width="1280" height="720"></canvas>
      <div class="uk-timer hidden" id="timer" aria-label="のこりじかん"></div>
      <div class="mt-banner hidden" id="banner"></div>
      <div class="mt-over hidden" id="over"></div>
    </div>
    <div class="row hidden uk-insert-actions" id="insertActionRow"></div>
    <div class="uk-skip hidden" id="skipRow"><button class="btn gray" id="skipBtn">けっかへ ▶</button></div>
    <div class="mt-list hidden" id="finaleList"></div>
    <div class="row hidden" id="finaleRow"></div>
  </div>
</main>

<div class="uk-rainbow-transition" id="rainbowTransition" aria-hidden="true">
  <div class="uk-rainbow-sheet">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<script src="js/core.js?v=44"></script>
<script src="js/rig.js?v=17"></script>
<script src="js/meet.js?v=20"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv");
const SAVE_KEY = "undoukai";

/* きょうぎ(この じゅんばんで 再生する) */
const EVENTS = [
  { key: "kakekko",   name: "かけっこ",       icon: "assets/buttons/race.png",      desc: "4にんずつ スタート。じゅんいが てんすうに なるよ" },
  { key: "tamaire",   name: "たまいれ",       icon: "assets/buttons/tamaire.png",   desc: "左右に わかれて かごに 玉入れ。おおく 入れた ほうの かち" },
  { key: "dodgeball", name: "ドッヂボール",   icon: "assets/buttons/dodgeball.png", desc: "コートで たいせん。さいごまで のこった ほうの かち" },
  { key: "relay",     name: "リレー",         icon: "assets/buttons/relay.png",     desc: "トラックを 1しゅうずつ バトンタッチ。さきに ゴール!" },
];
const WIN_PT = 2, DRAW_PT = 1;

const ui = Meet.ui({ banner: $("banner") });
/* 競技中は基本的にステージへ情報を重ねない。たまいれだけは区切りが
   分かるよう残り時間を上部中央へ出し、得点は結果カードまで隠す。 */
ui.hud = (s) => {
  hudLast = s;
  const sec = Number.isFinite(s.sec) ? s.sec : null;
  $("timer").textContent = sec == null ? "" : `⏱ ${sec}`;
  $("timer").classList.toggle("hidden", sec == null);
};

/* ---- したくの じょうたい ---- */
let allChars = [];
const sel = new Set();                 // さんかする キャラの id
const side = new Map();                // id → "red" / "blue"
const on = { kakekko: true, tamaire: true, dodgeball: true, relay: true };
const names = { red: "あかチーム", blue: "あおチーム" };
let teamMode = "auto";                 // auto: 開始前に発表 / manual: 準備画面で自分で分ける

/* ---- ほんばんの じょうたい ---- */
let actors = null;
let pts = { red: 0, blue: 0 };
let log = [];                          // [{ev, res}]
let runId = 0;
let skipReq = false;

const SCREENS = ["setupScreen", "playScreen"];
function show(id) { for (const s of SCREENS) $(s).classList.toggle("hidden", s !== id); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const RAINBOW_WIPE_MS = 1050;

/* 虹が画面を覆う中央で、次の競技を裏側から開始する。低速区間でも止めず、
   最後の加速前にも速度0のイージングを入れない。 */
async function rainbowTransition(swap) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    swap();
    return;
  }
  const layer = $("rainbowTransition");
  layer.style.setProperty("--uk-rainbow-ms", `${RAINBOW_WIPE_MS}ms`);
  layer.classList.remove("running");
  void layer.offsetWidth;
  layer.classList.add("running");
  await sleep(RAINBOW_WIPE_MS * .5);
  swap();
  await sleep(RAINBOW_WIPE_MS * .5 + 40);
  layer.classList.remove("running");
}

/* ============================================================
   したく:1. さんかする キャラ
   ============================================================ */
async function initSetup() {
  const recs = await Store.forGame();
  allChars = recs.filter((r) => r.cat === "char");
  const saved = load();
  if (saved && saved.side) {
    for (const r of allChars) {
      const s = saved.side[r.id];
      if (s === "red" || s === "blue") { sel.add(r.id); side.set(r.id, s); }
    }
  }
  if (!sel.size) { for (const r of allChars) sel.add(r.id); balance(); }
  renderAll();
}

function renderAll() { renderNames(); renderGallery(); renderTeams(); renderTeamMode(); renderEvents(); refreshGo(); save(); }

function renderGallery() {
  const el = $("gallery");
  el.innerHTML = "";
  for (const r of allChars) {
    const d = document.createElement("div");
    d.className = "thumb" + (sel.has(r.id) ? " selected" : "");
    d.innerHTML = `<img src="${r.dataURL}" alt=""><div class="name"></div>`;
    d.querySelector(".name").textContent = r.name || "";
    Ui.thumbFix(d.querySelector("img"), r);
    d.onclick = () => {
      Sound.tap();
      if (sel.has(r.id)) { sel.delete(r.id); side.delete(r.id); }
      else { sel.add(r.id); side.set(r.id, count("red") <= count("blue") ? "red" : "blue"); }
      fixTeams();
      renderAll();
    };
    el.appendChild(d);
  }
  const note = $("selNote");
  const few = sel.size < 2;
  note.className = "sel-count" + (few ? " few" : "");
  note.innerHTML = `<span class="n">${sel.size}</span>にん せんたくちゅう`
    + (few ? `<span class="sub">あと ${2 - sel.size}にん えらんでね</span>` : "");
}

/* ============================================================
   したく:2. チームわけ(なまえは じゆうに かえられる)
   ============================================================ */
function count(key) { let n = 0; for (const [, s] of side) if (s === key) n++; return n; }
function members(key) {
  return allChars
    .filter((r) => sel.has(r.id) && side.get(r.id) === key)
    .map((r) => ({ rec: r, name: r.name || "", voices: r.voices || null }));
}
/* かたほうの チームが 0にんに なったら、もう いっぽうから 1にん うつす */
function fixTeams() {
  for (const key of ["red", "blue"]) {
    const other = key === "red" ? "blue" : "red";
    while (count(key) === 0 && count(other) > 1) {
      const m = members(other)[members(other).length - 1];
      side.set(m.rec.id, key);
    }
  }
}
function balance() {
  const ids = Util.shuffle([...sel]);
  side.clear();
  ids.forEach((id, i) => side.set(id, i % 2 === 0 ? "red" : "blue"));
}

let activeTeamDrag = null;
function clearTeamDropCues() {
  document.querySelectorAll(".mt-teamcol.drag-over").forEach((el) => el.classList.remove("drag-over"));
}
function teamDropTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest(".mt-teamcol[data-team]") : null;
}
function moveTeamMember(id, from, to) {
  if (!to || to === from) return false;
  side.set(id, to);
  Sound.pon();
  renderAll();
  return true;
}

function renderTeams() {
  for (const key of ["red", "blue"]) {
    const box = $(key === "red" ? "redMembers" : "blueMembers");
    const col = box.closest(".mt-teamcol");
    col.dataset.team = key;
    box.innerHTML = "";
    for (const m of members(key)) {
      const d = document.createElement("div");
      d.className = "mt-mem uk-mem";
      d.title = "タッチ、または もう いっぽうへ ドラッグ";
      d.innerHTML = `<img src="${m.rec.dataURL}" alt=""><div class="nm"></div>`;
      d.querySelector(".nm").textContent = m.name;
      Ui.thumbFix(d.querySelector("img"), m.rec);
      d.onclick = () => {
        if (d._skipTeamClick) return;
        Sound.tap();
        side.set(m.rec.id, key === "red" ? "blue" : "red");
        renderAll();          // 0にんに なるのは わざと えらんだ ときだけ(けっていで しらせる)
      };
      d.onpointerdown = (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        activeTeamDrag = {
          id: m.rec.id, from: key, el: d, pointerId: e.pointerId,
          sx: e.clientX, sy: e.clientY, dragging: false, ghost: null,
        };
        if (d.setPointerCapture) d.setPointerCapture(e.pointerId);
      };
      d.onpointermove = (e) => {
        const drag = activeTeamDrag;
        if (!drag || drag.el !== d || drag.pointerId !== e.pointerId) return;
        if (!drag.dragging && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) {
          drag.dragging = true;
          d.classList.add("dragging");
          drag.ghost = d.cloneNode(true);
          drag.ghost.className = "mt-mem uk-drag-ghost";
          document.body.appendChild(drag.ghost);
        }
        if (!drag.dragging) return;
        e.preventDefault();
        drag.ghost.style.left = `${e.clientX}px`;
        drag.ghost.style.top = `${e.clientY}px`;
        clearTeamDropCues();
        const target = teamDropTarget(e.clientX, e.clientY);
        if (target && target.dataset.team !== key) target.classList.add("drag-over");
      };
      const endDrag = (e, cancelled) => {
        const drag = activeTeamDrag;
        if (!drag || drag.el !== d || drag.pointerId !== e.pointerId) return;
        activeTeamDrag = null;
        clearTeamDropCues();
        d.classList.remove("dragging");
        if (drag.ghost) drag.ghost.remove();
        if (d.releasePointerCapture && d.hasPointerCapture && d.hasPointerCapture(e.pointerId)) d.releasePointerCapture(e.pointerId);
        if (!drag.dragging) return;
        d._skipTeamClick = true;
        if (cancelled) return;
        const target = teamDropTarget(e.clientX, e.clientY);
        moveTeamMember(drag.id, drag.from, target && target.dataset.team);
      };
      d.onpointerup = (e) => endDrag(e, false);
      d.onpointercancel = (e) => endDrag(e, true);
      box.appendChild(d);
    }
  }
}

function renderTeamMode() {
  const toggle = $("teamMode");
  const manual = teamMode === "manual";
  toggle.classList.toggle("on", manual);
  toggle.setAttribute("aria-checked", String(manual));
  $("manualTeamUi").classList.toggle("hidden", teamMode !== "manual");
  $("autoTeamNote").classList.toggle("hidden", teamMode !== "auto");
}

$("teamMode").onclick = () => {
  teamMode = teamMode === "manual" ? "auto" : "manual";
  if (teamMode === "auto") balance();
  Sound.tap();
  renderAll();
};

$("selectAllBtn").onclick = () => {
  Sound.tap();
  for (const r of allChars) {
    if (!sel.has(r.id)) side.set(r.id, count("red") <= count("blue") ? "red" : "blue");
    sel.add(r.id);
  }
  fixTeams();
  renderAll();
};
$("clearAllBtn").onclick = () => {
  Sound.tap();
  sel.clear();
  side.clear();
  renderAll();
};

function renderNames() {
  for (const key of ["red", "blue"]) $(key === "red" ? "nameRed" : "nameBlue").value = names[key];
}
for (const key of ["red", "blue"]) {
  const el = $(key === "red" ? "nameRed" : "nameBlue");
  el.oninput = () => {
    names[key] = el.value.trim() || (key === "red" ? "あかチーム" : "あおチーム");
    save();
  };
}
$("shuffleBtn").onclick = () => { Sound.pon(); balance(); renderAll(); };

/* ============================================================
   したく:3. きょうぎの オン・オフ
   ============================================================ */
function renderEvents() {
  const box = $("eventRows");
  box.innerHTML = "";
  EVENTS.forEach((ev, i) => {
    const row = document.createElement("div");
    row.className = "mt-row" + (on[ev.key] ? "" : " off");
    row.innerHTML = `
      <img class="ico" src="${ev.icon}" alt="">
      <div class="txt"><b></b><span></span></div>
      <button class="mt-toggle${on[ev.key] ? " on" : ""}" type="button" role="switch"
              aria-checked="${on[ev.key]}"><span class="knob"></span></button>`;
    row.querySelector("b").textContent = `${i + 1}. ${ev.name}`;
    row.querySelector(".txt span").textContent = ev.desc;
    row.querySelector(".mt-toggle").onclick = () => {
      Sound.tap();
      on[ev.key] = !on[ev.key];
      renderEvents();
      refreshGo();
      save();
    };
    box.appendChild(row);
  });
}

function chosen() { return EVENTS.filter((e) => on[e.key]); }

function refreshGo() {
  const list = chosen();
  const note = $("goNote"), btn = $("goBtn");
  let ng = "";
  if (count("red") < 1 || count("blue") < 1) ng = "どちらの チームにも 1にん いじょう 入れてね";
  else if (!list.length) ng = "きょうぎを 1つ いじょう オンにしてね";
  btn.disabled = !!ng;
  note.textContent = ng || `ぜん${list.length}きょうぎ:${list.map((e) => e.name).join(" → ")}`;
  note.style.color = ng ? "#d6336c" : "#2f9e44";
}

/* ---- したくの ほぞん(この たんまつの中だけ) ---- */
function save() {
  try {
    const s = {};
    for (const [id, v] of side) if (sel.has(id)) s[id] = v;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ names, on, side: s, teamMode }));
  } catch (e) { /* つかえなくても もんだいなし */ }
}
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (!o) return null;
    if (o.names) { names.red = o.names.red || names.red; names.blue = o.names.blue || names.blue; }
    if (o.on) for (const k of Object.keys(on)) if (typeof o.on[k] === "boolean") on[k] = o.on[k];
    if (o.teamMode === "manual" || o.teamMode === "auto") teamMode = o.teamMode;
    return o;
  } catch (e) { return null; }
}

/* ============================================================
   ほんばん:オンの きょうぎを じゅんばんに 再生
   ============================================================ */
$("goBtn").onclick = () => {
  if ($("goBtn").disabled) { Sound.bad(); return; }
  Sound.pon();
  runProgramme();
};

/* たて画面だと ステージ(よこ16:9)が とても 小さくなる。
   はじめる ときに 1回だけ「よこむきに してね」と おねがいする
   (「このままで いい」で 閉じられる)。 */
let askedRotate = false;
function askLandscape() {
  if (askedRotate || innerWidth > innerHeight) return;
  askedRotate = true;
  Rotate.ask();
}

function teamText(key) {
  const span = document.createElement("span");
  span.className = "uk-team-text " + key;
  span.textContent = names[key];
  return span;
}

function teamVersus() {
  const line = document.createElement("div");
  line.className = "uk-versus-line";
  line.append(teamText("red"), document.createTextNode(" VS "), teamText("blue"));
  return line;
}

async function autoTeamReveal(myRun) {
  const c = card({ clear: true, no: "チームわけ", ttl: "チームが きまったよ" });
  const teams = document.createElement("div");
  teams.className = "mt-teams uk-team-reveal";
  const lists = {};
  for (const key of ["red", "blue"]) {
    if (key === "blue") {
      const vs = document.createElement("div");
      vs.className = "mt-vs";
      vs.textContent = "VS";
      teams.appendChild(vs);
    }
    const col = document.createElement("div");
    col.className = "mt-teamcol " + key;
    const title = document.createElement("h3");
    title.textContent = names[key];
    const list = document.createElement("div");
    list.className = "mt-members";
    lists[key] = list;
    col.append(title, list);
    teams.appendChild(col);
  }
  c.appendChild(teams);

  const red = members("red"), blue = members("blue");
  const order = [];
  for (let i = 0; i < Math.max(red.length, blue.length); i++) {
    if (red[i]) order.push(["red", red[i]]);
    if (blue[i]) order.push(["blue", blue[i]]);
  }
  await sleep(350);
  for (const [key, m] of order) {
    if (myRun !== runId) return false;
    Meet.drumroll();
    await sleep(300);
    if (myRun !== runId) return false;
    const d = document.createElement("div");
    d.className = "mt-mem";
    d.innerHTML = `<img src="${m.rec.dataURL}" alt=""><div class="nm"></div>`;
    d.querySelector(".nm").textContent = m.name;
    Ui.thumbFix(d.querySelector("img"), m.rec);
    lists[key].appendChild(d);
    Sound.pon();
    await sleep(170);
  }
  return myRun === runId;
}

async function runProgramme() {
  const myRun = ++runId;
  askLandscape();
  const list = chosen();
  pts = { red: 0, blue: 0 };
  log = [];
  $("banner").classList.add("hidden");
  $("timer").classList.add("hidden");
  $("skipRow").classList.add("hidden");
  $("insertActionRow").classList.add("hidden");
  $("finaleList").classList.add("hidden");
  $("finaleRow").classList.add("hidden");
  hudLast = null;

  if (teamMode === "auto") {
    balance();
    renderTeams();
    save();
  }

  actors = await Meet.actors({ red: members("red"), blue: members("blue") });
  if (myRun !== runId) return;
  show("playScreen");

  if (teamMode === "auto") {
    if (!(await autoTeamReveal(myRun))) return;
    await pause(0, "はじめる");
    if (myRun !== runId) return;
  }

  for (let i = 0; i < list.length; i++) {
    const ev = list[i];

    // 競技紹介カードは挟まず、虹が覆った中央で次のステージへ切り替える。
    let eventRun = null;
    const startEvent = () => {
      hideCard();
      hudLast = null;
      $("skipRow").classList.remove("hidden");
      skipReq = false;
      eventRun = Meet.run({ key: ev.key, cv, actors, names, ui, quick: true });
    };
    if (i === 0) startEvent();
    else await rainbowTransition(startEvent);
    if (myRun !== runId) return;
    let res = await eventRun;
    if (myRun !== runId) return;
    $("timer").classList.add("hidden");
    $("skipRow").classList.add("hidden");
    if (!res) {
      if (!skipReq) return;                       // やめた
      res = { win: null, score: { red: 0, blue: 0 }, label: "とばした" };
    }

    // --- きまった しゅんかん:光らせて「ま」を つくる ---
    await breakBeat();
    if (myRun !== runId) return;

    // --- てんすう(そうごう点は ここでは 出さない) ---
    if (res.win) pts[res.win] += WIN_PT;
    else { pts.red += DRAW_PT; pts.blue += DRAW_PT; }
    const entry = { ev, res, hud: hudLast };
    log.push(entry);

    // 単発競技と同じく、勝ったキャラが喜ぶ画面を競技ごとに使う。
    const everyone = actors.red.concat(actors.blue);
    Meet.celebrate({ cv, members: everyone, teamKey: res.win, trophy: false });

    const lastOne = i === list.length - 1;
    const nextEvent = list[i + 1] || null;
    const resultCard = card({
      top: true,
      reveal: true,
      ttlParts: res.win ? [teamText(res.win), "の かち！"] : ["ひきわけ！"],
    });
    addEventResultFlow(resultCard, ev, () => openEventDetails(entry));
    if (res.win) { Sound.good(); Ui.confetti(1400, 70); }
    await pause(0, lastOne ? "けっかへ" : "つぎへ", [], nextEventLine(nextEvent));
    if (myRun !== runId) return;
  }

  finale(myRun);
}

/* ---- そうごう ゆうしょう はっぴょう ---- */
async function finale(myRun) {
  $("skipRow").classList.add("hidden");

  // ためて…
  card({ top: true, reveal: true, no: "けっかはっぴょう", ttl: "ゆうしょうは…?", sub: "ドキドキ…" });
  Meet.drumroll();
  await sleep(700); Meet.drumroll();
  await sleep(700); Meet.drumroll();
  await sleep(900);
  if (myRun !== runId) return;

  const win = pts.red === pts.blue ? null : (pts.red > pts.blue ? "red" : "blue");
  /* まけた チームも がめんに のこす。くらくする かわりに、かった チームだけ
     とびはねさせて ちがいを 出す(まけた子の えも ちゃんと 見えるように) */
  const everyone = actors.red.concat(actors.blue);
  const cheering = win ? actors[win].slice() : everyone;
  Meet.celebrate({ cv, members: everyone, teamKey: win });

  Sound.fanfare();
  Ui.confetti(5000, 260);
  setTimeout(() => Ui.confetti(4000, 200), 1200);
  for (const a of cheering) if (a.voices) { Sound.playVoice(a.voices, ["joy"]); break; }

  // canvas の うえには タイトルだけ(みんなの おいわいが 見えるように)
  card({
    clear: true,
    reveal: true,
    no: "けっかはっぴょう",
    ttlParts: win ? [teamText(win), " ゆうしょう！"] : ["みんな ゆうしょう！"],
    scoreFirst: true,
    score: pts,                       // そうごう点は ここで 1回だけ 大きく
    detailFn: () => openFinalDetails(),
  });

  const row = $("finaleRow");
  row.innerHTML = "";
  row.append(
    button("btn big green", "もういちど", () => { Sound.pon(); runProgramme(); }),
    button("btn big yellow", "やりなおす", () => { Sound.tap(); backToSetup(); }),
  );
  row.classList.remove("hidden");
  setTimeout(() => row.scrollIntoView({ behavior: "smooth", block: "end" }), 400);
}

function backToSetup() {
  runId++;
  Meet.stop();
  hideCard();
  $("banner").classList.add("hidden");
  $("timer").classList.add("hidden");
  $("insertActionRow").classList.add("hidden");
  $("finaleList").classList.add("hidden");
  $("finaleRow").classList.add("hidden");
  show("setupScreen");
  renderAll();
}

/* 「けっかへ」… その きょうぎを その場で さいごまで すすめて、
   ふつうに かちまけを つけてから けっかカードへ 行く。
   早おくりが できない ときだけ、これまでどおり とばす。 */
$("skipBtn").onclick = () => {
  Sound.tap();
  $("skipRow").classList.add("hidden");
  if (Meet.rush()) return;
  skipReq = true;
  Meet.stop();
};

/* ============================================================
   きょうぎの あいだの インサート(まちうけ)で つかう ぶひん
   ・あそんでいる あいだ、ステージの 上には なにも 出さない
   ・てんすうと すすみぐあいは、けっか/しょうかいの カードの 中で 見せる
   ============================================================ */
let hudLast = null;              // きょうぎが おわった ときの すうじ

const ARROW = '<svg class="arrow" width="13" height="13" viewBox="0 0 12 12" aria-hidden="true">'
  + '<path d="M4 2.4 L8 6 L4 9.6" fill="none" stroke="#8a7a68" stroke-width="2.3"'
  + ' stroke-linecap="round" stroke-linejoin="round"></path></svg>';
const CHECK = '<svg class="done" viewBox="0 0 16 16" aria-hidden="true">'
  + '<circle cx="8" cy="8" r="7" fill="#51cf66" stroke="#fff" stroke-width="2"></circle>'
  + '<path d="M4.6 8.2 L7 10.6 L11.4 5.6" fill="none" stroke="#fff" stroke-width="2.2"'
  + ' stroke-linecap="round" stroke-linejoin="round"></path></svg>';

/* きょうぎの ならび。cur ばんめが いま。done なら cur も おわったことに する。
   まる い だけの しるしでは 何の きょうぎか わからないので、
   しょうかいカードや したく画面と おなじ アイコンを そのまま つかう。 */
function progRow(cur, done) {
  const row = document.createElement("div");
  row.className = "uk-prog";
  chosen().forEach((ev, i) => {
    if (i) row.insertAdjacentHTML("beforeend", ARROW);
    const past = done ? i <= cur : i < cur;
    const d = document.createElement("div");
    d.className = "ev " + (past ? "past" : i === cur ? "now" : "next");
    d.innerHTML = `<img src="${ev.icon}" alt="${ev.name}">` + (past ? CHECK : "");
    row.appendChild(d);
  });
  return row;
}

/* きょうぎの すうじを チームの 色の チップで 見せる */
function chipRow(s) {
  if (!s || !s.n || s.n.red == null || s.n.blue == null) return null;
  const row = document.createElement("div");
  row.className = "uk-chips";
  row.innerHTML =
    `<span class="uk-chip red"><span class="lbl"></span><span class="n">${s.n.red}</span>`
    + `<span class="u">${(s.unit && s.unit.red) || ""}</span></span>`
    + `<span class="uk-chip blue"><span class="n">${s.n.blue}</span>`
    + `<span class="u">${(s.unit && s.unit.blue) || ""}</span><span class="lbl"></span></span>`;
  row.querySelector(".red .lbl").textContent = names.red;
  row.querySelector(".blue .lbl").textContent = names.blue;
  return row;
}

/* きまった しゅんかん:白く 光らせて、すこし 「ま」を つくる。
   ここが きょうぎの きれめだと からだで わかるようにする。 */
async function breakBeat() {
  Sound.tick();
  ui.banner(null);
  await sleep(180);
}


/* ============================================================
   canvas の うえに かさねる カード
   ============================================================ */
function button(cls, label, fn) {
  const b = document.createElement("button");
  b.className = cls;
  b.type = "button";
  b.textContent = label;
  b.onclick = fn;
  return b;
}

function detailButton(fn) {
  const b = button("info-button", "i", (e) => {
    e.stopPropagation();
    Sound.tap();
    fn();
  });
  b.setAttribute("aria-label", "しょうさい");
  b.title = "しょうさい";
  return b;
}

function addEventResultFlow(host, current, onDetail) {
  const heading = document.createElement("div");
  heading.className = "uk-result-heading";
  const icon = document.createElement("img");
  icon.src = current.icon;
  icon.alt = "";
  heading.append(icon, document.createTextNode(`${current.name}の けっか`), detailButton(onDetail));
  host.insertBefore(heading, host.firstChild);
}

function nextEventLine(next) {
  const nextLine = document.createElement("div");
  nextLine.className = "uk-next-event";
  const label = document.createElement("span");
  label.textContent = next ? "つぎの きょうぎ：" : "つぎ：";
  nextLine.appendChild(label);
  if (next) {
    const nextIcon = document.createElement("img");
    nextIcon.src = next.icon;
    nextIcon.alt = "";
    nextLine.append(nextIcon, document.createTextNode(next.name));
  } else {
    nextLine.appendChild(document.createTextNode("けっかはっぴょう"));
  }
  return nextLine;
}

function openDetails(title, fill) {
  const wrap = document.createElement("div");
  wrap.className = "modal uk-detail-modal";
  const panel = document.createElement("div");
  panel.className = "panel has-modal-x";
  const close = button("modal-x", "×", () => { Sound.tap(); wrap.remove(); });
  close.setAttribute("aria-label", "とじる");
  const h = document.createElement("h2");
  h.textContent = title;
  panel.append(close, h);
  fill(panel);
  wrap.appendChild(panel);
  wrap.addEventListener("click", (e) => { if (e.target === wrap) close.click(); });
  document.body.appendChild(wrap);
}

function openEventDetails(entry) {
  openDetails(`${entry.ev.name}の けっか`, (panel) => {
    const teams = document.createElement("div");
    teams.className = "uk-detail-teams";
    for (const key of ["red", "blue"]) {
      const data = document.createElement("div");
      data.className = `uk-detail-team ${key}`;
      const name = document.createElement("div");
      name.className = "nm";
      name.textContent = names[key];
      const metric = document.createElement("div");
      metric.className = "metric";
      const value = entry.hud && entry.hud.n && entry.hud.n[key] != null
        ? entry.hud.n[key] : ((entry.res.score && entry.res.score[key]) || 0);
      const unit = entry.hud && entry.hud.unit ? (entry.hud.unit[key] || "") : "";
      metric.textContent = `${value}${unit}`;
      const point = document.createElement("div");
      point.className = "point";
      const added = entry.res.win ? (entry.res.win === key ? WIN_PT : 0) : DRAW_PT;
      point.textContent = `+${added}てん`;
      data.append(name, metric, point);
      teams.appendChild(data);
    }
    panel.appendChild(teams);
  });
}

function openFinalDetails() {
  openDetails("けっかの しょうさい", (panel) => {
    const list = document.createElement("div");
    list.className = "uk-final-detail-list";
    for (const entry of log) {
      const li = document.createElement("div");
      li.className = "uk-final-detail-event";
      const head = document.createElement("div");
      head.className = "head";
      head.innerHTML = `<img src="${entry.ev.icon}" alt=""><b></b>`;
      head.querySelector("b").textContent = entry.ev.name;
      const teams = document.createElement("div");
      teams.className = "uk-final-detail-teams";
      for (const key of ["red", "blue"]) {
        const value = entry.hud && entry.hud.n && entry.hud.n[key] != null
          ? entry.hud.n[key] : ((entry.res.score && entry.res.score[key]) || 0);
        const unit = entry.hud && entry.hud.unit ? (entry.hud.unit[key] || "") : "";
        const added = entry.res.win ? (entry.res.win === key ? WIN_PT : 0) : DRAW_PT;
        const team = document.createElement("div");
        team.className = `team ${key}`;
        team.innerHTML = `<span class="nm"></span><strong>${value}<small>${unit}</small></strong><span class="point">+${added}てん</span>`;
        team.querySelector(".nm").textContent = names[key];
        teams.appendChild(team);
      }
      li.append(head, teams);
      list.appendChild(li);
    }
    panel.appendChild(list);
  });
}

/* o: {no, ttl, sub, icon, team, clear, top, reveal, score, scoreFirst, chips}
   top   … まんなかではなく 上1/3に よせる(キャラを かくさない)
   score … そうごう点。うんどうかいで 1回だけ、さいごに 大きく 出す
   chips … その きょうぎの すうじ(チームの 色の チップ) */
function card(o) {
  const box = $("over");
  box.className = "mt-over" + (o.clear ? " clear" : "") + (o.top ? " top" : "") + (o.reveal ? " result-reveal" : "");
  box.innerHTML = "";
  const c = document.createElement("div");
  c.className = "mt-card" + (o.team ? " " + o.team : "") + (o.reveal ? " result-reveal" : "");
  if (o.icon) {
    const img = document.createElement("img");
    img.className = "ico";
    img.src = o.icon;
    img.alt = "";
    c.appendChild(img);
  }
  if (o.no) {
    const n = document.createElement("div");
    n.className = "no";
    n.textContent = o.no;
    c.appendChild(n);
  }
  const t = document.createElement("div");
  t.className = "ttl" + (o.team ? " " + o.team : "");
  if (o.ttlParts) {
    for (const part of o.ttlParts) t.append(part instanceof Node ? part : document.createTextNode(part));
  } else {
    t.textContent = o.ttl || "";
  }
  if (!o.scoreFirst) c.appendChild(t);
  if (o.score) {
    const sc = document.createElement("div");
    sc.className = "uk-total";
    sc.innerHTML =
      `<span class="side red"><span class="nm"></span><span class="pt">${o.score.red}</span></span>`
      + `<span class="mid">-</span>`
      + `<span class="side blue"><span class="pt">${o.score.blue}</span><span class="nm"></span></span>`;
    sc.querySelector(".red .nm").textContent = names.red;
    sc.querySelector(".blue .nm").textContent = names.blue;
    if (o.detailFn) sc.appendChild(detailButton(o.detailFn));
    c.appendChild(sc);
  }
  if (o.scoreFirst) c.appendChild(t);
  if (o.chips) {
    const row = chipRow(o.chips);
    if (row) c.appendChild(row);
  }
  if (o.sub) {
    const s = document.createElement("div");
    s.className = "sub";
    s.textContent = o.sub;
    c.appendChild(s);
  }
  box.appendChild(c);
  return c;
}
function hideCard() { $("over").className = "mt-over hidden"; $("over").innerHTML = ""; }

/* まつ。操作ボタンはステージの外、画面下中央へ置く。
   ms=0 は結果を読み終えてボタンを押すまで自動で進めない。 */
function pause(ms, label, extras = [], lead = null) {
  return new Promise((resolve) => {
    const row = $("insertActionRow");
    let done = false;
    const go = () => {
      if (done) return;
      done = true;
      if (tid) clearTimeout(tid);
      row.classList.add("hidden");
      row.innerHTML = "";
      resolve();
    };
    row.innerHTML = "";
    const stack = document.createElement("div");
    stack.className = "uk-action-stack";
    if (lead) stack.appendChild(lead);
    const buttons = document.createElement("div");
    buttons.className = "row compact";
    for (const b of extras) buttons.appendChild(b);
    if (label) {
      buttons.appendChild(button("btn green", label, () => { Sound.tap(); go(); }));
      stack.appendChild(buttons);
      row.appendChild(stack);
      row.classList.remove("hidden");
    }
    const tid = ms > 0 ? setTimeout(go, ms) : 0;
  });
}

/* ---- 起動 ---- */
addEventListener("DOMContentLoaded", () => {
  const back = document.querySelector(".back-float");
  if (!back) return;
  back.title = "もどる";
  back.setAttribute("aria-label", "もどる");
});
show("setupScreen");
initSetup();
</script>
