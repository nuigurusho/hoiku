<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うんどうかい・虹色ななめワイプ</title>
<style>
@font-face{font-family:Rounded;src:url(../assets/fonts/RoundedMplus1c-ExtraBold.woff2)}
@font-face{font-family:Pop;src:url(../assets/fonts/MochiyPopOne-Regular.woff2)}
:root{--ink:#4a3f35;--paper:#fffaf0;--line:#ead7b8;--yellow:#ffd43b;--green:#2ecc71}
*{box-sizing:border-box}body{margin:0;background:#f4ead9;color:var(--ink);font-family:Rounded,"M PLUS Rounded 1c",sans-serif}
main{width:min(1080px,96vw);margin:28px auto 56px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}h1{margin:0;font:400 clamp(28px,4vw,47px)/1.25 Pop,sans-serif}.lead{margin:8px 0 0;color:#756554;font-size:18px}.tag{padding:7px 15px 9px;border-radius:999px;background:var(--yellow);box-shadow:0 4px 0 #d7a700;white-space:nowrap}
.board{padding:16px;background:#fff;border:4px solid var(--line);border-radius:27px;box-shadow:0 8px 0 var(--line)}.demo{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:20px;isolation:isolate;background:#bde7ff}.scene{position:absolute;inset:0;overflow:hidden}.scene::before{content:"";position:absolute;left:0;right:0;top:39%;bottom:0;background:#91d673}.cloud{position:absolute;width:140px;height:42px;top:10%;left:8%;border-radius:999px;background:#ffffffb0;box-shadow:540px 45px 0 -7px #ffffff91}.track{position:absolute;left:12%;right:12%;bottom:-18%;height:61%;border:45px solid #e6a067;border-radius:50%;box-shadow:inset 0 0 0 4px #ffffffc4}.scene-old{animation:oldScene 4.8s steps(1,end) infinite}.scene-new{opacity:0;background:#ccecff;animation:newScene 4.8s steps(1,end) infinite}.scene-new::before{background:#89d46f}.scene-new .track{display:none}.scene-new .court{position:absolute;left:10%;right:10%;bottom:9%;height:39%;border-radius:28px;background:#efc884;border:5px solid #fff}.scene-new .basket{position:absolute;z-index:2;left:50%;bottom:25%;transform:translateX(-50%);font-size:84px}.label{position:absolute;z-index:3;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 17px 9px;border-radius:999px;background:#fff;box-shadow:0 4px 0 #75582e24;font-size:22px;white-space:nowrap}.label img{width:43px;height:43px;object-fit:contain}
.rainbow{position:absolute;z-index:10;left:-160%;top:-100%;width:420%;height:300%;display:flex;flex-direction:column;transform:translate(-30%,-100%) rotate(-28deg);filter:drop-shadow(0 7px 0 #5c40252a);animation:rainbowWipe 4.8s linear infinite;will-change:transform}.stripe{flex:1 1 0;min-height:0}.stripe:nth-child(1){background:#ff70a6}.stripe:nth-child(2){background:#ff9f43}.stripe:nth-child(3){background:#ffe45e}.stripe:nth-child(4){background:#78d96b}.stripe:nth-child(5){background:#56d6d2}.stripe:nth-child(6){background:#62a8f6}.stripe:nth-child(7){background:#aa7be8}.rainbow::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffffff00 0 40%,#ffffff32 50%,#ffffff00 60%);transform:skewX(-12deg)}
@keyframes rainbowWipe{0%,10%{transform:translate(-30%,-100%) rotate(-28deg)}24%{transform:translate(-10%,-15%) rotate(-28deg)}50%{transform:translate(0,0) rotate(-28deg)}76%{transform:translate(10%,15%) rotate(-28deg)}90%,100%{transform:translate(30%,100%) rotate(-28deg)}}
@keyframes oldScene{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes newScene{0%,48%{opacity:0}49%,100%{opacity:1}}
.caption{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:15px 4px 2px}.caption h2{margin:0;font:400 25px Pop,sans-serif}.caption p{margin:4px 0 0;color:#746452}.replay{border:0;border-radius:999px;background:var(--green);color:#fff;padding:12px 22px 14px;font:800 17px Rounded;box-shadow:0 5px 0 #159447;cursor:pointer}.timing{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:20px}.step{padding:14px 16px;background:#fff;border:3px solid var(--line);border-radius:18px;line-height:1.55}.step b{color:#8d5d00}.note{margin-top:16px;padding:15px 18px;border-radius:18px;background:#fff4c7;border:3px solid #efca3c;line-height:1.65}
@media(max-width:720px){.head,.caption{display:block}.tag{display:inline-block;margin-top:10px}.timing{grid-template-columns:1fr}.caption .replay{margin-top:12px}.label{font-size:16px}.label img{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){.rainbow,.scene{animation-play-state:paused;animation-delay:-2.5s}}
</style>
</head>
<body>
<main>
  <div class="head"><div><h1>虹色ななめワイプ・パターン5</h1><p class="lead">全面を覆うまでは速く、紫からピンクまでをゆっくり見せ、そのまま加速して抜けます。</p></div><span class="tag">緩急範囲を修正</span></div>
  <section class="board">
    <div class="demo" id="demo">
      <div class="scene scene-old"><div class="cloud"></div><div class="track"></div><div class="label"><img src="../assets/buttons/race.png" alt="">かけっこ</div></div>
      <div class="scene scene-new"><div class="cloud"></div><div class="court"></div><div class="basket">🧺</div><div class="label"><img src="../assets/buttons/tamaire.png" alt="">たまいれ</div></div>
      <div class="rainbow"><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i></div>
    </div>
    <div class="caption"><div><h2>文字を載せない「切り替え専用の幕」</h2><p>虹色が抜けたあと、次の画面側で「よーい…」を表示します。</p></div><button class="replay" id="replay">もういちど みる</button></div>
  </section>
  <div class="timing"><div class="step"><b>速く入る</b><br>右下に紫が届き、画面全体を覆うところまで一気に入る</div><div class="step"><b>ゆっくり見せる</b><br>紫が右下に来た状態から、ピンクが左上に来るまで止まらず流す</div><div class="step"><b>そのまま加速</b><br>速度をゼロにせず、その地点から右下の画面外へ抜ける</div></div>
  <div class="note">説明や競技名をトランジションへ重ねないため、読ませる時間は不要です。約0.82秒で完結し、白いフラッシュも完全に隠せます。</div>
</main>
<script>document.getElementById("replay").onclick=()=>{const d=document.getElementById("demo"),c=d.cloneNode(true);d.replaceWith(c)}</script>
</body>
</html>
