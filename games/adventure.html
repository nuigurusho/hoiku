<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>おえかきのたび</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=60">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/adventure.png" alt=""> おえかきのたび</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="selectScreen">
    <div class="panel">
      <h2>あそびかたを えらんでね</h2>

      <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ</div>
      <div class="row"><button class="btn big blue" data-mode="ren">れんしゅう</button></div>

      <div class="mode-sec">🔥 ガチンコ</div>
      <div class="row" id="gachiRow">
        <button class="btn big green"  data-mode="g1">かんたん<br><span style="font-size:14px">90びょう</span></button>
        <button class="btn big orange" data-mode="g2">ふつう<br><span style="font-size:14px">60びょう</span></button>
        <button class="btn big purple" data-mode="g3">むずかしい<br><span style="font-size:14px">45びょう</span></button>
      </div>
      <button class="btn rank-open" id="rankBtn" type="button">🏆 ランキング</button>
    </div>
  </div>

  <div id="playScreen" class="hidden">
    <div class="hud"><span id="starHud">⭐ 0 / 10</span><span id="timeHud" class="hidden"></span></div>
    <div class="stage-wrap"><canvas id="cv" class="stage" width="1280" height="720"></canvas></div>
    <div class="row hidden" id="honbanRow">
      <button class="btn big green" id="honbanBtn">ほんばんへ</button>
    </div>
    <div class="row hidden" id="clearRow">
      <button class="btn big green" id="againBtn">もういちど</button>
      <button class="btn yellow" id="selBtn">やりなおす</button>
    </div>
  </div>
</main>

<!-- タッチそうさ -->
<div class="touchpad hidden" id="touchpad">
  <div class="grp">
    <button class="tbtn" id="tLeft">◀</button>
    <button class="tbtn" id="tRight">▶</button>
  </div>
  <div class="grp">
    <button class="tbtn" id="tJump">⤴</button>
  </div>
</div>

<script src="../js/core.js?v=46"></script>
<script src="../js/rig.js?v=17"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const GAME = "adventure";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];
const MODES = {
  /* れんしゅうは ゴールなし。ひだりも みぎも どこまでも 行けて、⭐は かぞえない */
  ren:  { label: "れんしゅう", free: true },
  g1: { label: "かんたん",   time: 90, lv: 1 },
  g2: { label: "ふつう",     time: 60, lv: 2 },
  g3: { label: "むずかしい", time: 45, lv: 3 },
};

let selChar = null, selBg = null, G = null;
let allChars = [], allBgs = [];

async function initSelect() {
  const recs = await Store.forGame();
  allChars = recs.filter((r) => r.cat === "char");
  allBgs = recs.filter((r) => r.cat === "bg");
  selChar = allChars[0] || null;
  selBg = allBgs[0] || null;
  refreshLocks();
}
initSelect();

/* あそびかたを えらんだ あとに キャラ → はいけい の じゅんで えらぶ */
async function pickCharAndBg() {
  const char = await Picker.one({
    title: "だれで ぼうけんする?", records: allChars, selectedId: selChar && selChar.id,
  });
  if (!char) return false;
  selChar = char;
  if (allBgs.length) {
    const bg = await Picker.one({
      title: "どこを ぼうけんする?", records: allBgs, selectedId: selBg && selBg.id,
    });
    if (!bg) return false;
    selBg = bg;
  }
  return true;
}

function refreshLocks() {
  const lv = Tiers.unlock(GAME);
  document.querySelectorAll("#gachiRow .btn").forEach((b) => {
    const need = MODES[b.dataset.mode].lv;
    if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
    b.classList.toggle("locked", need > lv);
    b.innerHTML = (need > lv ? "🔒 " : "") + b.dataset.orig;
  });
  Tiers.bindRankButton($("rankBtn"), GAME, RANK_LABELS, { unit: "びょう" });
}

/* タッチボタン */
const touch = { left: false, right: false, a: false };
for (const [id, key] of [["tLeft", "left"], ["tRight", "right"], ["tJump", "a"]]) {
  const b = $(id);
  const on = (e) => { e.preventDefault(); touch[key] = true; };
  const off = (e) => { e.preventDefault(); touch[key] = false; };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("pointerleave", off);
}

let curMode = MODES.ren;
document.querySelectorAll("#selectScreen [data-mode]").forEach((b) => {
  b.onclick = async () => {
    const m = MODES[b.dataset.mode];
    if (m.lv && m.lv > Tiers.unlock(GAME)) {
      Sound.bad();
      Ui.msg("まえのだんかいを クリアしてね", 1600, "#4dabf7");
      return;
    }
    Sound.tap();
    if (!(await pickCharAndBg())) return;
    curMode = m;
    startGame(m);
  };
});
/* れんしゅうは おわらないので、あそびながら ガチンコの かんたんへ 行ける */
$("honbanBtn").onclick = () => {
  if (G) G.stop = true;
  $("playScreen").classList.add("hidden");
  $("touchpad").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
  document.querySelector('#gachiRow [data-mode="g1"]').click();
};
Nav.onLeave(() => {
  if (G) G.stop = true;
  $("touchpad").classList.add("hidden");
  refreshLocks();
});
$("againBtn").onclick = () => startGame(curMode);
$("selBtn").onclick = () => {
  $("playScreen").classList.add("hidden");
  $("touchpad").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
  if (G) G.stop = true;
  refreshLocks();
};

function failGame(g) {
  g.cleared = true;   // タイマー停止・クリア判定も止める
  Sound.bad();
  Ui.msg("じかんぎれ！", 1500, "#9775fa");
  Ui.result("clearRow", "じかんぎれ", `⭐ ${g.got} / 10`);
  $("clearRow").classList.remove("hidden");
}

async function startGame(mode) {
  Sound.tap();
  curMode = mode;
  if (G) G.stop = true;
  const parts = await Rig.load(selChar);
  const bgImg = selBg ? await Util.loadImage(selBg.dataURL) : null;

  const cv = $("cv"), ctx = cv.getContext("2d");
  const WORLD = 3400, GROUND = 645;
  const puppet = new Puppet(parts, { h: 175 });
  const free = !!mode.free;                     // れんしゅう:ゴールなしで どこまでも
  const starY = () => GROUND - (Math.random() < 0.34 ? Util.rand(220, 300) : Util.rand(40, 130));
  const stars = [];
  if (free) {
    for (let i = 0; i < 8; i++) stars.push({ x: 380 + i * 420, y: starY(), got: false, t: Util.rand(0, 6) });
  } else {
    for (let i = 0; i < 10; i++) {
      stars.push({
        x: 380 + i * ((WORLD - 700) / 10) + Util.rand(-80, 80),
        y: starY(),
        got: false, t: Util.rand(0, 6),
      });
    }
  }

  G = {
    stop: false, mode, px: 150, py: GROUND, vy: 0, grounded: true,
    stars, got: 0, cleared: false, prevA: false, t: mode.time || 0,
  };

  $("selectScreen").classList.add("hidden");
  $("playScreen").classList.remove("hidden");
  $("touchpad").classList.remove("hidden");   // タッチそうさボタンを だす
  $("clearRow").classList.add("hidden");
  Ui.clearResult("clearRow");
  $("starHud").textContent = free ? "⭐ あつめて あそぼう!" : "⭐ 0 / 10";
  $("timeHud").classList.toggle("hidden", !mode.time);
  $("honbanRow").classList.toggle("hidden", !free);   // れんしゅうから ほんばんへ
  if (mode.time) $("timeHud").textContent = `⏰ ${mode.time}`;

  const starCv = Util.emojiCanvas("⭐", 90);
  const flagCv = Util.emojiCanvas("🚩", 160);
  let last = performance.now();
  const g = G;

  (function loop(now) {
    if (g.stop) return;
    const dt = Math.min(0.04, (now - last) / 1000); last = now;

    /* --- じかん(ガチンコ) --- */
    if (g.mode.time && !g.cleared) {
      g.t -= dt;
      $("timeHud").textContent = `⏰ ${Math.ceil(Math.max(0, g.t))}`;
      if (g.t <= 0) { g.t = 0; return failGame(g); }
    }

    /* --- 入力 --- */
    let left, right, jump;
    const pad = Pad.read();
    left = pad.left || touch.left;
    right = pad.right || touch.right;
    jump = pad.a || pad.up || touch.a;
    const SPEED = 330;
    let vx = 0;
    if (left) { vx = -SPEED; puppet.facing = -1; }
    if (right) { vx = SPEED; puppet.facing = 1; }
    g.px = free ? g.px + vx * dt : Util.clamp(g.px + vx * dt, 60, WORLD - 60);
    puppet.walking = vx !== 0 && g.grounded;

    if (jump && !g.prevA && g.grounded) {
      g.vy = -950; g.grounded = false; Sound.jump();
    }
    g.prevA = jump;
    if (!g.grounded) {
      g.vy += 2400 * dt;
      g.py += g.vy * dt;
      if (g.py >= GROUND) { g.py = GROUND; g.vy = 0; g.grounded = true; }
    }
    puppet.update(dt);

    /* --- あたり判定 --- */
    const pcx = g.px, pcy = g.py - puppet.h / 2;
    for (const s of g.stars) {
      if (s.got) continue;
      s.t += dt;
      if (Math.abs(pcx - s.x) < 60 && Math.abs(pcy - s.y) < 95) {
        s.got = true;
        Sound.pop();
        if (free) continue;               // れんしゅうは かぞえない
        g.got++;
        $("starHud").textContent = `⭐ ${g.got} / 10`;
        if (g.got === 10) Ui.msg("ゴールへ いそげ!🚩", 1500, "#ff922b");
      }
    }
    /* れんしゅう:とおくの ⭐を かたづけて、進むさきに ランダムに 出しなおす */
    if (free) {
      g.stars = g.stars.filter((s) => !s.got && Math.abs(s.x - g.px) < 2600);
      while (g.stars.length < 8) {
        const side = Math.random() < 0.5 ? -1 : 1;
        g.stars.push({ x: g.px + side * Util.rand(700, 2400), y: starY(), got: false, t: Util.rand(0, 6) });
      }
    }
    if (!free && g.got === 10 && !g.cleared && g.px > WORLD - 220) {
      g.cleared = true;
      Sound.fanfare();
      Ui.confetti();
      if (g.mode.time) {
        const left = Math.max(0, Math.round(g.t));
        Tiers.setUnlock(GAME, Math.min(3, g.mode.lv + 1));
        Tiers.addRank(GAME, g.mode.lv, (selChar && selChar.name) || "?", left);
        Ui.msg("クリア！", 1600);
        Ui.result("clearRow", "クリア！", `のこり ${left}びょう`);
      } else {
        Ui.msg("クリア！", 1600);
        Ui.result("clearRow", "クリア！", "⭐ 10こ");
      }
      $("clearRow").classList.remove("hidden");
    }

    /* --- 描画 --- */
    const cam = free ? g.px - 500 : Util.clamp(g.px - 500, 0, WORLD - 1280);
    ctx.clearRect(0, 0, 1280, 720);
    if (bgImg) {
      // 交互に左右反転してつなぎ、背景の端が違う絵でも継ぎ目を目立たせない
      Util.drawLoopImage(ctx, bgImg, cam * 0.4, 1280, 720);
    } else {
      ctx.fillStyle = "#d0ebff"; ctx.fillRect(0, 0, 1280, 720);
    }
    ctx.fillStyle = "rgba(116,184,85,.95)";
    ctx.fillRect(0, GROUND + 8, 1280, 720 - GROUND);

    ctx.save();
    ctx.translate(-cam, 0);
    for (const s of g.stars) {
      if (s.got) continue;
      const bob = Math.sin(s.t * 3) * 8;
      ctx.drawImage(starCv, s.x - 45, s.y - 45 + bob);
    }
    if (!free && g.got === 10) ctx.drawImage(flagCv, WORLD - 190, GROUND - 150);
    puppet.x = g.px;
    puppet.y = GROUND;
    puppet.draw(ctx, GROUND - g.py);
    ctx.restore();

    /* すすみぐあいメーター(ゴールの ある ガチンコだけ) */
    if (!free) {
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.fillRect(340, 18, 600, 14);
      ctx.fillStyle = "#ff6b9d";
      ctx.fillRect(340, 18, 600 * (g.px / WORLD), 14);
    }

    requestAnimationFrame(loop);
  })(last);
}
</script>
</body>
</html>
