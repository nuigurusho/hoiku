<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>みんなの せかい</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">

<link rel="stylesheet" href="../css/style.css?v=42">
<style>
  .stages { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 4px 0 8px; }
  .stages .btn { width: 78px; height: 78px; padding: 5px; opacity: .55; }
  .stages .btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
  .stages .btn.active { opacity: 1; outline: 3px solid #212529; transform: translateY(1px); }
  .world-view { position: relative; overflow: hidden; border-radius: 18px; }
  .world-view canvas { transform-origin: center center; will-change: transform; }
  .zoom-tools {
    position: absolute; right: 14px; bottom: 14px; z-index: 4; display: flex; align-items: center; gap: 7px;
    padding: 8px; border-radius: 22px; background: rgba(255,255,255,.9); box-shadow: 0 5px 18px rgba(70,45,20,.25);
  }
  .zoom-tools button {
    width: 56px; height: 56px; padding: 0; border: 3px solid var(--blue-d); border-radius: 17px;
    background: var(--blue); color: #fff; box-shadow: 0 5px 0 var(--blue-d);
    font-family: inherit; font-size: 32px; font-weight: 900; line-height: 1; cursor: pointer;
  }
  .zoom-tools button:active { transform: translateY(5px); box-shadow: none; }
  .zoom-tools .zoom-reset { width: 64px; border-color: var(--cream-d); background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--cream-d); font-size: 18px; }
</style>
</head>
<body data-chrome="game">
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/world.png" alt=""> みんなの せかい</h1>
  <div class="spacer"></div>
</header>

<main>
  <div class="stages" id="stages">
    <button class="btn green active" data-stage="land" aria-label="おかの せかい"><img src="../assets/stages/world-land.png?v=2" alt=""></button>
    <button class="btn blue" data-stage="water" aria-label="みずの せかい"><img src="../assets/stages/world-water.png?v=2" alt=""></button>
    <button class="btn orange" data-stage="house" aria-label="いえの なか"><img src="../assets/stages/world-house.png?v=4" alt=""></button>
    <button class="btn yellow" data-stage="flower" aria-label="ひまわり ばたけ"><img src="../assets/stages/world-flower.svg" alt=""></button>
  </div>
  <div class="stage-wrap world-view" id="worldView">
    <canvas id="cv" class="stage" width="1280" height="720"></canvas>
    <div class="zoom-tools" aria-label="かくだい・しゅくしょう">
      <button id="zoomOut" type="button" aria-label="ちいさくする">−</button>
      <button id="zoomReset" class="zoom-reset" type="button" aria-label="もとの おおきさ">1×</button>
      <button id="zoomIn" type="button" aria-label="おおきくする">＋</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=35"></script>
<script src="../js/rig.js?v=17"></script>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = 1280, H = 720;
const GROUND = 700;     // おかの せかいの じめん(いちばん てまえ)
const GROUND_FAR = 560; // おかの せかいの じめん(いちばん おく)
const SURFACE = 250;    // みずの せかいの 水面

/* おかの せかいの おくゆき。てまえ(下)ほど 大きく みえる。
   ジャンプは airY(えがくときの うきあがり)なので、大きさは かわらない */
function depthScale(y) {
  return 0.78 + 0.34 * Util.clamp((y - GROUND_FAR) / (GROUND - GROUND_FAR), 0, 1);
}

let stage = "land";
const stageBgs = { land: null, water: null, house: null };
let T = 0;                 // ぜんたいの じかん(なみ・あわ の アニメ用)
let onStage = 0;           // いま 画面に いる にんずう
const chars = [];          // {rec, parts, kind}
const actors = [];
const drops = [];          // しぶき
const rings = [];          // 水面の わ
const bubbles = [];        // 水面の きらきら
const bubs = [];           // さかなが はく あわ

/* ---------------- よみこみ ---------------- */
async function init() {
  const recs = await Store.forGame();
  const bgs = recs.filter((r) => r.cat === "bg" || r.cat === "pic");
  const [land, water, house] = await Promise.all([
    Util.loadImage("../assets/backgrounds/world-land.jpg"),
    Util.loadImage("../assets/backgrounds/world-water.jpg"),
    Util.loadImage("../assets/backgrounds/world-house.jpg?v=2"),
  ]);
  stageBgs.land = land; stageBgs.water = water; stageBgs.house = house;
  /* とりこんだ背景があるときは、おかのせかいだけその絵を使う */
  const customBg = bgs.find((r) => r.id !== "sample-bg-crayon-hills-v1" && r.name !== "おそらとおやま");
  if (customBg) stageBgs.land = await Util.loadImage(customBg.dataURL);

  for (const rec of recs.filter((r) => r.cat === "char")) {
    const parts = await Rig.load(rec);
    const kind = parts.type === "butterfly" ? "fly" : parts.type === "float" ? "float" : "walk";
    chars.push({ rec, parts, kind });
  }
  for (let i = 0; i < 30; i++) {   // 水面の きらきら
    bubbles.push({ x: Util.rand(0, W), y: Util.rand(SURFACE + 20, H - 10), r: Util.rand(3, 8), sp: Util.rand(6, 26) });
  }
  build();
  requestAnimationFrame(loop);
}
init();

/* ステージに あわせて キャラを ならべなおす */
function build() {
  actors.length = 0; drops.length = 0; rings.length = 0; bubs.length = 0;
  for (const sp of SPOTS) sp.by = null;
  if (stage === "flower") { buildFlowerStage(); return; }
  const copies = chars.length < 3 ? 2 : 1;   // キャラが すくないときは 2体ずつ
  for (const c of chars) {
    /* ちょうちょは そとの子。いえの なかには でてこない */
    if (stage === "house" && c.kind === "fly") continue;
    for (let i = 0; i < copies; i++) {
      actors.push(stage === "water" ? makeSwimmer(c) : stage === "house" ? makeResident(c) : makeWalker(c));
    }
  }
}

/* ---------------- おかの せかい ---------------- */
function makeWalker(c) {
  // ふわふわ(float)・ちょうちょ(butterfly)は地面ではなく画面の中段に うかせて配置する
  const isBtfly = c.kind === "fly";
  const isFloat = c.kind === "float" || isBtfly;
  const hBase = Util.rand(120, 190);
  const y = isFloat ? Util.rand(280, 430) : Util.rand(GROUND_FAR, GROUND);
  return {
    puppet: new Puppet(c.parts, {
      x: Util.rand(100, 1180),
      y,
      h: isFloat ? hBase : hBase * depthScale(y),
      facing: Math.random() < 0.5 ? 1 : -1,
    }),
    name: c.rec.name || "",
    voices: c.rec.voices || null,
    float: isFloat,
    flutter: isBtfly,
    hBase,
    target: Util.rand(100, 1180),
    targetY: isFloat ? Util.rand(160, 480) : Util.rand(GROUND_FAR, GROUND),
    wob: Math.random() * 6,
    pause: Util.rand(0, 2),
    bubbleT: 0,
    airY: 0, vy: 0,
  };
}

function updateWalker(a, dt) {
  const pp = a.puppet;
  /* ジャンプ(タッチされたとき) */
  if (a.airY > 0 || a.vy > 0) {
    a.airY += a.vy * dt;
    a.vy -= 1900 * dt;
    if (a.airY <= 0) { a.airY = 0; a.vy = 0; }
  }
  /* ちょうちょは たてにも ひらひら うごく */
  if (a.flutter) {
    a.wob += dt * 2.4;
    const goal = a.targetY + Math.sin(a.wob) * 26;
    const dy = goal - pp.y;
    pp.y += Math.sign(dy) * Math.min(Math.abs(dy), 90 * dt);
  }
  /* おさんぽAI */
  if (a.pause > 0) {
    a.pause -= dt;
    pp.walking = false;
  } else {
    const d = a.target - pp.x;
    if (Math.abs(d) < 12) {
      a.pause = a.flutter ? Util.rand(0.2, 1) : Util.rand(0.6, 3);
      a.target = Util.rand(80, 1200);
      a.targetY = a.float ? Util.rand(160, 480) : Util.rand(GROUND_FAR, GROUND);
      if (!a.flutter && Math.random() < 0.25) { a.vy = 430; Sound.jump(); }
    } else {
      const sp = 60 + pp.h * 0.35;
      pp.x += Math.sign(d) * sp * dt;
      pp.facing = Math.sign(d) || 1;
      pp.walking = true;
      /* じめんの 子は おくゆき(たて)にも すこしずつ うごく */
      if (!a.float) {
        const dy = a.targetY - pp.y;
        pp.y += Math.sign(dy) * Math.min(Math.abs(dy), sp * 0.3 * dt);
      }
    }
  }
  /* てまえ(下)ほど 大きく。ジャンプ中(airY)でも pp.y は かわらないので おくゆきは そのまま */
  if (!a.float) pp.h = a.hBase * depthScale(pp.y);
}

/* ---------------- ひまわり ばたけ ----------------
   そらは すこしだけで、はたけの ほうが ひろい。
   ひまわりも キャラも たて位置で 大きさが かわり(下ほど 大きい)、
   下の ものから あとで えがくので、人は 花の あいだを あるいて みえる。
   ちょうちょが 8わり(たりないときは おなじ子を 大きさちがいで)、
   ふわふわも すこし まぜて、人は 1〜2人が ゆっくり とおりすぎる。
   ちょうちょは ときどき ひまわりに とまって ひとやすみ する。 */
const FL_SKY = 190;                 // そらと はたけの さかいめ
const FL_FAR = FL_SKY + 30;         // いちばん おくの じめん
const FL_NEAR = 716;                // いちばん てまえの じめん
const FL_TOTAL = 13;                // 画面に だす キャラの かず

/* かさねる じゅんばん用の たて位置。
   花に とまっている ちょうちょは、その 花の すぐ てまえに えがく */
function actorY(a) {
  if (a.rest > 0) return a.perch.y + 1;   // 花に とまっている … その 花の すぐ てまえ
  if (a.gy != null) return a.gy;          // とんでいる … かげが おちる じめんの いち
  return a.puppet.y;
}

/* たて位置 → 大きさ。おく(上)は 小さく、てまえ(下)は 大きく */
function flowerDepth(y) {
  return 0.26 + Util.clamp((y - FL_FAR) / (FL_NEAR - FL_FAR), 0, 1);
}

const flowers = [];                 // {x, y, sun, seed, tilt} … yの じゅんに ならべる
let sunImgs = null;                 // ひまわりの え(3しゅるい・つかいまわす)

/* ひまわり1本を えがいて キャンバスに しておく(まいフレーム 線を ひかない) */
function makeSunflower(petals, headR, stemH) {
  const w = Math.round(headR * 5), h = Math.round(stemH + headR * 2.6);
  const c = Util.makeCanvas(w, h);
  const g = c.getContext("2d");
  const bx = w / 2, by = h;                       // ねもと
  const hy = h - stemH;                           // はなの ちゅうしん
  g.lineCap = "round"; g.lineJoin = "round";
  /* くき */
  g.strokeStyle = "#5c9e3f"; g.lineWidth = Math.max(3, headR * 0.28);
  g.beginPath();
  g.moveTo(bx, by);
  g.quadraticCurveTo(bx - headR * 0.2, by - stemH * 0.5, bx, hy);
  g.stroke();
  /* は */
  g.fillStyle = "#8ccc63"; g.strokeStyle = "#4e8c36"; g.lineWidth = Math.max(2, headR * 0.16);
  for (const d of [-1, 1]) {
    g.beginPath();
    g.ellipse(bx + d * headR * 0.75, by - stemH * (d < 0 ? 0.42 : 0.6), headR * 0.85, headR * 0.36, d * 0.5, 0, 7);
    g.fill(); g.stroke();
  }
  /* はなびら */
  g.fillStyle = "#ffd43b"; g.strokeStyle = "#e8a723"; g.lineWidth = Math.max(2, headR * 0.14);
  for (let i = 0; i < petals; i++) {
    g.save();
    g.translate(bx, hy);
    g.rotate(i / petals * Math.PI * 2);
    g.beginPath();
    g.ellipse(0, -headR * 1.32, headR * 0.42, headR * 0.78, 0, 0, 7);
    g.fill(); g.stroke();
    g.restore();
  }
  /* まんなか(たね) */
  g.fillStyle = "#a9702f"; g.strokeStyle = "#6b431d";
  g.beginPath(); g.arc(bx, hy, headR, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "rgba(107,67,29,.5)";
  for (let i = 0; i < 10; i++) {
    const an = i * 2.4, rr = headR * 0.62 * Math.sqrt((i + 1) / 10);
    g.beginPath(); g.arc(bx + Math.cos(an) * rr, hy + Math.sin(an) * rr, headR * 0.12, 0, 7); g.fill();
  }
  return { c, headR, stemH };       // stemH = ねもとから はなの ちゅうしんまで
}

/* はたけに ひまわりを うえる(おくほど 小さく・たくさん) */
function plantFlowers() {
  if (!sunImgs) sunImgs = [makeSunflower(12, 18, 104), makeSunflower(14, 16, 122), makeSunflower(11, 21, 88)];
  flowers.length = 0;
  for (let i = 0; i < 62; i++) {
    const t = Math.pow(Math.random(), 1.5);        // おくを 多めに(てまえは まばらに)
    const y = FL_FAR + t * (FL_NEAR - FL_FAR);
    flowers.push({
      x: Util.rand(-50, W + 50), y,
      sun: sunImgs[i % sunImgs.length],
      seed: Math.random() * 7,
      tilt: Util.rand(-0.09, 0.09),
    });
  }
  flowers.sort((a, b) => a.y - b.y);
}

/* かぜで ゆれる かたむき(えがくときも とまるときも おなじ) */
function flowerTilt(f) { return f.tilt + Math.sin(T * 1.2 + f.seed) * 0.045; }

/* はなの ちゅうしん(ちょうちょが とまる ばしょ)。ねもとを 中心に かたむける */
function flowerHead(f) {
  const s = flowerDepth(f.y);
  const rot = flowerTilt(f);
  const len = f.sun.stemH * s;
  return { x: f.x + Math.sin(rot) * len, y: f.y - Math.cos(rot) * len, s };
}

/* ちょうちょ・ふわふわ … 花の うえを ひらひら。
   ・gy  … かげが おちる じめんの いち。おくゆき(大きさ・かさねる じゅん)は これで きめる
   ・alt … その じめんから うきあがっている たかさ(画面上のpx)
   画面に えがく たかさは gy - alt。たかく とんでも おくには いかないので、
   花の うしろに かくれてしまわない。 */
const FLY_ALT = 130;                // てまえ(おくゆき1.0)での とぶ たかさの めやす

function makeFlutter(c) {
  const gy = Util.rand(FL_FAR + 20, FL_NEAR);
  // 大きさは ばらばらに(ちょうちょは じどうで はんぶんに なる)
  const hBase = c.kind === "fly" ? Util.rand(84, 168) : Util.rand(78, 126);
  const a = {
    puppet: new Puppet(c.parts, { x: Util.rand(0, W), y: gy, h: hBase * flowerDepth(gy), facing: 1 }),
    name: c.rec.name || "",
    voices: c.rec.voices || null,
    hBase, hCur: hBase * flowerDepth(gy),
    wob: Math.random() * 6,
    speed: Util.rand(38, 78),
    perch: null,                    // とまっている(むかっている)ひまわり
    perchFacing: 1,                 // とまるときの むき(はねを どちらに ひろげるか)
    rest: 0,                        // とまっている のこり時間
    canPerch: c.kind === "fly",     // 花に とまるのは ちょうちょだけ
    gy, alt: 0,
    tx: 0, tgy: gy, talt: 0,
    bubbleT: 0, airY: 0,
  };
  flutterTarget(a);
  a.alt = a.talt;                   // さいしょから とんでいる たかさに
  a.puppet.y = a.gy - a.alt;
  return a;
}

/* つぎに どこへ いくか。ちょうちょは はんぶんくらい ひまわりを めざす */
function flutterTarget(a) {
  a.speed = Util.rand(38, 78);
  const pool = a.canPerch ? flowers.filter((f) => f.x > 30 && f.x < W - 30) : [];
  if (pool.length && Math.random() < 0.6) {
    a.perch = pool[Math.floor(Math.random() * pool.length)];
    a.perchFacing = Math.random() < 0.5 ? 1 : -1;
    aimAtPerch(a);
    return;
  }
  a.perch = null;
  a.tx = Util.rand(-40, W + 40);
  a.tgy = Util.rand(FL_FAR + 20, FL_NEAR);
  a.talt = FLY_ALT * flowerDepth(a.tgy) * Util.rand(0.7, 1.5);   // 花より 上を とぶ
}

/* とまる いちを ゆきさきに する(花は かぜで ゆれるので まいかい きめなおす) */
function aimAtPerch(a) {
  a.tx = perchX(a);
  a.tgy = a.perch.y;
  a.talt = a.perch.y - perchY(a);
}

/* とまる よこの いち … まんなかの 丸から よこに ずらす。
   はねが 丸の うえに かぶさるように、はねが ひろがる がわの はんたいに おく */
function perchX(a) {
  const head = flowerHead(a.perch);
  return head.x + a.perchFacing * a.perch.sun.headR * head.s * 0.55;
}

/* とまる ときの 足もとの たかさ。
   ちょうちょの じく(からだの まんなかの 線・下から 1/3)が
   はなの まんなかの 丸の すこし うえに くるように おく。
   じくは えがくとき 足もとより h/3 うえに くるので、その ぶんを たす */
function perchY(a) {
  const head = flowerHead(a.perch);
  const pp = a.puppet;
  return head.y - a.perch.sun.headR * head.s * 0.4 + pp.lift + pp.h / 3;
}

function updateFlutter(a, dt) {
  const pp = a.puppet;
  a.wob += dt * 2.6;

  if (a.rest > 0) {
    /* ひまわりに とまって ひとやすみ。花が ゆれると いっしょに ゆれる */
    a.rest -= dt;
    a.gy = a.perch.y;
    a.alt = a.perch.y - perchY(a);
    pp.x = perchX(a);
    pp.facing = a.perchFacing;
    pp.walking = false;                            // はねは ゆっくり ひらいたり とじたり
    if (a.rest <= 0) flutterTarget(a);
  } else {
    if (a.perch) aimAtPerch(a);
    const dx = a.tx - pp.x;
    const dy = (a.tgy - a.talt) - (a.gy - a.alt);  // 画面上の たかさの さ
    const d = Math.hypot(dx, dy) || 1;
    if (d < 14) {
      /* 花に ついたら しばらく とまる。そうでなければ つぎの ばしょへ */
      if (a.perch) a.rest = Util.rand(3, 8);
      else flutterTarget(a);
    } else {
      pp.x += dx / d * a.speed * dt;
      const k = Math.min(1, dt * 1.3);             // おくゆきと たかさは なめらかに
      a.gy += (a.tgy - a.gy) * k;
      a.alt += (a.talt - a.alt) * k;
      a.alt += Math.sin(a.wob) * 16 * dt;          // ひらひら たてに ゆれる
      /* とまりに いくときは 花の ちかくで むきを そろえる */
      pp.facing = a.perch && d < 60 ? a.perchFacing : (dx >= 0 ? 1 : -1);
    }
    pp.walking = true;
  }

  a.gy = Util.clamp(a.gy, FL_FAR, FL_NEAR);
  pp.y = a.gy - a.alt;
  pp.perched = a.rest > 0;                         // とまっているときは はねを たたむ

  /* 大きさ … かげが おちる じめんの いちで きめる(たかく とんでも かわらない) */
  const want = a.hBase * flowerDepth(a.gy);
  a.hCur += (want - a.hCur) * Math.min(1, dt * 4);
  pp.h = a.hCur;
}

/* 人 … ときどき 立ちどまりながら、はたけを ゆっくり とおりすぎる */
function makeStroller(c) {
  const a = {
    puppet: new Puppet(c.parts, { x: 0, y: FL_NEAR, h: 160, facing: 1 }),
    name: "", voices: null, stroll: true,
    dir: 1, hBase: 170, pause: 0, wob: Math.random() * 6,
    bubbleT: 0, airY: 0, vy: 0, gone: false, wait: 0,
  };
  resetStroller(a);
  return a;
}

/* つぎの人が 画面の そとから 入ってくる(だれが 来るかは そのつど えらぶ) */
function resetStroller(a) {
  const pp = a.puppet;
  const pool = chars.filter((c) => c.kind === "walk");
  if (pool.length) {
    const c = pool[Math.floor(Math.random() * pool.length)];
    pp.parts = c.parts;
    a.name = c.rec.name || "";
    a.voices = c.rec.voices || null;
  }
  a.dir = Math.random() < 0.5 ? 1 : -1;
  pp.y = Util.rand(FL_FAR + 90, FL_NEAR - 6);
  a.hBase = Util.rand(150, 195);
  pp.h = a.hBase * flowerDepth(pp.y);
  pp.x = a.dir > 0 ? -pp.w - 50 : W + pp.w + 50;
  pp.facing = a.dir;
  pp.walking = true;
  a.pause = 0; a.gone = false; a.wait = 0; a.airY = 0; a.vy = 0;
}

function updateStroller(a, dt) {
  const pp = a.puppet;
  if (a.airY > 0 || a.vy > 0) {                    // タッチされた ときの ジャンプ
    a.airY += a.vy * dt;
    a.vy -= 1900 * dt;
    if (a.airY <= 0) { a.airY = 0; a.vy = 0; }
  }
  if (a.gone) {                                    // 画面の そと。つぎの人を まつ
    a.wait -= dt;
    if (a.wait <= 0) resetStroller(a);
    return;
  }
  if (a.pause > 0) {
    a.pause -= dt;
    pp.walking = false;
  } else {
    pp.x += a.dir * (30 + pp.h * 0.12) * dt;       // ゆっくり あるく
    pp.facing = a.dir;
    pp.walking = true;
    if (Math.random() < dt * 0.14) a.pause = Util.rand(1.2, 3.6);   // ときどき 立ちどまる
  }
  const edge = pp.w + 70;
  if (pp.x < -edge || pp.x > W + edge) { a.gone = true; a.wait = Util.rand(1.2, 3.5); }
  pp.h = a.hBase * flowerDepth(pp.y);
}

/* ひまわり ばたけの キャラを そろえる */
function buildFlowerStage() {
  plantFlowers();
  const flies = chars.filter((c) => c.kind === "fly");
  const floats = chars.filter((c) => c.kind === "float");
  const walkers = chars.filter((c) => c.kind === "walk");
  const people = walkers.length ? (Math.random() < 0.5 ? 1 : 2) : 0;
  let nFly = Math.round(FL_TOTAL * 0.8);           // ちょうちょが 8わり
  let nFloat = Math.max(0, FL_TOTAL - people - nFly);
  if (!flies.length) { nFloat += nFly; nFly = 0; }        // ちょうちょが ないときは ふわふわで
  if (!floats.length) { nFly += nFloat; nFloat = 0; }
  if (!flies.length && !floats.length) { nFly = 0; nFloat = 0; }
  for (let i = 0; i < nFly; i++) actors.push(makeFlutter(flies[i % flies.length]));
  for (let i = 0; i < nFloat; i++) actors.push(makeFlutter(floats[i % floats.length]));
  for (let i = 0; i < people; i++) {
    const a = makeStroller(walkers[i % walkers.length]);
    if (i > 0) { a.gone = true; a.wait = Util.rand(6, 14); }   // 2人めは あとから 入ってくる
    actors.push(a);
  }
}

/* ---------------- みずの せかい ----------------
   back  … にんげんタイプは あおむけ(背泳ぎ)。ときどき バタ足で すすむ
   dog   … よつあし(quad)は いぬかき。からだを おこしたまま、
           したはんぶんを 水に つけて ぱしゃぱしゃ かいて すすむ
   fish  … ふわふわ(float)は さかなっぽく、もぐって ゆらゆら・ときどき ダッシュ
   fly   … ちょうちょは 水面の うえを とぶ
   みんな 画面の そとへ 出ていき、しばらくすると また 入ってくる。 */
const SINK = 0.36;              // いぬかき:からだの どれだけが 水に つかるか

function makeSwimmer(c) {
  const swim = c.kind === "fly" ? "fly"
    : c.kind === "float" ? "fish"
      : c.parts.type === "quad" ? "dog"   // よつあしは いぬかき
        : "back";                         // にほんあし・スカートは 背泳ぎ
  const depth = Math.random();                    // 0=おく(小さい) 1=てまえ(大きい)
  // 水面では おかの せかいより ずっと 小さく およぐ
  const h = swim === "fly" ? Util.rand(64, 92)
    : swim === "fish" ? Util.rand(50, 82)
      : Math.round(70 + depth * 48);
  const a = {
    puppet: new Puppet(c.parts, { x: Util.rand(0, W), y: 0, h, facing: 1 }),
    name: c.rec.name || "",
    voices: c.rec.voices || null,
    swim, depth,
    dir: Math.random() < 0.5 ? 1 : -1,
    lineY: 0, base: 0, speed: 0,
    kickT: -Util.rand(0.2, 2.5), nextKick: Util.rand(1, 3),
    wob: Math.random() * 6,
    gone: false, wait: 0,
    bubbleT: 0, airY: 0, vy: 0,
  };
  setLane(a);
  a.puppet.kick = swim === "back" || swim === "dog";   // てあしを こまかく はやく うごかす
  return a;
}

/* およぐ ふかさ(たて位置)と はやさを きめる */
function setLane(a) {
  if (a.swim === "fly") { a.lineY = Util.rand(150, SURFACE + 20); a.base = Util.rand(70, 120); }
  else if (a.swim === "fish") { a.lineY = Util.rand(SURFACE + 80, H - 70); a.base = Util.rand(70, 120); }
  else {
    // てまえ(下)ほど 大きく、おく(上)ほど 小さく およぐ
    a.depth = Math.random();
    a.puppet.h = Math.round(70 + a.depth * 48);
    a.lineY = SURFACE + 26 + a.depth * (H - SURFACE - 110);
    a.base = Util.rand(34, 56);
  }
}

/* 画面の はしの そと(ぎりぎり)。ここより そとに 出たら「画面外」 */
function edgeOf(pp) { return Math.max(pp.w, pp.h) * 0.7 + 20; }

/* 画面の そとから また 入ってくる */
function respawn(a) {
  setLane(a);
  a.dir = Math.random() < 0.5 ? 1 : -1;
  // 判定ラインちょうどに おいて、つぎの フレームから 中へ すすむ
  a.puppet.x = a.dir > 0 ? -edgeOf(a.puppet) : W + edgeOf(a.puppet);
  a.speed = a.base;
  a.gone = false;
}

function updateSwimmer(a, dt) {
  const pp = a.puppet;
  const edge = edgeOf(pp);

  /* 画面の そとへ 出たら しばらく おやすみ → また どこかの はしから 入ってくる。
     ただし プールが さびしく ならないよう、へっていたら すぐ もどってくる */
  if (pp.x < -edge || pp.x > W + edge) {
    if (!a.gone) { a.gone = true; a.wait = Util.rand(0.4, 2.6); }
    a.wait -= dt * (onStage < actors.length * 0.6 ? 4 : 1);
    if (a.wait <= 0) respawn(a);
    return;
  }

  if (a.swim === "back" || a.swim === "dog") {
    const dog = a.swim === "dog";
    /* ときどき つよく かいて(kickT>0)ぐっと すすみ、
       おわったら nextKick びょう すべって すすむ */
    a.kickT -= dt;
    if (a.kickT <= -a.nextKick) {
      a.kickT = Util.rand(0.6, 1.5);
      a.nextKick = Util.rand(1.2, 3.4);
      dog ? splash(pp.x + a.dir * pp.w * 0.42, a.lineY, 4, a.dir)
        : splash(pp.x - a.dir * pp.h * 0.42, a.lineY, 4, -a.dir);
    }
    const kicking = a.kickT > 0;
    const want = a.base * (kicking ? 2.2 : 0.5);
    a.speed += (want - a.speed) * Math.min(1, dt * 2.4);
    pp.x += a.dir * a.speed * dt;

    if (dog) {
      /* いぬかき … からだを おこしたまま、したはんぶんを 水に しずめる */
      pp.walking = true;                         // ずっと ぱしゃぱしゃ かいている
      pp.facing = a.dir;
      a.wob += dt * (kicking ? 7 : 3.4);
      /* すすむ ほうへ すこし まえかがみ + かくたびに からだが ゆれる */
      pp.roll = a.dir * (kicking ? 0.15 : 0.09) + Math.sin(a.wob * 2) * 0.05;
      pp.y = a.lineY + pp.h * SINK + Math.sin(a.wob) * 5;
      /* まえで ぱしゃぱしゃ みずを かく */
      if (Math.random() < dt * (kicking ? 16 : 5)) splash(pp.x + a.dir * pp.w * 0.4, a.lineY, 1, a.dir);
    } else {
      /* 背泳ぎ … あおむけで、バタ足のときだけ あしが うごく */
      pp.walking = kicking;
      pp.roll = a.dir * Math.PI / 2;             // あおむけ(すすむ ほうへ 頭)
      a.wob += dt * (kicking ? 5.5 : 2.4);
      pp.y = a.lineY + pp.h / 2 + Math.sin(a.wob) * 4;
      if (kicking && Math.random() < dt * 14) splash(pp.x - a.dir * pp.h * 0.45, a.lineY, 1, -a.dir);
    }

  } else if (a.swim === "fish") {
    /* すーっと すすんで、ときどき ぴゅっと ダッシュ・むきを かえる */
    a.kickT -= dt;
    if (a.kickT <= -a.nextKick) {
      a.kickT = Util.rand(0.4, 1.1);
      a.nextKick = Util.rand(0.8, 2.6);
      if (Math.random() < 0.35) a.dir *= -1;
      a.lineY = Util.clamp(a.lineY + Util.rand(-110, 110), SURFACE + 60, H - 60);
    }
    const dash = a.kickT > 0;
    a.wob += dt * (dash ? 8 : 3.4);
    const want = a.base * (dash ? 2.4 : 0.45);
    a.speed += (want - a.speed) * Math.min(1, dt * 3);
    pp.x += a.dir * a.speed * dt;
    pp.facing = a.dir;
    // すすむ ほうへ すこし かたむけ、からだを くねらせる
    pp.roll = a.dir * 0.16 + Math.sin(a.wob) * (dash ? 0.17 : 0.1);
    if (Math.random() < dt * (dash ? 14 : 4)) {
      bubs.push({ x: pp.x - a.dir * pp.w * 0.4, y: pp.y - pp.h * 0.6, r: Util.rand(2, 5), t: 0, life: Util.rand(0.8, 1.6) });
    }
    const goalY = a.lineY + pp.h / 2 + Math.sin(a.wob * 0.5) * 12;
    pp.y += (goalY - pp.y) * Math.min(1, dt * 2.4);

  } else {  /* fly … 水面の うえを とぶ */
    a.wob += dt * 2.2;
    pp.walking = true;
    pp.facing = a.dir;
    pp.x += a.dir * a.base * dt;
    pp.y = a.lineY + Math.sin(a.wob) * 26;
  }
}

/* ---------------- いえの なか(2かいだての だんめんず) ----------------
   1かい … だいどころ+しょくたく / リビング / げんかん・かいだん
   2かい … おふろ / しんしつ / かいだんの うえ
   じゅうにん(にんげんタイプ)は
     ごはん・おふろ・おしゃべり(2人)・おひるね・ぶらぶら
   を じゅんばんに して、かいだんで 1かいと2かいを いききする。
   ちょうちょは そとの子なので、ここには でてこない。 */
const HX = 56, HW = 1168, HY = 96;      // いえの ひだり・はば・てんじょう
const F2 = 380, F1 = 660;               // 2かい・1かいの ゆか(足もと)
const ST = { lo: 1150, hi: 985 };       // かいだん(1かいがわ・2かいがわ の はし)
const WALK1 = [92, 1180], WALK2 = [92, 960];
const TUB = { x: 118, w: 272, top: F2 - 108 };            // おふろ
const TABLE = { x: 292, w: 252, top: F1 - 78 };           // しょくたく
const SOFA = { x: 636, w: 286, top: F1 - 62 };            // ソファ
const FUTON = [{ x: 590, head: -1 }, { x: 822, head: 1 }]; // ふとん(まんなかのx)

const SPOTS = [
  { kind: "eat",   fl: 1, x: 322, face: 1 },
  { kind: "eat",   fl: 1, x: 418, face: 1 },
  { kind: "eat",   fl: 1, x: 514, face: -1 },
  { kind: "bath",  fl: 2, x: 254, face: 1 },
  { kind: "chat",  fl: 1, x: 700, face: 1,  pair: 0 },
  { kind: "chat",  fl: 1, x: 858, face: -1, pair: 1 },
  { kind: "sleep", fl: 2, x: FUTON[0].x, face: 1, head: FUTON[0].head },
  { kind: "sleep", fl: 2, x: FUTON[1].x, face: 1, head: FUTON[1].head },
];
const DUR = { eat: [9, 16], bath: [10, 20], chat: [10, 22], sleep: [12, 26], idle: [2, 6] };

function makeResident(c) {
  return {
    puppet: new Puppet(c.parts, {
      x: Util.rand(120, 900),
      y: F1,
      h: Util.rand(118, 148),
      facing: 1,
    }),
    name: c.rec.name || "",
    voices: c.rec.voices || null,
    fl: 1, act: "idle", spot: null, timer: Util.rand(0.3, 2.5),
    climb: -1, wob: Math.random() * 6, bubbleT: 0, airY: 0,
  };
}

/* つぎに なにを するか きめる */
function chooseAct(a) {
  a.puppet.roll = 0;
  if (Math.random() < 0.2) {                       // ぶらぶら する
    const fl = Math.random() < 0.5 ? 1 : 2;
    const r = fl === 1 ? WALK1 : WALK2;
    a.spot = { kind: "idle", fl, x: Util.rand(r[0], r[1]), face: 1, temp: true };
    a.act = "go";
    return;
  }
  const free = SPOTS.filter((s) => !s.by);
  if (!free.length) { a.act = "idle"; a.timer = Util.rand(1, 3); return; }
  // おしゃべりは あいてが すわっていたら ゆうせん
  const waiting = free.filter((s) => s.kind === "chat" &&
    SPOTS.some((o) => o.kind === "chat" && o !== s && o.by));
  let list = waiting.length && Math.random() < 0.75 ? waiting : free;
  // おふろは 1つだけなので すこし えらばれやすく しておく
  const weighted = [];
  for (const sp of list) for (let i = 0; i < (sp.kind === "bath" ? 3 : 1); i++) weighted.push(sp);
  list = weighted;
  const s = list[Math.floor(Math.random() * list.length)];
  s.by = a;
  a.spot = s;
  a.act = "go";
}

function releaseSpot(a) {
  if (a.spot && !a.spot.temp && a.spot.by === a) a.spot.by = null;
  a.spot = null;
}

/* 目的地に ついた */
function arriveSpot(a) {
  const s = a.spot, pp = a.puppet;
  a.act = s.kind;
  const d = DUR[s.kind] || DUR.idle;
  a.timer = Util.rand(d[0], d[1]);
  pp.x = s.x;
  pp.walking = false;
  pp.facing = s.face || 1;
  pp.y = a.fl === 1 ? F1 : F2;
  pp.roll = 0;
  if (s.kind === "sleep") {                        // ふとんに よこに なる
    pp.roll = s.head * Math.PI / 2;
    pp.y = F2 - 22 + pp.h / 2;
  }
}

function updateHouse(a, dt) {
  const pp = a.puppet;
  a.wob += dt;

  if (a.act === "go") {
    /* かいだんを のぼりおり */
    if (a.climb >= 0) {
      a.climb += dt / 2.8;
      const t = Math.min(1, a.climb);
      const up = a.spot.fl === 2;
      const fx = up ? ST.lo : ST.hi, tx = up ? ST.hi : ST.lo;
      const fy = up ? F1 : F2, ty = up ? F2 : F1;
      pp.x = fx + (tx - fx) * t;
      pp.y = fy + (ty - fy) * t;
      pp.facing = tx > fx ? 1 : -1;
      pp.walking = true;
      if (t >= 1) { a.fl = a.spot.fl; a.climb = -1; }
      return;
    }
    /* かいが ちがえば まず かいだんへ */
    const goalX = a.spot.fl !== a.fl ? (a.fl === 1 ? ST.lo : ST.hi) : a.spot.x;
    const d = goalX - pp.x;
    pp.y = a.fl === 1 ? F1 : F2;
    if (Math.abs(d) < 9) {
      if (a.spot.fl !== a.fl) a.climb = 0;
      else arriveSpot(a);
    } else {
      const sp = 70 + pp.h * 0.35;
      pp.x += Math.sign(d) * Math.min(Math.abs(d), sp * dt);
      pp.facing = Math.sign(d);
      pp.walking = true;
    }
    return;
  }

  /* なにかを している */
  pp.walking = false;
  switch (a.act) {
    case "eat":  pp.roll = Math.sin(a.wob * 5.5) * 0.05; break;   // もぐもぐ
    case "bath": pp.roll = Math.sin(a.wob * 1.5) * 0.04; break;   // ゆらゆら
    case "chat": pp.roll = Math.sin(a.wob * 3.2) * 0.035; break;
    case "sleep": break;                                          // すやすや
    default: pp.roll = 0;
  }
  a.timer -= dt;
  if (a.timer <= 0) { releaseSpot(a); chooseAct(a); }
}

/* ---- いえを えがく ---- */
function fillBox(x, y, w, h, fill, stroke, r) {
  ctx.beginPath();
  r ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawWindow(x, y, w, h) {
  fillBox(x, y, w, h, "#cfeaff", "#7f6a52", 8);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
  ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
  ctx.stroke();
  ctx.lineWidth = 6;
}

function drawLamp(x, y) {
  ctx.strokeStyle = "#8d7b68"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26); ctx.stroke();
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x - 26, y + 54); ctx.lineTo(x - 12, y + 26);
  ctx.lineTo(x + 12, y + 26); ctx.lineTo(x + 26, y + 54);
  ctx.closePath();
  ctx.fillStyle = "#ffe8a3"; ctx.fill(); ctx.strokeStyle = "#e6a817"; ctx.stroke();
}

  }

/* ゆげ・Zzz・ふきだし など */
function drawHouseFx() {
  /* おふろの ゆげ */
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 7; ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const x = TUB.x + 70 + i * 78;
    ctx.beginPath();
    for (let k = 0; k <= 5; k++) {
      const y = TUB.top - 6 - k * 18;
      const xx = x + Math.sin(T * 1.6 + k * 0.9 + i) * 12;
      k === 0 ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
    }
    ctx.stroke();
  }
  /* ごはんの ゆげ */
  for (let i = 0; i < 3; i++) {
    const x = TABLE.x + 46 + i * 84;
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (let k = 0; k <= 3; k++) {
      const y = TABLE.top - 22 - k * 14;
      const xx = x + Math.sin(T * 2.2 + k + i) * 8;
      k === 0 ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
    }
    ctx.stroke();
  }
  ctx.restore();

  const chatOn = SPOTS.filter((s) => s.kind === "chat" && s.by).length === 2;
  const turn = Math.floor(T / 2.2) % 2;

  for (const a of actors) {
    const pp = a.puppet;
    if (a.act === "sleep") {
      /* Zzz */
      ctx.save();
      ctx.fillStyle = "#5f6f8a"; ctx.font = "bold 30px sans-serif";
      for (let i = 0; i < 3; i++) {
        const t = (T * 0.5 + i * 0.33) % 1;
        ctx.globalAlpha = 1 - t;
        ctx.fillText("z", pp.x + (a.spot.head > 0 ? 46 : -60) + t * 26, F2 - 60 - t * 54);
      }
      ctx.restore();
    } else if (a.act === "chat" && chatOn && a.spot.pair === turn) {
      /* おしゃべりの ふきだし */
      const bx = pp.x + pp.facing * 46, by = pp.y - pp.h - 34;
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.strokeStyle = "#c9b8a4"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(bx - 42, by - 24, 84, 46, 20); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(bx - pp.facing * 34, by + 30, 7, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#7a6a58";
      for (let i = 0; i < 3; i++) {
        const on = (Math.floor(T * 3) % 3) >= i;
        ctx.globalAlpha = on ? 1 : 0.25;
        ctx.beginPath(); ctx.arc(bx - 22 + i * 22, by, 6, 0, 7); ctx.fill();
      }
      ctx.restore();
    } else if (a.act === "eat" && Math.sin(a.wob * 5.5) > 0.9) {
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.strokeStyle = "#c9b8a4"; ctx.lineWidth = 3;
      const bx = pp.x + pp.facing * 40, by = pp.y - pp.h - 24;
      ctx.beginPath(); ctx.arc(bx, by, 17, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffd43b";
      ctx.beginPath(); ctx.ellipse(bx, by + 2, 9, 6, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
}

function splash(x, y, n, dir) {
  for (let i = 0; i < n; i++) {
    drops.push({
      x, y,
      vx: Util.rand(-70, 70) + (dir || 0) * 70,
      vy: Util.rand(-210, -70),
      t: 0, life: Util.rand(0.4, 0.9), r: Util.rand(2, 5),

  if (n > 2) rings.push({ x, y, t: 0, life: 0.8, r: 10 });
}

/* ---------------- タッチ・かくだい ---------------- */
function touchActor(e) {
  const p = Util.canvasPos(cv, e);
  for (let i = actors.length - 1; i >= 0; i--) {
    const a = actors[i];
    if (a.gone) continue;
    const b = a.puppet.bbox(a.airY);
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      a.bubbleT = 1.6;
      if (stage === "house") {
        if (a.act !== "sleep") a.puppet.hop();       // ねている子は そっとしておく
      } else if (stage === "water") {
        a.kickT = 1.4;                                   // バタ足で ぴゅーっと すすむ
        splash(a.puppet.x, a.swim === "fly" ? a.puppet.y : a.lineY, 12, a.dir);
      } else if (stage === "flower") {
        if (a.stroll) { a.vy = 460; }                    // 人は ぴょん
        else {                                           // ちょうちょは びっくりして とびのく
          a.rest = 0; a.perch = null;
          a.tx = a.puppet.x + Util.rand(-200, 200);
          a.tgy = Util.clamp(a.gy + Util.rand(-60, 60), FL_FAR + 20, FL_NEAR);
          a.talt = a.alt + Util.rand(50, 140);           // 上に ふわっと にげる
          a.speed = Util.rand(90, 150);
          a.puppet.jumpT = 0.4;
        }
      } else {
        a.vy = 520;
      }
      // 登録ずみの こえ(よろこび・あいさつ・おどろき)からランダム再生。なければ従来の効果音
      if (!Sound.playVoice(a.voices, ["joy", "greet", "ouch"])) Sound.pop();
      return;
    }
  }
}

const zoomState = { scale: 1, x: 0, y: 0 };
const zoomPointers = new Map();
let gestureMoved = false;
let multiGesture = false;
let pinchDistance = 0;
let pinchCenter = null;

function applyZoom() {
  const maxX = Math.max(0, (zoomState.scale - 1) * cv.clientWidth / 2);
  const maxY = Math.max(0, (zoomState.scale - 1) * cv.clientHeight / 2);
  zoomState.x = Util.clamp(zoomState.x, -maxX, maxX);
  zoomState.y = Util.clamp(zoomState.y, -maxY, maxY);
  cv.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
  document.getElementById("zoomReset").textContent = `${zoomState.scale.toFixed(1)}×`;
}

function setZoom(next) {
  zoomState.scale = Util.clamp(Math.round(next * 10) / 10, 1, 3);
  if (zoomState.scale === 1) { zoomState.x = 0; zoomState.y = 0; }
  applyZoom();
}

document.getElementById("zoomIn").onclick = () => { Sound.tap(); setZoom(zoomState.scale + 0.5); };
document.getElementById("zoomOut").onclick = () => { Sound.tap(); setZoom(zoomState.scale - 0.5); };
document.getElementById("zoomReset").onclick = () => { Sound.tap(); setZoom(1); };

cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  zoomPointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
  if (zoomPointers.size === 1) gestureMoved = false;
  if (zoomPointers.size >= 2) {
    multiGesture = true;
    const [a, b] = [...zoomPointers.values()];
    pinchDistance = Math.hypot(a.x - b.x, a.y - b.y);
    pinchCenter = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
});

cv.addEventListener("pointermove", (e) => {
  const p = zoomPointers.get(e.pointerId);
  if (!p) return;
  const oldX = p.x, oldY = p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(p.x - p.sx, p.y - p.sy) > 7) gestureMoved = true;

  if (zoomPointers.size >= 2) {
    const [a, b] = [...zoomPointers.values()];
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    const center = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinchDistance > 0) zoomState.scale = Util.clamp(zoomState.scale * distance / pinchDistance, 1, 3);
    if (pinchCenter) {
      zoomState.x += center.x - pinchCenter.x;
      zoomState.y += center.y - pinchCenter.y;
    }
    pinchDistance = distance;
    pinchCenter = center;
    applyZoom();
  } else if (zoomState.scale > 1) {
    zoomState.x += p.x - oldX;
    zoomState.y += p.y - oldY;
    applyZoom();
  }
});

function endZoomPointer(e) {
  const canTap = zoomPointers.size === 1 && !gestureMoved && !multiGesture;
  zoomPointers.delete(e.pointerId);
  if (canTap) touchActor(e);
  if (zoomPointers.size === 0) {
    gestureMoved = false; multiGesture = false; pinchDistance = 0; pinchCenter = null;
  } else {
    const p = [...zoomPointers.values()][0];
    p.sx = p.x; p.sy = p.y;
    pinchDistance = 0; pinchCenter = null;
  }
}
cv.addEventListener("pointerup", endZoomPointer);
cv.addEventListener("pointercancel", endZoomPointer);

function drawSunflower(f) {

/* 花と キャラを たて位置じゅんに かさねる(人は 花の あいだを あるく) */
function drawFlowerField(list) {
  let i = 0;
  for (const f of flowers) {
    while (i < list.length && actorY(list[i]) <= f.y) {

      a.puppet.draw(ctx, a.airY);

/* およいでいる子の まわりの あわ(からだの したに しく) */
function foamR(pp) { return Math.max(pp.w * 0.55, pp.h * 0.3); }

function drawFoamBack(a) {
  const pp = a.puppet;
  const r = foamR(pp);
  const dog = a.swim === "dog";
  ctx.save();
  ctx.globalAlpha = 0.4; ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.ellipse(pp.x, a.lineY + Math.sin(a.wob) * 3,
    dog ? r * 1.35 : pp.h * 0.58, dog ? r * 0.46 : pp.w * 0.44, 0, 0, 7);
  ctx.fill();
  ctx.restore();
}

/* からだに かかる みずと、すすんできた あと */
function drawFoamFront(a) {
  const pp = a.puppet;
  const y = a.lineY + Math.sin(a.wob) * 3;
  const dog = a.swim === "dog";
  const r = foamR(pp);
  ctx.save();
  if (dog) {
    /* いぬかき … 水中の ぶんを みずいろで かくす(ふちは ぼかして 水に とけこませる) */
    const sink = pp.h * SINK;
    const cy = y + sink * 0.5, rx = r * 1.1, ry = sink * 0.78, rr = Math.max(rx, ry);
    const g = ctx.createRadialGradient(pp.x, cy, 1, pp.x, cy, rr);
    g.addColorStop(0, "rgba(126,199,236,.72)");
    g.addColorStop(0.72, "rgba(126,199,236,.6)");
    g.addColorStop(1, "rgba(126,199,236,0)");
    ctx.save();
    ctx.translate(pp.x, cy);
    ctx.scale(rx / rr, ry / rr);
    ctx.translate(-pp.x, -cy);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pp.x, cy, rr, 0, 7);
    ctx.fill();
    ctx.restore();
    /* みずぎわの しろい あわ */
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(pp.x, y, r * 0.9, r * 0.24, 0, 0, 7);
    ctx.fill();
  } else {
    /* 背泳ぎ … からだの したがわに かかる みずの ライン */
    ctx.strokeStyle = "#fff"; ctx.lineCap = "round";
    ctx.globalAlpha = 0.5; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(pp.x, y, pp.h * 0.5, pp.w * 0.34, 0, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }
  /* すすんできた あと(うしろに のびる すじ) */
  const len = dog ? r * 1.2 : pp.h * 0.55;
  ctx.strokeStyle = "#fff"; ctx.lineCap = "round";
  ctx.globalAlpha = 0.32; ctx.lineWidth = 5;
  for (let i = 0; i < 3; i++) {
    const from = len + i * 26 + a.speed * 0.12;
    ctx.beginPath();
    ctx.moveTo(pp.x - a.dir * from, y + Math.sin(T * 4 + i) * 3);
    ctx.lineTo(pp.x - a.dir * (from + 16), y + Math.sin(T * 4 + i + 1) * 3);
    ctx.stroke();
  }
  ctx.restore();
}

function drawDrops() {
  ctx.save();
  ctx.fillStyle = "#fff";
  for (const d of drops) {
    ctx.globalAlpha = Math.max(0, 1 - d.t / d.life) * 0.9;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, 1 - r.t / r.life) * 0.7;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r + r.t * 130, (r.r + r.t * 130) * 0.3, 0, 0, 7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawName(a) {
  if (a.bubbleT <= 0 || !a.name || a.gone) return;
  const b = a.puppet.bbox(a.airY);
  ctx.font = "bold 26px sans-serif";
  const tw = ctx.measureText(a.name).width;
  const bx = a.puppet.x - tw / 2 - 14, by = b.y - 52;
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.beginPath();
  ctx.roundRect(bx, by, tw + 28, 42, 20);
  ctx.fill();
  ctx.fillStyle = "#4a3f35";
  ctx.fillText(a.name, bx + 14, by + 30);
}

/* ---------------- ループ ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  T += dt;

  onStage = actors.reduce((n, a) => n + (a.gone ? 0 : 1), 0);
  for (const a of actors) {
    if (stage === "water") updateSwimmer(a, dt);
    else if (stage === "house") updateHouse(a, dt);
    else if (stage === "flower") (a.stroll ? updateStroller : updateFlutter)(a, dt);
    else updateWalker(a, dt);
    if (a.bubbleT > 0) a.bubbleT -= dt;
    a.puppet.update(dt);
  }
  if (stage === "water") {
    for (const d of drops) { d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 520 * dt; }
    for (let i = drops.length - 1; i >= 0; i--) if (drops[i].t > drops[i].life) drops.splice(i, 1);
    for (const r of rings) r.t += dt;
    for (let i = rings.length - 1; i >= 0; i--) if (rings[i].t > rings[i].life) rings.splice(i, 1);
    for (const b of bubs) { b.t += dt; b.y -= 40 * dt; b.x += Math.sin(b.t * 5) * 12 * dt; }
    for (let i = bubs.length - 1; i >= 0; i--) if (bubs[i].t > bubs[i].life) bubs.splice(i, 1);
  }

  /* --- 描画 --- */
  ctx.clearRect(0, 0, W, H);
  /* 奥のキャラから描く。おかの せかい・ひまわり ばたけは たて位置(下ほど てまえ)、
     ほかは 大きさ(小さいほど おく)で じゅんばんを きめる */
  const list = (stage === "land" || stage === "flower")
    ? actors.slice().sort((x, y) => actorY(x) - actorY(y))
    : actors.slice().sort((x, y) => x.puppet.h - y.puppet.h);

  if (stage === "water") {
    drawWaterBack();
    for (const a of list) if (a.swim === "fish" && !a.gone) a.puppet.draw(ctx);
    drawBubs();
    drawVeil();
    drawSurface();
    for (const a of list) {
      if ((a.swim !== "back" && a.swim !== "dog") || a.gone) continue;
      drawFoamBack(a);
      a.puppet.draw(ctx);
      drawFoamFront(a);
    }
    for (const a of list) if (a.swim === "fly" && !a.gone) a.puppet.draw(ctx);
    drawDrops();
  } else if (stage === "house") {
    drawHouseBack();
    for (const a of list) a.puppet.draw(ctx, a.airY);
    drawHouseFront();
    for (const a of list) if (a.act === "sleep") drawBlanket(a);   // かけぶとん
    drawHouseFx();
  } else if (stage === "flower") {
    drawFlowerBack();
    drawFlowerField(list);
  } else {
    drawLandBack();
    for (const a of list) a.puppet.draw(ctx, a.airY);
  }
  for (const a of list) drawName(a);

  requestAnimationFrame(loop);
}
</script>
