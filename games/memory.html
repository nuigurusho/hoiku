<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>カードあわせ</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css?v=25">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/memory.png" alt=""> カードあわせ</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="startScreen" class="panel">
    <h2>おなじ えを 2まい みつけてね!</h2>

    <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ<span class="tag">じぶんの ペースで・かいすうは かぞえない(1〜2さいから)</span></div>
    <div class="row">
      <button class="btn big blue" data-mode="ren4">れんしゅう</button>
    </div>

    <div class="mode-sec">🔥 ガチンコ<span class="tag">すくない かいすうランキング・クリアで つぎが とけるよ</span></div>
    <div class="row" id="gachiRow">
      <button class="btn big green"  data-mode="g1">かんたん<br><span style="font-size:14px">4くみ</span></button>
      <button class="btn big orange" data-mode="g2">ふつう<br><span style="font-size:14px">6くみ</span></button>
      <button class="btn big purple" data-mode="g3">むずかしい<br><span style="font-size:14px">8くみ</span></button>
    </div>
    <div class="rank" id="rankView"></div>
  </div>

  <div id="playScreen" class="hidden">
    <div class="hud"><span id="pairHud"></span><span id="tryHud"></span></div>
    <div class="cardgrid" id="grid"></div>
    <div class="row hidden" id="endRow">
      <button class="btn big green" id="againBtn">もういちど</button>
      <button class="btn big pink hidden" id="honbanBtn">ほんばんへ</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=26"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const EXTRA = ["🍎", "🚌", "🐸", "🌻", "🍙", "🐠", "🎈", "🚀", "🍰", "🐞"];
const GAME = "memory";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];
const MODES = {
  ren4: { label: "れんしゅう", pairs: 4 },
  g1: { label: "かんたん",   pairs: 4, lv: 1 },
  g2: { label: "ふつう",     pairs: 6, lv: 2 },
  g3: { label: "むずかしい", pairs: 8, lv: 3 },
};
let G = null;

function refreshLocks() {
  const lv = Tiers.unlock(GAME);
  document.querySelectorAll("#gachiRow .btn").forEach((b) => {
    const need = MODES[b.dataset.mode].lv;
    if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
    b.classList.toggle("locked", need > lv);
    b.innerHTML = (need > lv ? "🔒 " : "") + b.dataset.orig;
  });
  $("rankView").innerHTML = Tiers.rankHtml(GAME, RANK_LABELS, { unit: "かい" });
}
refreshLocks();

document.querySelectorAll("#startScreen [data-mode]").forEach((b) => {
  b.onclick = () => {
    const m = MODES[b.dataset.mode];
    if (m.lv && m.lv > Tiers.unlock(GAME)) {
      Sound.bad();
      Ui.msg("まえのだんかいを クリアしてね", 1600, "#4dabf7");
      return;
    }
    start(m);
  };
});
/* れんしゅうを クリアしたら そのまま ガチンコの かんたんへ */
$("honbanBtn").onclick = () => {
  $("playScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
  refreshLocks();
  document.querySelector('#gachiRow [data-mode="g1"]').click();
};
Nav.onLeave(() => { if (G) G.stop = true; refreshLocks(); });
$("againBtn").onclick = () => {
  if (G) G.stop = true;
  $("playScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
  refreshLocks();
};

async function start(mode) {
  Sound.tap();
  if (G) G.stop = true;
  const pairs = mode.pairs;
  const recs = await Store.ensureSamples();
  let faces = Util.shuffle(recs).slice(0, pairs).map((r) => r.dataURL);
  let ei = 0;
  while (faces.length < pairs) faces.push(Util.emojiCanvas(EXTRA[ei++ % EXTRA.length], 200).toDataURL());

  const deck = Util.shuffle([...faces, ...faces].map((src) => ({ src, key: src })));
  G = { mode, open: [], busy: false, matched: 0, pairs, tries: 0, stop: false, cards: [] };

  const grid = $("grid");
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = "repeat(4, 1fr)";
  deck.forEach((cardDef) => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="face front">❓</div>
      <div class="face backface"><img src="${cardDef.src}"></div>`;
    el.onclick = () => flip(el, cardDef);
    grid.appendChild(el);
    G.cards.push({ el, card: cardDef });
  });

  $("startScreen").classList.add("hidden");
  $("playScreen").classList.remove("hidden");
  $("endRow").classList.add("hidden");
  $("honbanBtn").classList.add("hidden");
  updateHud();
}

function updateHud() {
  $("pairHud").textContent = `みつけた: ${G.matched} / ${G.pairs}`;
  // れんしゅうは かいすうを 気にしないで あそぶ
  $("tryHud").textContent = G.mode.lv ? `めくった: ${G.tries}かい` : "";
}

function flip(el, card) {
  if (G.busy || el.classList.contains("flipped")) return;
  Sound.tap();
  el.classList.add("flipped");
  G.open.push({ el, card });
  if (G.open.length < 2) return;

  G.busy = true;
  G.tries++;
  const [a, b] = G.open;
  if (a.card.key === b.card.key) {
    setTimeout(() => {
      a.el.classList.add("matched");
      b.el.classList.add("matched");
      Sound.good();
      G.matched++;
      G.open = [];
      G.busy = false;
      updateHud();
      if (G.matched === G.pairs) return clearGame();
    }, 450);
  } else {
    setTimeout(() => {
      a.el.classList.remove("flipped");
      b.el.classList.remove("flipped");
      G.open = [];
      G.busy = false;
      updateHud();
    }, 950);
  }
  updateHud();
}

function clearGame() {
  Sound.fanfare();
  Ui.confetti();
  if (G.mode.lv) {
    Tiers.setUnlock(GAME, Math.min(3, G.mode.lv + 1));
    Tiers.addRank(GAME, G.mode.lv, "?", G.tries, { lowerIsBetter: true });
    Ui.msg("クリア!🏆", 2500, null, `${G.tries}かいで クリア`);
  } else {
    Ui.msg("ぜんぶ みつけた!🎉", 2500);
  }
  $("endRow").classList.remove("hidden");
  $("honbanBtn").classList.toggle("hidden", !!G.mode.lv);   // れんしゅうから ほんばんへ
}
</script>
</body>
</html>
