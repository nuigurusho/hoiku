<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>じゃんけん</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=33">
<style>
  .hands { display: flex; gap: 18px; justify-content: center; margin: 10px 0 4px; }
  .hbtn {
    font-size: 64px;
    width: 110px; height: 110px;
    border-radius: 26px;
    border: 3px solid var(--cream-d);
    background: #fff;
    box-shadow: 0 6px 0 var(--cream-d);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .hbtn:active { transform: translateY(6px); box-shadow: none; }
  .streak { text-align: center; font-size: 24px; font-weight: bold; min-height: 32px; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/janken.png" alt=""> じゃんけん</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="selectScreen" class="panel">
    <h2>あそびかたを えらんでね</h2>

    <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ<span class="tag">かちまけなし・「ぽん!」で みんな いっしょに(1〜2さいから)</span></div>
    <div class="row" data-tier="yuru"><button class="btn big yellow" data-mode="crowd">みんなで</button></div>

    <div class="mode-sec">🔥 ガチンコ<span class="tag">てんを ためる ゲーム。まけても へらない・ゲームオーバー なし</span></div>
    <div class="row" id="gachiRow">
      <button class="btn big green"  data-mode="g1">かんたん<br><span style="font-size:14px">8かい で 8てん</span></button>
      <button class="btn big orange" data-mode="g2">ふつう<br><span style="font-size:14px">10かい で 14てん</span></button>
      <button class="btn big purple" data-mode="g3">むずかしい<br><span style="font-size:14px">12かい で 20てん</span></button>
    </div>
    <p class="note">かち は 3てん。<b>れんしょうすると 5てん・7てん…</b> と どんどん あがるよ。あいこも 1てん!</p>
    <div class="rank" id="rankView"></div>
  </div>

  <div id="playScreen" class="hidden">
    <div class="hud hidden" id="gachiHud"><span id="gPoint"></span><span id="gLeft"></span></div>
    <div class="stage-wrap"><canvas id="cv" class="stage" width="1000" height="540"></canvas></div>
    <div class="streak" id="streak"></div>
    <p style="text-align:center;font-weight:bold;margin:4px" id="playHint">だすのを えらんでね!</p>
    <div class="hands" id="handRow">
      <button class="hbtn" data-h="0">✊</button>
      <button class="hbtn" data-h="1">✌️</button>
      <button class="hbtn" data-h="2">✋</button>
    </div>
    <div class="row">
      <button class="btn big pink hidden" id="ponBtn">ぽん!</button>
      <button class="btn gray" id="backBtn">えらびなおす</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=28"></script>
<script src="../js/rig.js?v=16"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let sceneBg = null;
Util.loadImage("../assets/backgrounds/janken.jpg").then((img) => { sceneBg = img; });
const HANDS = ["✊", "✌️", "✋"];
const HAND_CV = HANDS.map((h) => Util.emojiCanvas(h, 300));

let puppet = null, charName = "", selRec = null;
let state = { mode: "idle", show: -1, t: 0, streak: 0, busy: false, points: 0, round: 0 };
let gmode = null, over = false;

const GAME = "janken";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];

/* ---------- てんすうの きまり ----------
   まけても てんは へらない・リセットも しない。ゲームオーバーも ない。
   きまった かいすう の あいだに ノルマの てんに とどけば クリア。
   とどかなくても「ぜんぶで ○てん!」で おわる(まけ が こわくない)。
   かちが つづくほど 1かいの てんが 大きく なるので、
   じゃんけんの うんが わるい 日でも、どこかで 気もちよく なれる。 */
const WIN_BASE = 3;    // 1かいめの かち
const WIN_STEP = 2;    // れんしょう 1つごとに ふえる ぶん
const WIN_MAX = 15;    // 1かいの じょうげん
const TIE_POINT = 1;   // あいこ
const MODES = {
  crowd: { label: "みんなで", crowd: true },
  g1: { label: "かんたん",   rounds: 8,  goal: 8,  lv: 1 },
  g2: { label: "ふつう",     rounds: 10, goal: 14, lv: 2 },
  g3: { label: "むずかしい", rounds: 12, goal: 20, lv: 3 },
};
const winPoint = (streak) => Math.min(WIN_MAX, WIN_BASE + (streak - 1) * WIN_STEP);

let allChars = [];

async function initSelect() {
  const recs = await Store.forGame();
  allChars = recs.filter((r) => r.cat === "char");
  selRec = allChars[0] || null;
  refreshLocks();
}
initSelect();

function refreshLocks() {
  const lv = Tiers.unlock(GAME);
  document.querySelectorAll("#gachiRow .btn").forEach((b) => {
    const need = MODES[b.dataset.mode].lv;
    if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
    b.classList.toggle("locked", need > lv);
    b.innerHTML = (need > lv ? "🔒 " : "") + b.dataset.orig;
  });
  $("rankView").innerHTML = Tiers.rankHtml(GAME, RANK_LABELS, { unit: "てん" });
}

document.querySelectorAll("#selectScreen [data-mode]").forEach((b) => {
  b.onclick = async () => {
    const m = MODES[b.dataset.mode];
    if (m.lv && m.lv > Tiers.unlock(GAME)) {
      Sound.bad();
      Ui.msg("まえのだんかいを クリアしてね", 1600, "#4dabf7");
      return;
    }
    Sound.tap();
    /* あそびかたを えらんだ あとに、キャラえらび せんようがめんへ */
    const rec = await Picker.one({
      title: "だれと じゃんけんする?", records: allChars, selectedId: selRec && selRec.id,
    });
    if (!rec) return;
    selRec = rec;
    gmode = m;
    const parts = await Rig.load(selRec);
    charName = selRec.name || "";
    puppet = new Puppet(parts, { x: 300, y: 500, h: 330, facing: 1 });
    state.streak = 0; state.show = -1; state.busy = false;
    state.points = 0; state.round = 0; over = false;
    $("selectScreen").classList.add("hidden");
    $("playScreen").classList.remove("hidden");
    $("streak").textContent = "";
    $("handRow").classList.toggle("hidden", !!m.crowd);
    $("ponBtn").classList.toggle("hidden", !m.crowd);
    $("gachiHud").classList.toggle("hidden", !m.rounds);
    $("playHint").textContent = m.crowd ? "「ぽん!」で みんな いっしょに!" : "だすのを えらんでね!";
    updateGachiHud();
  };
});

Nav.onLeave(() => { over = true; state.busy = false; refreshLocks(); });
$("backBtn").onclick = () => {
  $("playScreen").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
  refreshLocks();
};

function updateGachiHud() {
  if (!gmode || !gmode.rounds) return;
  $("gPoint").textContent = `⭐ ${state.points} / ${gmode.goal}てん`;
  $("gLeft").textContent = `あと ${Math.max(0, gmode.rounds - state.round)}かい`;
}

document.querySelectorAll(".hbtn").forEach((b) => {
  b.onclick = () => play(+b.dataset.h);
});
$("ponBtn").onclick = () => play(null);

function play(playerHand) {
  if (state.busy || over || !puppet) return;
  state.busy = true;
  state.show = -1;
  Ui.msg("じゃんけん…", 1200, "#9775fa");
  Sound.tick();
  setTimeout(() => Sound.tick(), 400);
  setTimeout(() => Sound.tick(), 800);
  state.mode = "shake";
  setTimeout(() => {
    state.mode = "idle";
    state.show = Util.randInt(0, 2);
    Sound.pon();
    Ui.msg("ぽん!", 900, "#ff6b9d");
    if (playerHand === null) {
      // みんなでモード:出すだけ
      setTimeout(() => { state.busy = false; }, 1200);
      return;
    }
    setTimeout(() => {
      const me = playerHand, cp = state.show;
      let gain = 0;
      if (me === cp) {
        gain = TIE_POINT;
        Ui.msg(`あいこ! +${gain}てん`, 1300, "#ff922b");
        Sound.pop();
      } else if ((me === 0 && cp === 1) || (me === 1 && cp === 2) || (me === 2 && cp === 0)) {
        state.streak++;
        gain = winPoint(state.streak);
        Ui.msg(`かち!🎉 +${gain}てん`, 1500, "#51cf66",
          state.streak >= 2 ? `${state.streak}れんしょう ボーナス!` : "");
        Sound.good();
        // キャラは まけたので「しっぱい」の こえ(あれば)
        Sound.playVoice(selRec && selRec.voices, ["fail"]);
        if (state.streak >= 2) Ui.confetti(1500, 40 + state.streak * 20);
      } else {
        /* まけても てんは へらない・0に もどらない。
           「まけ = そんをする」に しないための だいじな ところ */
        state.streak = 0;
        Ui.msg("ざんねん!", 1300, "#4dabf7", "てんすうは そのまま。つぎ いこう!");
        Sound.tap();
        // キャラは かったので「よろこび」の こえ(あれば)
        Sound.playVoice(selRec && selRec.voices, ["joy"]);
      }
      state.points += gain;
      $("streak").textContent = state.streak >= 2
        ? `${state.streak}れんしょう ${"⭐".repeat(Math.min(state.streak, 10))}`
        : (state.streak === 1 ? "⭐" : "");
      updateGachiHud();
      if (gmode && gmode.rounds) {
        state.round++;
        updateGachiHud();
        if (state.points >= gmode.goal) return finishGachi(true);
        if (state.round >= gmode.rounds) return finishGachi(false);
      }
      state.busy = false;
    }, 1100);
  }, 1400);
}

/* おわり。ノルマに とどいたら クリア、とどかなくても おこられない。
   どちらでも てんすうは ランキングに のこる */
function finishGachi(cleared) {
  over = true; state.busy = false;
  Tiers.addRank(GAME, gmode.lv, charName || "?", state.points);
  if (cleared) {
    Tiers.setUnlock(GAME, Math.min(3, gmode.lv + 1));
    Sound.fanfare();
    Ui.confetti();
    Ui.msg(`クリア!🏆 ${state.points}てん!`, 2600);
  } else {
    Sound.good();
    Ui.confetti(1600, 70);
    Ui.msg(`ぜんぶで ${state.points}てん!`, 2600, "#ff922b", "よく がんばったね!");
  }
  setTimeout(() => {
    $("playScreen").classList.add("hidden");
    $("selectScreen").classList.remove("hidden");
    refreshLocks();
  }, 2600);
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, 1000, 540);
  if (sceneBg) ctx.drawImage(sceneBg, 0, 0, 1000, 540);
  else {
    const sky = ctx.createLinearGradient(0, 0, 0, 540);
    sky.addColorStop(0, "#fff0f6"); sky.addColorStop(1, "#fff9db");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 1000, 540);
    ctx.fillStyle = "#96d06c"; ctx.fillRect(0, 505, 1000, 35);
  }

  if (puppet) {
    puppet.walking = state.mode === "shake";
    if (state.mode === "shake" && Math.random() < 0.1) puppet.hop();
    puppet.update(dt);
    puppet.draw(ctx);
    if (charName) {
      ctx.font = "bold 26px sans-serif";
      ctx.fillStyle = "#4a3f35";
      ctx.textAlign = "center";
      ctx.fillText(charName, 300, 60);
      ctx.textAlign = "left";
    }
  }

  // キャラの出した手
  if (state.show >= 0) {
    const s = 1 + Math.sin(now / 180) * 0.04;
    ctx.save();
    ctx.translate(730, 280);
    ctx.scale(s, s);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(0, 0, 170, 0, 7); ctx.fill();
    ctx.drawImage(HAND_CV[state.show], -150, -150);
    ctx.restore();
  } else if (state.mode === "shake") {
    ctx.font = "bold 60px sans-serif";
    ctx.fillStyle = "#9775fa";
    ctx.fillText("・・・", 660, 300);
  }
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
