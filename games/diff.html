<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>まちがいさがし</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=44">
<style>
  .pair {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 6px;
  }
  .pair canvas {
    width: min(46vw, 560px);
    height: auto;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(120,80,40,.22);
    background: #fff;
    touch-action: manipulation;
  }
  @media (max-width: 700px) {
    .pair canvas { width: 92vw; }
  }
  /* みるモードは こたえを おおきく出すので、えを すこし ちいさくして ばしょを あける */
  body.view-mode .pair canvas { width: min(40vw, 460px); }
  @media (max-width: 700px) {
    body.view-mode .pair canvas { width: 74vw; }
  }
  /* まちがいの かずを しめす「ただのフレーム」(1こなので よこはば いっぱいには しない) */
  .choices.one { grid-template-columns: 1fr; max-width: 420px; margin: 12px auto; }
  .play-hint { text-align: center; font-weight: bold; margin: 4px; }
  /* みるモードは HUD が ないので、フローティングの「もどる」と かさならないように 下げる */
  body.view-mode .play-hint { margin: 62px 8px 4px; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/diff.png" alt=""> まちがいさがし</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="selectScreen" class="panel">
    <h2>あそびかたを えらんでね</h2>

    <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ</div>
    <div class="row" data-tier="yuru"><button class="btn big yellow" data-mode="miru">みんなで</button></div>

    <div class="mode-sec">🔥 ガチンコ</div>
    <div class="row" id="gachiRow">
      <button class="btn big green"  data-mode="g1">かんたん<br><span style="font-size:14px">40びょう</span></button>
      <button class="btn big orange" data-mode="g2">ふつう<br><span style="font-size:14px">25びょう</span></button>
      <button class="btn big purple" data-mode="g3">むずかしい<br><span style="font-size:14px">15びょう</span></button>
    </div>
    <button class="btn rank-open" id="rankBtn" type="button">🏆 ランキング</button>
  </div>

  <div id="playScreen" class="hidden">
    <div class="hud" id="hud">
      <span id="found">みつけた: 0</span>
      <span id="left">のこり: ?</span>
      <span id="timeHud" class="hidden">⏰</span>
    </div>
    <p class="play-hint" id="playHint">みぎの えを タッチして まちがいを さがしてね!</p>
    <div class="pair">
      <canvas id="cvL"></canvas>
      <canvas id="cvR"></canvas>
    </div>
    <div class="choices one hidden" id="countFrame"></div>
    <div class="answer-big hidden" id="answerBig"></div>
    <div class="row">
      <button class="btn yellow hidden" id="revealBtn">こたえを みる</button>
      <button class="btn gray" id="againBtn">えらびなおす</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=35"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const GAME = "diff";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];
const MODES = {
  miru: { label: "みんなで", view: true },
  g1: { label: "かんたん",   limit: 40, lv: 1 },
  g2: { label: "ふつう",     limit: 25, lv: 2 },
  g3: { label: "むずかしい", limit: 15, lv: 3 },
};
let G = null, selPic = null, allPics = [];

async function initSelect() {
  const recs = await Store.forGame();
  allPics = recs.filter((r) =>
    (r.cat === "pic" || r.cat === "bg") &&
    ((r.diffVariants && r.diffVariants.length) || (r.diffSpots && r.diffSpots.length))
  );
  selPic = allPics[0] || null;
  refreshLocks();
}
initSelect();

function refreshLocks() {
  const lv = Tiers.unlock(GAME);
  document.querySelectorAll("#gachiRow .btn").forEach((b) => {
    const need = MODES[b.dataset.mode].lv;
    if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
    b.classList.toggle("locked", need > lv);
    b.innerHTML = (need > lv ? "🔒 " : "") + b.dataset.orig;
  });
  Tiers.bindRankButton($("rankBtn"), GAME, RANK_LABELS, { unit: "びょう" });
}

document.querySelectorAll("#selectScreen [data-mode]").forEach((b) => {
  b.onclick = async () => {
    const m = MODES[b.dataset.mode];
    if (m.lv && m.lv > Tiers.unlock(GAME)) {
      Sound.bad();
      Ui.msg("まえのだんかいを クリアしてね", 1600, "#4dabf7");
      return;
    }
    Sound.tap();
    /* あそびかたを えらんだ あとに、えらび せんようがめんへ */
    const rec = await Picker.one({
      title: "どの えで あそぶ?", records: allPics, selectedId: selPic && selPic.id,
    });
    if (!rec) return;
    selPic = rec;
    startGame(rec, m);
  };
});

Nav.onLeave(() => {
  if (G) G.stop = true;
  document.body.classList.remove("view-mode");
  refreshLocks();
});
$("againBtn").onclick = () => {
  if (G) G.stop = true;
  document.body.classList.remove("view-mode");
  $("playScreen").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
  refreshLocks();
};

async function startGame(rec, mode) {
  if (G) G.stop = true;
  const img = await Util.loadImage(rec.dataURL);
  const variants = (rec.diffVariants || []).filter((v) => v.dataURL && v.spots && v.spots.length);
  const variant = variants.length ? variants[Math.floor(Math.random() * variants.length)] : null;
  const diffImg = variant ? await Util.loadImage(variant.dataURL) : null;
  let spots = ((variant && variant.spots) || rec.diffSpots || []).map((s) => ({ ...s, found: false }));
  if (!spots.length) {
    // スポット未設定なら自動でつくる(こっそりモード)
    for (let i = 0; i < 5; i++) {
      spots.push({ x: Util.rand(0.15, 0.85), y: Util.rand(0.15, 0.85), r: 0.06, found: false });
    }
  }

  const W = img.width, H = img.height;
  const cvL = $("cvL"), cvR = $("cvR");
  cvL.width = cvR.width = W;
  cvL.height = cvR.height = H;
  cvL.getContext("2d").drawImage(img, 0, 0);

  // 右側:登録した差分画像を表示。旧データだけ従来の自動差分で遊べる
  const ctxR = cvR.getContext("2d");
  ctxR.drawImage(diffImg || img, 0, 0, W, H);
  if (!diffImg) {
    for (const s of spots) {
      const cx = s.x * W, cy = s.y * H, r = s.r * W;
      let sx = cx + (cx < W / 2 ? r * 2.4 : -r * 2.4);
      let sy = cy + (cy < H / 2 ? r * 1.6 : -r * 1.6);
      sx = Util.clamp(sx, r, W - r);
      sy = Util.clamp(sy, r, H - r);
      const patch = Util.makeCanvas(Math.ceil(r * 2), Math.ceil(r * 2));
      const pctx = patch.getContext("2d");
      pctx.drawImage(img, sx - r, sy - r, r * 2, r * 2, 0, 0, r * 2, r * 2);
      pctx.globalCompositeOperation = "destination-in";
      const grad = pctx.createRadialGradient(r, r, r * 0.55, r, r, r);
      grad.addColorStop(0, "rgba(0,0,0,1)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      pctx.fillStyle = grad;
      pctx.fillRect(0, 0, r * 2, r * 2);
      ctxR.drawImage(patch, cx - r, cy - r);
    }
  }

  G = { img, diffImg, spots, W, H, done: false, mode, stop: false, elapsed: 0 };
  $("selectScreen").classList.add("hidden");
  $("playScreen").classList.remove("hidden");
  $("timeHud").classList.toggle("hidden", !mode.limit);
  updateHud();

  /* みるモード:タッチして さがすのではなく、ながめて「こたえを みる」だけ */
  const view = !!mode.view;
  document.body.classList.toggle("view-mode", view);
  $("hud").classList.toggle("hidden", view);
  $("countFrame").classList.toggle("hidden", !view);
  $("answerBig").classList.add("hidden");
  $("revealBtn").classList.toggle("hidden", !view);
  $("playHint").textContent = view
    ? "どこが ちがうかな? わかったら えを タッチしてみよう!"
    : "どちらかの えを タッチして まちがいを さがしてね!";
  if (view) {
    $("countFrame").innerHTML = "";
    const f = document.createElement("div");
    f.className = "choice frame c1";
    f.id = "countText";
    $("countFrame").appendChild(f);
  }
  updateCount();

  /* ---- 2まいの えの どちらでも、おなじ ばしょを おせる ----
     「まちがっている ほう」だけを おさせると、ちいさい子には むずかしい。
     ばしょが 合っていれば、まちがっていない ほうの えでも あたりに する。
     みんなで(ゆるふわ)でも おせる。じかんも ノルマも ないので、
     さわって みつける よろこびだけ ふえる。 */
  const hit = (target) => (e) => {
    if (G.done) return;
    const p = Util.canvasPos(target, e);
    for (const s of G.spots) {
      if (s.found) continue;
      if (Math.hypot(p.x - s.x * W, p.y - s.y * H) < s.r * W * 1.35) return foundSpot(s);
    }
    Sound.tap();
  };
  cvL.onpointerdown = hit(cvL);
  cvR.onpointerdown = hit(cvR);

  if (view) return;

  // ガチンコ:せいげんじかんの カウントダウン
  if (mode.limit) {
    let last = performance.now();
    (function tick(now) {
      if (G.stop || G.done) return;
      G.elapsed += (now - last) / 1000; last = now;
      const rem = Math.max(0, mode.limit - G.elapsed);
      $("timeHud").textContent = `⏰ ${Math.ceil(rem)}`;
      if (rem <= 0) return failGame();
      requestAnimationFrame(tick);
    })(last);
  }

}

/* まちがいを 1つ みつけた */
function foundSpot(s) {
  s.found = true;
  Sound.pop();
  markSpot(s);
  updateHud();
  updateCount();
  if (!G.spots.every((q) => q.found)) {
    Ui.msg("あたり!", 800, "#51cf66");
    return;
  }
  G.done = true;
  Sound.fanfare();
  Ui.confetti();
  if (G.mode.limit) {
    const secs = Math.max(1, Math.round(G.elapsed));
    Tiers.setUnlock(GAME, Math.min(3, G.mode.lv + 1));
    Tiers.addRank(GAME, G.mode.lv, "?", secs, { lowerIsBetter: true });
    Ui.msg(`クリア!🏆 ${secs}びょう`, 2400);
  } else {
    Ui.msg("ぜんぶ みつけた!", 2200);
    $("revealBtn").classList.add("hidden");
  }
}

/* みんなでモードの まんなかの わく(のこりの かず) */
function updateCount() {
  const el = $("countText");
  if (!el || !G) return;
  const f = G.spots.filter((s) => s.found).length;
  el.textContent = f
    ? `みつけた ${f}こ / ぜんぶで ${G.spots.length}こ`
    : `まちがいは ${G.spots.length}こ あるよ`;
}

function failGame() {
  G.done = true;
  Sound.bad();
  const f = G.spots.filter((s) => s.found).length;
  Ui.msg(`じかんぎれ!みつけた ${f}こ`, 2400, "#9775fa");
  // のこりを おしえてあげる
  for (const s of G.spots) if (!s.found) markSpot(s);
}

/* ---------- みるモード:「こたえを みる」で こたえを おおきく出す ---------- */
$("revealBtn").onclick = () => {
  if (!G || G.done) return;
  G.done = true;
  const already = G.spots.filter((s) => s.found).length;
  G.spots.forEach((s, i) => markSpot(s, i + 1));
  const box = $("answerBig");
  box.innerHTML = "";
  const label = document.createElement("span");
  label.className = "answer-label";
  label.textContent = "こたえは…";
  const text = document.createElement("div");
  text.textContent = already
    ? `ここが ${G.spots.length}こ ちがったよ!(${already}こ みつけたね)`
    : `ここが ${G.spots.length}こ ちがったよ!`;
  box.append(label, text);
  box.classList.remove("hidden");
  Sound.pon();
  Ui.confetti(1500, 60);
  $("revealBtn").classList.add("hidden");
};

/* まちがいの ばしょに まるを つける(みるモードでは ばんごうも 出す) */
function markSpot(s, num) {
  for (const cv of [$("cvL"), $("cvR")]) {
    const ctx = cv.getContext("2d");
    ctx.strokeStyle = "#ff6b9d";
    ctx.lineWidth = Math.max(5, G.W * 0.008);
    ctx.beginPath();
    ctx.arc(s.x * G.W, s.y * G.H, s.r * G.W * 1.15, 0, 7);
    ctx.stroke();
    if (num) {
      const size = Math.max(22, G.W * 0.05);
      ctx.save();
      ctx.font = `bold ${size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = Math.max(4, size * 0.22);
      ctx.strokeStyle = "#fff";
      ctx.fillStyle = "#ff6b9d";
      // まるの うえに 出すと はみ出すときは、まるの したに 出す
      const x = s.x * G.W;
      const off = s.r * G.W * 1.15 + size * 0.7;
      let y = s.y * G.H - off;
      if (y - size * 0.6 < 0) y = s.y * G.H + off;
      y = Util.clamp(y, size * 0.6, G.H - size * 0.6);
      ctx.strokeText(num, x, y);
      ctx.fillText(num, x, y);
      ctx.restore();
    }
  }
}

function updateHud() {
  const f = G.spots.filter((s) => s.found).length;
  $("found").textContent = `みつけた: ${f}`;
  $("left").textContent = `のこり: ${G.spots.length - f}`;
}
</script>
</body>
</html>
