<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>４たくクイズ</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=64">
<style>
  .qemoji { text-align: center; font-size: 90px; margin: 6px 0; }
  .qimage {
    display: block;
    width: min(300px, 62vw);
    height: min(300px, 36vh);
    object-fit: contain;
    margin: 6px auto;
    filter: drop-shadow(0 7px 5px rgba(91, 74, 54, .18));
  }
  .qtext {
    text-align: center;
    font-size: clamp(22px, 4.5vw, 36px);
    font-weight: bold;
    margin: 8px auto;
    max-width: 900px;
  }
  .qnum { text-align: center; font-size: 20px; font-weight: bold; color: #8a7a68; margin-top: 10px; }
  .stars { text-align: center; font-size: 46px; letter-spacing: 6px; }
  /* みるモードは こたえを おおきく出すので、絵を すこし ちいさくして ばしょを あける */
  body.view-mode .qemoji { font-size: 64px; margin: 2px 0; }
  body.view-mode .qtext { font-size: clamp(20px, 4vw, 32px); }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/quiz.png" alt=""> ４たくクイズ</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="startScreen" class="panel">
    <h2>クイズたいかい!</h2>
    <p style="font-size:22px">4つのなかから こたえを えらぼう!</p>

    <div class="mode-sec" data-tier="yuru">🌈 みんなで</div>
    <div class="row" data-tier="yuru">
      <button class="btn big yellow" data-mode="miru" data-quiz-kind="standard">ものしりクイズ</button>
      <button class="btn big yellow" data-mode="miru" data-quiz-kind="character">キャラクタークイズ</button>
    </div>

    <div class="mode-sec">🔥 ガチンコ</div>
    <div class="row" id="gachiRow">
      <button class="btn big green" data-mode="gachi" data-quiz-kind="standard">ものしりクイズ<br><span style="font-size:14px">10もんちゅう 7もんで クリア</span></button>
      <button class="btn big green" data-mode="gachi" data-quiz-kind="character">キャラクタークイズ<br><span style="font-size:14px">10もんちゅう 7もんで クリア</span></button>
    </div>
    <button class="btn rank-open" id="rankBtn" type="button">🏆 ランキング</button>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="qnum" id="qnum"></div>
    <div class="hud hidden" id="gachiHud"><span id="scoreHud"></span><span id="passHud"></span></div>
    <div class="qemoji" id="qemoji"></div>
    <img class="qimage hidden" id="qimage" alt="">
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="answer-big hidden" id="answerBig"></div>
    <div class="row hidden" id="viewRow">
      <button class="btn big green" id="revealBtn">こたえを みる</button>
      <button class="btn big green hidden" id="nextQBtn">つぎ ▶</button>
    </div>
  </div>

  <div id="endScreen" class="panel hidden">
    <h2>おしまい!</h2>
    <div class="stars" id="stars"></div>
    <p style="font-size:26px; font-weight:bold" id="scoreText"></p>
    <div class="row">
      <button class="btn big green" id="retryBtn">もういちど</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=51"></script>
<script src="../js/quiz-data.js?v=13"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const GAME = "quiz10"; // 旧「連続正解」ルールのランキングと分ける
const RANK_LABELS = ["クイズ"];
const MODES = {
  miru:   { label: "みんなで", n: 0, view: true },
  gachi: { label: "ガチンコ", total: 10, pass: 7, lv: 1 },
};
let queue = [], idx = 0, score = 0, busy = false;
let mode = null;
let quizKind = "standard";
let left = false;   // 「もどる」で ぬけたか(あとから 出る タイマーを とめる)

function refreshLocks() {
  Tiers.bindRankButton($("rankBtn"), GAME, RANK_LABELS, { unit: "もん" });
}
refreshLocks();

document.querySelectorAll("#startScreen [data-mode]").forEach((b) => {
  b.onclick = async () => {
    mode = MODES[b.dataset.mode];
    quizKind = b.dataset.quizKind || "standard";
    Sound.tap();
    await startRun();
  };
});
Nav.onLeave(() => { left = true; busy = true; document.body.classList.remove("view-mode"); refreshLocks(); });
$("retryBtn").onclick = () => {
  document.body.classList.remove("view-mode");
  $("endScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
  refreshLocks();
};

async function startRun() {
  queue = quizKind === "character"
    ? await makeCharacterQuestions()
    : Util.shuffle(CustomQuiz.defaultVisible(window.QUIZ).concat(CustomQuiz.enabled()));
  if (!queue.length) {
    const message = quizKind === "character"
      ? (localStorage.getItem("hideAuthorNames") === "1"
        ? "なまえを つけた キャラクターを 4にん いじょう とうろくしてね"
        : "なまえか さくしゃを つけた キャラクターを 4にん いじょう とうろくしてね")
      : "使う問題を1つ以上オンにしてください";
    Ui.msg(message, 2200, "#4dabf7");
    return;
  }
  if (mode.total) queue = pickQuestions(queue, mode.total);
  idx = 0; score = 0; left = false;
  $("startScreen").classList.add("hidden");
  $("endScreen").classList.add("hidden");
  $("quizScreen").classList.remove("hidden");
  $("gachiHud").classList.toggle("hidden", !mode.total);
  document.body.classList.toggle("view-mode", !!mode.view);
  $("viewRow").classList.toggle("hidden", !mode.view);
  updateGachiHud();
  show();
}

/* 候補が10問未満でも、同じ並びが続かないよう混ぜ直しながら必要数を選ぶ。 */
function pickQuestions(list, count) {
  const picked = [];
  while (picked.length < count) {
    const bag = Util.shuffle(list);
    picked.push(...bag.slice(0, count - picked.length));
  }
  return picked;
}

/* 登録済みキャラクターから、名前・作者名を当てる4択問題を作る。 */
async function makeCharacterQuestions() {
  const characters = (await Store.forGame("char")).filter((rec) => rec && rec.dataURL);
  const questions = [];
  const fields = [{ key: "name", q: "この キャラクターの なまえは?" }];
  if (localStorage.getItem("hideAuthorNames") !== "1") {
    fields.push({ key: "author", q: "この キャラクターを かいたのは だれ?" });
  }
  fields.forEach((field) => {
    const values = [...new Set(characters.map((rec) => (rec[field.key] || "").trim()).filter(Boolean))];
    if (values.length < 4) return;
    characters.forEach((rec) => {
      const answer = (rec[field.key] || "").trim();
      if (!answer) return;
      const others = Util.shuffle(values.filter((value) => value !== answer)).slice(0, 3);
      if (others.length < 3) return;
      questions.push({ q: field.q, image: rec.dataURL, imageRec: rec, choices: [answer, ...others], answer: 0 });
    });
  });
  return Util.shuffle(questions);
}

function updateGachiHud() {
  if (!mode.total) return;
  $("scoreHud").textContent = `せいかい: ${score}もん`;
  $("passHud").textContent = `${mode.pass}もんで クリア`;
}

function show() {
  const q = queue[idx];
  busy = false;
  $("qnum").textContent = mode.total
    ? `だい ${idx + 1} もん / ${mode.total} もん`
    : `だい ${idx + 1} もん / ${queue.length} もん`;
  $("qemoji").textContent = q.image ? "" : (q.emoji || "❓");
  $("qemoji").classList.toggle("hidden", !!q.image);
  $("qimage").classList.toggle("hidden", !q.image);
  $("qimage").src = q.image || "";
  if (q.image && q.imageRec && q.imageRec.rig && q.imageRec.rig.type === "butterfly") {
    Util.symCanvas(q.imageRec).then((canvas) => {
      if (queue[idx] === q) $("qimage").src = canvas.toDataURL("image/png");
    }).catch(() => {});
  }
  $("qtext").textContent = q.q;
  const box = $("choices");
  box.innerHTML = "";
  const order = Util.shuffle([0, 1, 2, 3]);
  order.forEach((ci, i) => {
    const b = document.createElement("button");
    b.className = `choice c${i}`;
    b.textContent = q.choices[ci];
    b.onclick = () => mode.view ? chooseView(ci, b) : answer(ci, b);
    box.appendChild(b);
  });
  if (mode.view) {
    $("answerBig").classList.add("hidden");
    $("revealBtn").classList.remove("hidden");
    $("nextQBtn").classList.add("hidden");
  }
}

/* ---------- みるモード:「こたえを みる」で こたえを おおきく出す ---------- */
function revealViewAnswer(chosen) {
  if (busy) return;
  busy = true;
  const q = queue[idx];
  const ans = q.choices[q.answer];
  document.querySelectorAll("#choices .choice").forEach((b) => {
    if (b.textContent === ans) b.classList.add("correct");
    else b.classList.add("dim");
  });
  const box = $("answerBig");
  box.innerHTML = "";
  const label = document.createElement("span");
  label.className = "answer-label";
  label.textContent = "こたえは…";
  const text = document.createElement("div");
  text.textContent = ans;
  box.append(label, text);
  box.classList.remove("hidden");
  if (chosen) {
    const pickedCorrect = chosen.textContent === ans;
    pickedCorrect ? Sound.good() : Sound.bad();
  } else {
    Sound.pon();
  }
  Ui.confetti(1500, 60);
  $("revealBtn").classList.add("hidden");
  $("nextQBtn").textContent = idx + 1 < queue.length ? "つぎ ▶" : "おしまい ▶";
  $("nextQBtn").classList.remove("hidden");
}

function chooseView(ci, button) {
  if (busy) return;
  revealViewAnswer(button);
}

$("revealBtn").onclick = () => revealViewAnswer(null);

$("nextQBtn").onclick = () => {
  Sound.tap();
  idx++;
  if (idx < queue.length) show();
  else finishView();
};

function finishView() {
  document.body.classList.remove("view-mode");
  $("viewRow").classList.add("hidden");
  $("quizScreen").classList.add("hidden");
  $("endScreen").classList.remove("hidden");
  $("stars").textContent = "⭐⭐⭐";
  $("scoreText").textContent = `${queue.length}もん ぜんぶ みたよ!`;
  Sound.fanfare();
  Ui.confetti();
}

function answer(ci, btn) {
  if (busy) return;
  busy = true;
  const q = queue[idx];
  const ok = ci === q.answer;
  document.querySelectorAll("#choices .choice").forEach((b) => {
    if (b.textContent === q.choices[q.answer]) b.classList.add("correct");
    else b.classList.add("dim");
  });
  if (ok) {
    score++;
    Sound.good();
    Ui.msg("せいかい!⭕", 1100, "#51cf66");
  } else {
    Sound.bad();
    Ui.msg("ざんねん…", 1100, "#4dabf7");
  }
  if (mode.total) updateGachiHud();

  setTimeout(() => {
    if (left) return;
    idx++;
    if (idx >= mode.total) return finishGachi();
    show();
  }, 1500);
}

function finishGachi() {
  if (score >= mode.pass) clearGachi();
  else failGachi();
}

/* ガチンコ:7問以上正解 */
function clearGachi() {
  $("quizScreen").classList.add("hidden");
  $("endScreen").classList.remove("hidden");
  $("stars").textContent = "⭐⭐⭐";
  $("scoreText").textContent = `クリア!🏆 10もんちゅう ${score}もん せいかい!`;
  Tiers.addRank(GAME, mode.lv, "?", score);
  Sound.fanfare();
  Ui.confetti();
  Ui.msg("クリア！", 1600);
}

/* ガチンコ:正解が7問未満 */
function failGachi() {
  $("quizScreen").classList.add("hidden");
  $("endScreen").classList.remove("hidden");
  $("stars").textContent = "⭐";
  $("scoreText").textContent = `ざんねん! 10もんちゅう ${score}もん せいかい`;
  Tiers.addRank(GAME, mode.lv, "?", score);
  Sound.bad();
}
</script>
</body>
</html>
