<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>４たくクイズ</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=61">
<style>
  .qemoji { text-align: center; font-size: 90px; margin: 6px 0; }
  .qtext {
    text-align: center;
    font-size: clamp(22px, 4.5vw, 36px);
    font-weight: bold;
    margin: 8px auto;
    max-width: 900px;
  }
  .qnum { text-align: center; font-size: 20px; font-weight: bold; color: #8a7a68; margin-top: 10px; }
  .stars { text-align: center; font-size: 46px; letter-spacing: 6px; }
  /* みるモードは こたえを おおきく出すので、絵を すこし ちいさくして ばしょを あける */
  body.view-mode .qemoji { font-size: 64px; margin: 2px 0; }
  body.view-mode .qtext { font-size: clamp(20px, 4vw, 32px); }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/quiz.png" alt=""> ４たくクイズ</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="startScreen" class="panel">
    <h2>クイズたいかい!</h2>
    <p style="font-size:22px">4つのなかから こたえを えらぼう!</p>

    <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ</div>
    <div class="row" data-tier="yuru">
      <button class="btn big yellow" data-mode="miru">みんなで</button>
    </div>

    <div class="mode-sec">🔥 ガチンコ</div>
    <div class="row" id="gachiRow">
      <button class="btn big green"  data-mode="g1">かんたん<br><span style="font-size:14px">5もん れんぞく</span></button>
      <button class="btn big orange" data-mode="g2">ふつう<br><span style="font-size:14px">8もん れんぞく</span></button>
      <button class="btn big purple" data-mode="g3">むずかしい<br><span style="font-size:14px">10もん れんぞく</span></button>
    </div>
    <button class="btn rank-open" id="rankBtn" type="button">🏆 ランキング</button>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="qnum" id="qnum"></div>
    <div class="hud hidden" id="gachiHud"><span id="streakHud"></span><span id="heartHud"></span></div>
    <div class="qemoji" id="qemoji"></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="answer-big hidden" id="answerBig"></div>
    <div class="row hidden" id="viewRow">
      <button class="btn big green" id="revealBtn">こたえを みる</button>
      <button class="btn big green hidden" id="nextQBtn">つぎ ▶</button>
    </div>
  </div>

  <div id="endScreen" class="panel hidden">
    <h2>おしまい!</h2>
    <div class="stars" id="stars"></div>
    <p style="font-size:26px; font-weight:bold" id="scoreText"></p>
    <div class="row">
      <button class="btn big green" id="retryBtn">もういちど</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=46"></script>
<script src="../js/quiz-data.js?v=12"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const GAME = "quiz";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];
const MODES = {
  miru:   { label: "みんなで", n: 0, view: true },
  g1: { label: "かんたん",   goal: 5,  missLimit: 3, lv: 1 },
  g2: { label: "ふつう",     goal: 8,  missLimit: 3, lv: 2 },
  g3: { label: "むずかしい", goal: 10, missLimit: 3, lv: 3 },
};
let queue = [], idx = 0, score = 0, busy = false;
let mode = null, streak = 0, miss = 0;
let left = false;   // 「もどる」で ぬけたか(あとから 出る タイマーを とめる)

function refreshLocks() {
  const lv = Tiers.unlock(GAME);
  document.querySelectorAll("#gachiRow .btn").forEach((b) => {
    const need = MODES[b.dataset.mode].lv;
    if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
    b.classList.toggle("locked", need > lv);
    b.innerHTML = (need > lv ? "🔒 " : "") + b.dataset.orig;
  });
  Tiers.bindRankButton($("rankBtn"), GAME, RANK_LABELS, { unit: "もん" });
}
refreshLocks();

document.querySelectorAll("#startScreen [data-mode]").forEach((b) => {
  b.onclick = () => {
    mode = MODES[b.dataset.mode];
    if (mode.lv && mode.lv > Tiers.unlock(GAME)) {
      Sound.bad();
      Ui.msg("まえのだんかいを クリアしてね", 1600, "#4dabf7");
      return;
    }
    Sound.tap();
    startRun();
  };
});
Nav.onLeave(() => { left = true; busy = true; document.body.classList.remove("view-mode"); refreshLocks(); });
$("retryBtn").onclick = () => {
  document.body.classList.remove("view-mode");
  $("endScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
  refreshLocks();
};

function startRun() {
  // 内蔵の問題 + この端末で作ったオリジナル問題
  queue = Util.shuffle(CustomQuiz.defaultVisible(window.QUIZ).concat(CustomQuiz.enabled()));
  if (!queue.length) {
    Ui.msg("使う問題を1つ以上オンにしてください", 1800, "#4dabf7");
    return;
  }
  if (mode.n > 0) queue = queue.slice(0, mode.n);
  idx = 0; score = 0; streak = 0; miss = 0; left = false;
  $("startScreen").classList.add("hidden");
  $("endScreen").classList.add("hidden");
  $("quizScreen").classList.remove("hidden");
  $("gachiHud").classList.toggle("hidden", !mode.goal);
  document.body.classList.toggle("view-mode", !!mode.view);
  $("viewRow").classList.toggle("hidden", !mode.view);
  updateGachiHud();
  show();
}

function updateGachiHud() {
  if (!mode.goal) return;
  $("streakHud").textContent = `れんぞく: ${streak} / ${mode.goal}`;
  $("heartHud").textContent = "❤".repeat(Math.max(0, mode.missLimit - miss));
}

function show() {
  const q = queue[idx];
  busy = false;
  $("qnum").textContent = mode.goal
    ? `だい ${idx + 1} もん`
    : `だい ${idx + 1} もん / ${queue.length} もん`;
  $("qemoji").textContent = q.emoji || "❓";
  $("qtext").textContent = q.q;
  const box = $("choices");
  box.innerHTML = "";
  const order = Util.shuffle([0, 1, 2, 3]);
  order.forEach((ci, i) => {
    const b = document.createElement("button");
    b.className = `choice c${i}`;
    b.textContent = q.choices[ci];
    b.onclick = () => mode.view ? chooseView(ci, b) : answer(ci, b);
    box.appendChild(b);
  });
  if (mode.view) {
    $("answerBig").classList.add("hidden");
    $("revealBtn").classList.remove("hidden");
    $("nextQBtn").classList.add("hidden");
  }
}

/* ---------- みるモード:「こたえを みる」で こたえを おおきく出す ---------- */
function revealViewAnswer(chosen) {
  if (busy) return;
  busy = true;
  const q = queue[idx];
  const ans = q.choices[q.answer];
  document.querySelectorAll("#choices .choice").forEach((b) => {
    if (b.textContent === ans) b.classList.add("correct");
    else b.classList.add("dim");
  });
  const box = $("answerBig");
  box.innerHTML = "";
  const label = document.createElement("span");
  label.className = "answer-label";
  label.textContent = "こたえは…";
  const text = document.createElement("div");
  text.textContent = ans;
  box.append(label, text);
  box.classList.remove("hidden");
  if (chosen) {
    const pickedCorrect = chosen.textContent === ans;
    pickedCorrect ? Sound.good() : Sound.bad();
  } else {
    Sound.pon();
  }
  Ui.confetti(1500, 60);
  $("revealBtn").classList.add("hidden");
  $("nextQBtn").textContent = idx + 1 < queue.length ? "つぎ ▶" : "おしまい ▶";
  $("nextQBtn").classList.remove("hidden");
}

function chooseView(ci, button) {
  if (busy) return;
  revealViewAnswer(button);
}

$("revealBtn").onclick = () => revealViewAnswer(null);

$("nextQBtn").onclick = () => {
  Sound.tap();
  idx++;
  if (idx < queue.length) show();
  else finishView();
};

function finishView() {
  document.body.classList.remove("view-mode");
  $("viewRow").classList.add("hidden");
  $("quizScreen").classList.add("hidden");
  $("endScreen").classList.remove("hidden");
  $("stars").textContent = "⭐⭐⭐";
  $("scoreText").textContent = `${queue.length}もん ぜんぶ みたよ!`;
  Sound.fanfare();
  Ui.confetti();
}

function answer(ci, btn) {
  if (busy) return;
  busy = true;
  const q = queue[idx];
  const ok = ci === q.answer;
  document.querySelectorAll("#choices .choice").forEach((b) => {
    if (b.textContent === q.choices[q.answer]) b.classList.add("correct");
    else b.classList.add("dim");
  });
  if (ok) {
    score++; streak++;
    Sound.good();
    Ui.msg("せいかい!⭕", 1100, "#51cf66");
  } else {
    streak = 0;
    Sound.bad();
    Ui.msg("ざんねん…", 1100, "#4dabf7");
    if (mode.goal) miss++;
  }
  if (mode.goal) updateGachiHud();

  setTimeout(() => {
    if (left) return;
    if (streak >= mode.goal) return clearGachi();
    if (miss >= mode.missLimit) return failGachi();
    idx = (idx + 1) % queue.length;   // つぎつぎ 出しつづける
    if (idx === 0) queue = Util.shuffle(queue);
    show();
  }, 1500);
}

/* ガチンコ:ノルマたっせい */
function clearGachi() {
  $("quizScreen").classList.add("hidden");
  $("endScreen").classList.remove("hidden");
  $("stars").textContent = "⭐⭐⭐";
  $("scoreText").textContent = `クリア!🏆 ${score}もん せいかい!`;
  Tiers.setUnlock(GAME, Math.min(3, mode.lv + 1));
  Tiers.addRank(GAME, mode.lv, "?", score);
  Sound.fanfare();
  Ui.confetti();
  Ui.msg("クリア！", 1600);
}

/* ガチンコ:ミスしすぎ */
function failGachi() {
  $("quizScreen").classList.add("hidden");
  $("endScreen").classList.remove("hidden");
  $("stars").textContent = "⭐";
  $("scoreText").textContent = `ざんねん!${score}もん せいかい`;
  Tiers.addRank(GAME, mode.lv, "?", score);
  Sound.bad();
}
</script>
</body>
</html>
