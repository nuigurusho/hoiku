<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>かけっこ</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=63">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/race.png" alt=""> かけっこ</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="selectScreen">
    <div class="panel">
      <h2>あそびかたを えらんでね</h2>

      <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ</div>
      <div class="row" id="cheerRow" data-tier="yuru"><button class="btn big pink" data-mode="cheer">みるだけ(オート)</button></div>
      <div class="row" id="vsRow"><button class="btn big yellow" data-mode="vs">2Pたいせん</button></div>

      <div class="mode-sec">🔥 ガチンコ</div>
      <div class="row" id="gachiRow">
        <button class="btn big green"  data-mode="c1">かんたん<br><span style="font-size:14px">CPU ゆっくり</span></button>
        <button class="btn big orange" data-mode="c2">ふつう<br><span style="font-size:14px">CPU ふつう</span></button>
        <button class="btn big purple" data-mode="c3">むずかしい<br><span style="font-size:14px">CPU はやい</span></button>
      </div>
      <button class="btn rank-open" id="rankBtn" type="button">🏆 ランキング</button>
    </div>
  </div>

  <div id="playScreen" class="hidden">
    <div class="stage-wrap"><canvas id="cv" class="stage" width="1280" height="720"></canvas></div>
    <div class="row hidden" id="endRow">
      <button class="btn big green" id="againBtn">もういちど</button>
      <button class="btn yellow" id="backBtn">やりなおす</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=49"></script>
<script src="../js/rig.js?v=17"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let sceneBg = null;
Util.loadImage("../assets/backgrounds/race.jpg").then((img) => { sceneBg = img; });
const GOAL = 2400;
const GAME = "race";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];
const ENTRY_FROM = new URLSearchParams(location.search).get("from") || "";
const MODES = {
  cheer: { label: "みるだけ", kind: "cheer" },
  vs:    { label: "2Pたいせん", kind: "vs" },
  c1: { label: "かんたん",   kind: "cpu", speed: 170, lv: 1 },
  c2: { label: "ふつう",     kind: "cpu", speed: 235, lv: 2 },
  c3: { label: "むずかしい", kind: "cpu", speed: 300, lv: 3 },
};

let allChars = [], selectedIds = new Set(), G = null, lastMode = "cheer";

if (ENTRY_FROM === "play-solo") $("vsRow").classList.add("hidden");

async function initSelect() {
  const recs = await Store.forGame();
  allChars = recs.filter((r) => r.cat === "char");
  allChars.slice(0, 2).forEach((r) => selectedIds.add(r.id));
  refreshLocks();
}
initSelect();

function picked(n) {
  const recs = allChars.filter((r) => selectedIds.has(r.id));
  return (recs.length ? recs : allChars).slice(0, n);
}

/* あそびかたを えらんだ あとの キャラえらび(モードで えらびかたが かわる) */
async function pickChars(mode) {
  if (mode.kind === "cpu") {
    const rec = await Picker.one({
      title: "きみの キャラを えらんでね",
      note: "あいては CPU が えらばれるよ",
      records: allChars, selectedId: picked(1)[0] && picked(1)[0].id,
    });
    if (!rec) return false;
    selectedIds = new Set([rec.id]);
    return true;
  }
  const vs = mode.kind === "vs";
  const recs = await Picker.many({
    title: vs ? "1P・2P の キャラを えらんでね" : "はしる キャラを えらんでね",
    note: vs ? "2にん えらんでね(ひだり=1P・みぎ=2P)" : "2〜6にん えらんでね",
    records: allChars, preselect: [...selectedIds], min: 2, max: vs ? 2 : 6,
    maxMessage: vs ? "2にん えらんでね" : "6にんまで えらべるよ",
    selectionLabels: vs ? ["1P", "2P"] : null,
  });
  if (!recs) return false;
  selectedIds = new Set(recs.map((r) => r.id));
  return true;
}

function refreshLocks() {
  const lv = Tiers.unlock(GAME);
  document.querySelectorAll("#gachiRow .btn").forEach((b) => {
    const need = MODES[b.dataset.mode].lv;
    if (!b.dataset.orig) b.dataset.orig = b.innerHTML;
    b.classList.toggle("locked", need > lv);
    b.innerHTML = (need > lv ? "🔒 " : "") + b.dataset.orig;
  });
  Tiers.bindRankButton($("rankBtn"), GAME, RANK_LABELS, { unit: "びょう" });
}

document.querySelectorAll("#selectScreen [data-mode]").forEach((b) => {
  b.onclick = async () => {
    const m = MODES[b.dataset.mode];
    if (m.lv && m.lv > Tiers.unlock(GAME)) {
      Sound.bad();
      Ui.msg("まえのだんかいを クリアしてね", 1600, "#4dabf7");
      return;
    }
    Sound.tap();
    if (!(await pickChars(m))) return;
    start(b.dataset.mode);
  };
});
Nav.onLeave(() => { if (G) G.stop = true; refreshLocks(); });
$("againBtn").onclick = () => start(lastMode);
$("backBtn").onclick = () => {
  if (G) G.stop = true;
  $("playScreen").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
  refreshLocks();
};

async function start(modeKey) {
  Sound.tap();
  lastMode = modeKey;
  const mode = MODES[modeKey];
  const kind = mode.kind;
  if (G) G.stop = true;

  const racers = [];
  if (kind === "cpu") {
    // プレイヤー + CPU の 1たい1
    const sel = picked(1);
    const playerRec = sel[0];
    const others = allChars.filter((r) => r.id !== playerRec.id);
    const cpuRec = others.length ? Util.choice(others) : playerRec;
    for (const [rec, isAi] of [[playerRec, false], [cpuRec, true]]) {
      const parts = await Rig.load(rec);
      racers.push({
        name: (isAi ? "CPU " : "") + (rec.name || ""),
        team: isAi ? "blue" : "red",
        puppet: new Puppet(parts, { h: 150 }),
        voices: rec.voices || null,
        prog: 0, v: 0, rank: 0, wob: Util.rand(0, 9),
        player: !isAi, ai: isAi, nameT: 0,
      });
    }
  } else {
    const recs = picked(kind === "vs" ? 2 : 6);
    for (const [i, rec] of recs.entries()) {
      const parts = await Rig.load(rec);
      racers.push({
        name: rec.name || "", team: i % 2 ? "blue" : "red",
        puppet: new Puppet(parts, { h: kind === "vs" ? 150 : Math.min(150, 560 / recs.length + 60) }),
        voices: rec.voices || null,
        prog: 0, v: 0, rank: 0, wob: Util.rand(0, 9),
        event: null, eventT: 0, eventCd: Util.rand(1.6, 3.6), emo: "", nameT: 0,
      });
    }
  }
  G = { mode, kind, cpuSpeed: mode.speed || 0, racers, stop: false, state: "ready", t: 0, finished: 0, ended: false, goalNotes: [] };

  $("selectScreen").classList.add("hidden");
  $("playScreen").classList.remove("hidden");
  $("endRow").classList.add("hidden");
  Ui.clearResult("endRow");

  // よーい…どん!
  Ui.msg("よーい…", 1100, "#4dabf7");
  Sound.tick();
  setTimeout(() => {
    if (G.stop) return;
    Ui.msg("どん!", 900, "#ff6b9d");
    Sound.pon();
    G.state = "run";
  }, 1300);

  let last = performance.now();
  (function loop(now) {
    if (G.stop) return;
    const dt = Math.min(0.04, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  })(last);
}

/* れんだ入力:たいせん=左1P/右2P、CPUたいせん=どこでも1P */
cv.addEventListener("pointerdown", (e) => {
  if (!G) return;
  ActorTouch.hit(G.racers, cv, e);
  if (G.state !== "run") return;
  if (G.kind === "vs") {
    const p = Util.canvasPos(cv, e);
    dash(p.x < 640 ? 0 : 1);
  } else if (G.kind === "cpu") {
    dash(0);
  }
});
window.addEventListener("keydown", (e) => {
  if (!G || G.state !== "run" || e.repeat) return;
  if (G.kind === "vs") {
    if (e.code === "KeyF") dash(0);
    if (e.code === "KeyJ") dash(1);
  } else if (G.kind === "cpu") {
    if (e.code === "KeyF" || e.code === "Space" || e.code === "Enter") { dash(0); e.preventDefault(); }
  }
});
function dash(i) {
  const r = G.racers[i];
  if (!r || r.rank || r.ai) return;
  r.prog += 34;
  r.puppet.phase += 0.65;
  Sound.step();
}

/* おうえんレースの えんしゅつ用チューニング(びょう) */
const RACE_EV = {
  cd:      [1.4, 3.4],   // つぎの ハプニングまでの あいだ
  sleep:   [1.0, 2.2],   // いねむりの ながさ
  boost:   [0.9, 1.7],   // スパートの ながさ
  stumble: [0.5, 1.0],   // つまずきの ながさ
};

/* おうえんレース:かってに はしる キャラの 1フレームぶんの えんしゅつ。
   ・追い上げ補正:先頭との差が おおきいほど はやい(遅れてる子が 加速)。
     ゴールに ちかづくほど 効果が よわまり、トップが さいごに ぬけ出せる
     = だれが かったか わかりやすい。
   ・ときどき いねむり/スパート/つまずき の ハプニングで じゅんいが かわる。 */
function cheerStep(g, r, dt) {
  r.wob += dt;
  let v = 190 + Math.sin(r.wob * 1.7) * 70 + Math.sin(r.wob * 4.3 + 1) * 45;

  const prog01 = g.leadProg / GOAL;
  const strength = 0.8 * (1 - prog01 * 0.7);            // 序盤0.8 → 終盤0.24
  const gap = g.leadProg - r.prog;                      // 0=先頭、おおきいほど後ろ
  v *= 1 + Math.min(strength, (gap / GOAL) * 2.4);

  if (r.event) {
    r.eventT -= dt;
    if (r.event === "sleep")   { v = 0;     r.puppet.walking = false; }
    if (r.event === "stumble") { v *= 0.12; r.puppet.walking = true;  }
    if (r.event === "boost")   { v *= 2.3;  r.puppet.walking = true;  }
    if (r.eventT <= 0) { r.event = null; r.emo = ""; r.eventCd = Util.rand(RACE_EV.cd[0], RACE_EV.cd[1]); }
  } else {
    r.puppet.walking = true;
    r.eventCd -= dt;
    // レース序盤・ゴール直前は ハプニングを おこさない
    if (r.eventCd <= 0 && r.prog > 140 && r.prog < GOAL - 200) startRaceEvent(r, gap);
  }
  r.prog += Math.max(0, v) * dt;
}

function startRaceEvent(r, gap) {
  const leading  = gap < GOAL * 0.05;   // ほぼ 先頭
  const trailing = gap > GOAL * 0.13;   // だいぶ 後ろ
  const roll = Math.random();
  let ev;
  if (leading && roll < 0.55)       ev = "sleep";   // 先頭は ゆだんして いねむり
  else if (trailing && roll < 0.65) ev = "boost";   // 後ろの子は スパート
  else if (roll < 0.30)             ev = "stumble";
  else if (roll < 0.60)             ev = "sleep";
  else                              ev = "boost";

  r.event = ev;
  if (ev === "sleep")   { r.eventT = Util.rand(RACE_EV.sleep[0], RACE_EV.sleep[1]);     r.emo = "💤"; addRaceNarration(G, r, " ねちゃった…"); if (leading)  Sound.beep(320, 0.55, "sine",   0.06, 0, -170); }
  if (ev === "boost")   { r.eventT = Util.rand(RACE_EV.boost[0], RACE_EV.boost[1]);     r.emo = "💨"; addRaceNarration(G, r, " スピードアップ！"); if (trailing) Sound.beep(440, 0.16, "square", 0.07, 0,  260); }
  if (ev === "stumble") { r.eventT = Util.rand(RACE_EV.stumble[0], RACE_EV.stumble[1]); r.emo = "💫"; addRaceNarration(G, r, " ころんじゃった！"); }
}

function addRaceNarration(g, r, suffix) {
  g.goalNotes.push({
    name: r.name || "キャラ", suffix,
    text: `${r.name || "キャラ"}${suffix}`,
    color: r.team === "blue" ? "#1c7ed6" : "#d6336c",
    t: 0,
    y: 650,
  });
}

function addRaceGoal(g, r) { addRaceNarration(g, r, " ゴール！"); }

function stepRaceGoals(g, dt) {
  for (const note of g.goalNotes) note.t += dt;
  g.goalNotes = g.goalNotes.filter((note) => note.t < 3.4);
  g.goalNotes.forEach((note, i) => {
    const target = 650 - (g.goalNotes.length - 1 - i) * 54;
    note.y += (target - note.y) * Math.min(1, dt * 11);
  });
}

function drawRaceGoals(g) {
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (const note of g.goalNotes) {
    const alpha = note.t < 2.55 ? 1 : Util.clamp((3.4 - note.t) / 0.85, 0, 1);
    ctx.font = '800 27px "Hoiku Rounded", sans-serif';
    const nameNatural = ctx.measureText(note.name).width;
    ctx.font = '500 27px "Hoiku Rounded", sans-serif';
    const suffixNatural = ctx.measureText(note.suffix).width;
    const natural = nameNatural + suffixNatural;
    const size = Math.max(16, 27 * Math.min(1, 520 / Math.max(1, natural)));
    ctx.font = `800 ${size}px "Hoiku Rounded", sans-serif`;
    const nameW = ctx.measureText(note.name).width;
    ctx.font = `500 ${size}px "Hoiku Rounded", sans-serif`;
    const suffixW = ctx.measureText(note.suffix).width;
    const textW = nameW + suffixW;
    const w = Math.min(562, textW + 42);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(255,253,245,.94)";
    ctx.beginPath(); ctx.roundRect(24, note.y - 21, w, 42, 21); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.rect(36, note.y - 19, w - 24, 38); ctx.clip();
    ctx.fillStyle = note.color;
    ctx.font = `800 ${size}px "Hoiku Rounded", sans-serif`;
    ctx.fillText(note.name, 42, note.y + 1);
    ctx.fillStyle = "#4a3f35";
    ctx.font = `500 ${size}px "Hoiku Rounded", sans-serif`;
    ctx.fillText(note.suffix, 42 + nameW, note.y + 1);
    ctx.restore();
  }
  ctx.restore();
}

/* レース後は、ランキングと同じ金・銀・銅の表彰台で上位3人がお祝いする。
   4位は表彰台へ乗せず、地面でみんなへ拍手する。 */
function preparePodium(g) {
  const ordered = g.racers.slice().sort((a, b) => {
    if (a.rank && b.rank) return a.rank - b.rank;
    if (a.rank) return -1;
    if (b.rank) return 1;
    return b.prog - a.prog;
  });
  ordered.forEach((r, i) => { if (!r.rank) r.rank = i + 1; });
  g.podium = ordered.slice(0, 4);
  g.resultT = 0;
  g.podium.forEach((r, i) => {
    r.celebrateCd = 0.12 + i * 0.18;
    r.puppet.walking = false;
    r.puppet.kick = false;
    r.puppet.roll = 0;
    r.puppet.jumpT = 0;
    r.puppet.h = i === 0 ? 150 : 138;
  });
  g.state = "end";
}

function updatePodium(g, dt) {
  g.resultT += dt;
  (g.podium || []).forEach((r, i) => {
    const pu = r.puppet;
    if (i < 3) {
      r.celebrateCd -= dt;
      if (r.celebrateCd <= 0 && pu.jumpT <= 0) {
        pu.jumpT = 0.45;
        r.celebrateCd = 0.75 + i * 0.12;
      }
      pu.roll = Math.sin(g.resultT * 5 + i) * 0.025;
    } else {
      // 4位は足を止め、左右へ小さく揺れながら拍手する。
      pu.roll = Math.sin(g.resultT * 8) * 0.055;
    }
    pu.update(dt);
  });
}

function drawPodium(g) {
  const bg = ctx.createLinearGradient(0, 0, 0, 720);
  bg.addColorStop(0, "#dff4ff");
  bg.addColorStop(0.58, "#fff8d7");
  bg.addColorStop(1, "#f4dfaa");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1280, 720);

  // 紙吹雪は画面を覆わず、表彰台の周囲だけに軽く舞わせる。
  const colors = ["#ff6b9d", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc", "#ffa94d"];
  for (let i = 0; i < 34; i++) {
    const x = (i * 173 + g.resultT * (18 + i % 4) * 9) % 1360 - 40;
    const y = 70 + (i * 83) % 360 + Math.sin(g.resultT * 1.8 + i) * 12;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.resultT * (0.8 + i % 3) + i);
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(-5, -10, 10, 20);
    ctx.restore();
  }

  ctx.textAlign = "center";
  ctx.font = '400 48px "Hoiku Pop", sans-serif';
  ctx.fillStyle = "#765400";
  ctx.fillText("けっか はっぴょう", 640, 82);
  if (g.resultTitle) {
    ctx.font = '800 31px "Hoiku Rounded", sans-serif';
    ctx.fillStyle = "#4a3f35";
    ctx.fillText(g.resultTitle, 640, 124);
  }
  if (g.resultMetric) {
    ctx.font = '800 25px "Hoiku Rounded", sans-serif';
    ctx.fillStyle = "#8a6a36";
    ctx.fillText(g.resultMetric, 640, 157);
  }

  const baseY = 654;
  ctx.fillStyle = "#c8df8d";
  ctx.fillRect(0, baseY, 1280, 66);
  const places = [
    { rank: 2, x: 390, w: 210, h: 150, metal: "#bfc8d2", edge: "#8994a0" },
    { rank: 1, x: 620, w: 220, h: 220, metal: "#ffd43b", edge: "#d69e00" },
    { rank: 3, x: 850, w: 210, h: 110, metal: "#d7955d", edge: "#a86132" },
  ];
  for (const p of places) {
    ctx.fillStyle = p.edge;
    ctx.beginPath(); ctx.roundRect(p.x - p.w / 2 - 5, baseY - p.h - 5, p.w + 10, p.h + 12, 24); ctx.fill();
    ctx.fillStyle = p.metal;
    ctx.beginPath(); ctx.roundRect(p.x - p.w / 2, baseY - p.h, p.w, p.h + 10, 20); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.42)";
    ctx.fillRect(p.x - p.w / 2 + 12, baseY - p.h + 10, p.w - 24, 8);
    ctx.font = '1000 82px "Hoiku Rounded", sans-serif';
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "rgba(80,50,10,.2)";
    ctx.lineWidth = 8;
    ctx.strokeText(String(p.rank), p.x, baseY - p.h / 2 + 29);
    ctx.fillText(String(p.rank), p.x, baseY - p.h / 2 + 29);
  }

  const byRank = new Map((g.podium || []).map((r) => [r.rank, r]));
  for (const p of places) {
    const r = byRank.get(p.rank);
    if (!r) continue;
    r.puppet.x = p.x;
    r.puppet.y = baseY - p.h;
    r.puppet.facing = p.rank === 2 ? 1 : p.rank === 3 ? -1 : 1;
    r.puppet.draw(ctx);
  }

  const fourth = byRank.get(4);
  if (fourth) {
    fourth.puppet.x = 1110;
    fourth.puppet.y = baseY;
    fourth.puppet.facing = -1;
    fourth.puppet.draw(ctx);
    const pulse = 1 + Math.sin(g.resultT * 8) * 0.12;
    ctx.save();
    ctx.translate(1110, baseY - fourth.puppet.h - 34);
    ctx.scale(pulse, pulse);
    ctx.font = "42px serif";
    ctx.fillText("👏", 0, 0);
    ctx.restore();
    ctx.font = '800 25px "Hoiku Rounded", sans-serif';
    ctx.fillStyle = "#6f5b42";
    ctx.fillText("4い", 1110, baseY + 38);
  }
  ctx.textAlign = "left";
}

function update(dt) {
  const g = G;
  stepRaceGoals(g, dt);
  if (g.state === "end") { updatePodium(g, dt); return; }
  if (g.state === "run") g.t += dt;
  g.leadProg = 0;
  for (const r of g.racers) if (r.prog > g.leadProg) g.leadProg = r.prog;
  for (const r of g.racers) {
    ActorTouch.tick(r, dt);
    if (g.state === "run" && !r.rank) {
      if (g.kind === "cheer") {
        cheerStep(g, r, dt);
      } else if (r.ai) {
        r.prog += g.cpuSpeed * dt;            // CPUは いっていの はやさ
        r.puppet.walking = true;
      } else {
        r.prog = Math.max(0, r.prog - 14 * dt); // れんだしないと ちょっともどる
        r.puppet.walking = false;
      }
      if (r.prog >= GOAL) {
        r.rank = ++g.finished;
        r.puppet.walking = false;
        addRaceGoal(g, r);
        if (g.kind === "cpu" && !g.ended) return finishCpu(g, r);
        if (r.rank === 1) {
          Sound.fanfare(); Ui.confetti();
          g.resultTitle = `${r.name || "1ばん"}の かち！`;
          g.resultMetric = "1い";
          // 2体以上出るので、かった キャラの よろこびの こえ だけ 鳴らす(fail は鳴らさない)
          Sound.playVoice(r.voices, ["joy"]);
        } else Sound.good();
        if (g.finished === g.racers.length) {
          preparePodium(g);
          $("endRow").classList.remove("hidden");
        }
      }
    }
    r.puppet.update(dt);
  }
}

/* CPUたいせん:さきに ゴールした ほうで しょうはい */
function finishCpu(g, r) {
  g.ended = true;
  preparePodium(g);
  $("endRow").classList.remove("hidden");
  // さきに ゴールした(=かった)キャラの よろこびの こえ だけ 鳴らす
  Sound.playVoice(r.voices, ["joy"]);
  if (r.player) {
    const secs = Math.max(1, Math.round(g.t * 10) / 10);
    Tiers.setUnlock(GAME, Math.min(3, g.mode.lv + 1));
    Tiers.addRank(GAME, g.mode.lv, r.name || "?", secs, { lowerIsBetter: true });
    Sound.fanfare(); Ui.confetti();
    g.resultTitle = "かち！";
    g.resultMetric = `${secs}びょう`;
  } else {
    Sound.bad();
    g.resultTitle = "CPUの かち";
    g.resultMetric = "もういちど ちょうせん";
  }
}

function draw() {
  const g = G;
  ctx.clearRect(0, 0, 1280, 720);
  if (g.state === "end") { drawPodium(g); return; }
  if (sceneBg) ctx.drawImage(sceneBg, 0, 0, 1280, 720);
  else {
    const sky = ctx.createLinearGradient(0, 0, 0, 720);
    sky.addColorStop(0, "#a5d8ff"); sky.addColorStop(1, "#e7f5ff");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 1280, 720);
  }
  BgFx.clouds(ctx, performance.now() / 1000, 1280, [
    { x: 150, y: 90, size: 96, speed: 2.1, alpha: 0.17 },
    { x: 820, y: 150, size: 66, speed: 1.4, alpha: 0.13 },
  ]);

  const n = g.racers.length;
  const laneH = 620 / n;
  g.racers.forEach((r, i) => {
    const laneY = 80 + laneH * (i + 1);
    // コース
    ctx.fillStyle = i % 2 ? "rgba(164,208,132,.38)" : "rgba(189,220,160,.34)";
    ctx.fillRect(0, laneY - laneH + 24, 1280, laneH - 8);
    // ゴールライン
    ctx.fillStyle = "#fff";
    for (let k = 0; k < 8; k++) {
      ctx.fillStyle = k % 2 ? "#fff" : "#4a3f35";
      ctx.fillRect(1190, laneY - laneH + 24 + (laneH - 8) / 8 * k, 16, (laneH - 8) / 8);
    }
    // はしるひと
    const x = 80 + (r.prog / GOAL) * 1100;
    r.puppet.x = x;
    r.puppet.y = laneY;
    r.puppet.facing = 1;
    r.puppet.draw(ctx);
    // じゅんい
    if (r.rank) {
      const medal = ["", "🥇", "🥈", "🥉"][r.rank] || "";
      if (medal) {
        ctx.font = "44px serif";
        ctx.fillText(medal, x - 20, laneY - r.puppet.h - 16);
      }
    } else if (r.emo) {
      ctx.font = "40px serif";
      ctx.textAlign = "center";
      ctx.fillText(r.emo, x, laneY - r.puppet.h - 14);
      ctx.textAlign = "left";
    }
  });

  // タッチで出す名前はレーンよりあとに描き、下のレーンで隠れないようにする。
  g.racers.forEach((r) => {
    ActorTouch.drawName(ctx, r, { y: r.puppet.y + 12, fontSize: 20 });
  });
  drawRaceGoals(g);

  if (g.kind === "vs" && g.state === "run") {
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,107,157,.85)";
    ctx.fillText("← ひだりを れんだ!", 320, 60);
    ctx.fillStyle = "rgba(77,171,247,.85)";
    ctx.fillText("みぎを れんだ! →", 960, 60);
    ctx.textAlign = "left";
  } else if (g.kind === "cpu" && g.state === "run") {
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,107,157,.9)";
    ctx.fillText("がめんを れんだして CPUに かとう!", 640, 60);
    ctx.textAlign = "left";
  }
}
