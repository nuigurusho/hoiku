<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>たまいれ</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=65">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/tamaire.png" alt=""> たまいれ</h1>
  <div class="spacer"></div>
</header>

<main>
  <!-- 1. キャラえらび -->
  <div id="selectScreen">
    <div class="panel">
      <h2>たまいれを する キャラを えらんでね<br><span style="font-size:18px;font-weight:normal;color:#8a7a68">(タッチで えらぶ / はずす)</span></h2>
      <p class="sel-count" id="selNote"></p>
      <div class="row compact select-all-actions"><button class="btn yellow select-all-btn" id="selectAllBtn">ぜんキャラ えらぶ</button><button class="btn gray select-all-btn" id="clearAllBtn">ぜんキャラ はずす</button></div>
      <div class="gallery" id="gallery"></div>
      <div class="row"><button class="btn big green" id="decideBtn">きめた！</button></div>
    </div>
  </div>

  <!-- 2. チーム発表 -->
  <div id="teamScreen" class="hidden">
    <h2 class="team-reveal-title">🎪 チームわけ!</h2>
    <div class="mt-teams">
      <div class="mt-teamcol red"><h3>🔴 あかチーム</h3><div class="mt-members" id="redMembers"></div></div>
      <div class="mt-vs">VS</div>
      <div class="mt-teamcol blue"><h3>🔵 あおチーム</h3><div class="mt-members" id="blueMembers"></div></div>
    </div>
    <div class="row">
      <button class="btn big yellow" id="redoBtn">チームがえ</button>
      <button class="btn big green"  id="startBtn">スタート!</button>
    </div>
  </div>

  <!-- 3. しあい(ぜんじどう)+ 4. けっか -->
  <div id="playScreen" class="hidden">
    <div class="mt-stage">
      <canvas id="cv" class="stage" width="1280" height="720"></canvas>
      <div class="uk-timer hidden" id="timer" aria-label="のこりじかん"></div>
      <div class="mt-banner hidden" id="banner"></div>
      <div class="mt-over clear hidden" id="winOver">
        <div class="mt-card" id="winCard">
          <div class="ttl" id="winTitle">かち!</div>
          <div class="sub" id="winSub"></div>
        </div>
        <div class="row">
          <button class="btn big green"  id="rematchBtn">もういちど</button>
          <button class="btn big yellow" id="reteamBtn">チームがえ</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/core.js?v=52"></script>
<script src="../js/rig.js?v=18"></script>
<script src="../js/meet.js?v=22"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv");
const NAMES = { red: "あかチーム", blue: "あおチーム" };

const SCREENS = ["selectScreen", "teamScreen", "playScreen"];
function show(id) { for (const s of SCREENS) $(s).classList.toggle("hidden", s !== id); }

const ui = Meet.ui({ banner: $("banner") });
/* 単発でも運動会と同じく、競技中は得点を隠して残り時間だけを上部へ出す。 */
ui.hud = (s) => {
  const sec = Number.isFinite(s.sec) ? s.sec : null;
  $("timer").textContent = sec == null ? "" : `⏱ ${sec}`;
  $("timer").classList.toggle("hidden", sec == null);
};

let allChars = [];
const selectedIds = new Set();
let roster = [];                 // [{rec,name,voices}]
let teams = { red: [], blue: [] };
let actors = null;               // パペット化した メンバー(チームわけごとに つくりなおす)
let teamGen = 0;

/* ============================================================
   1. キャラえらび
   ============================================================ */
async function initSelect() {
  const recs = await Store.forGame();
  allChars = recs.filter((r) => r.cat === "char");
  allChars.forEach((r) => selectedIds.add(r.id));    // さいしょは ぜんいん
  renderGallery();
}
function renderGallery() {
  const el = $("gallery");
  el.innerHTML = "";
  for (const r of allChars) {
    const d = document.createElement("div");
    d.className = "thumb" + (selectedIds.has(r.id) ? " selected" : "");
    d.innerHTML = `<img src="${r.dataURL}" alt=""><div class="name">${r.name || ""}</div>`;
    Ui.thumbFix(d.querySelector("img"), r);
    d.onclick = () => {
      Sound.tap();
      selectedIds.has(r.id) ? selectedIds.delete(r.id) : selectedIds.add(r.id);
      renderGallery();
    };
    el.appendChild(d);
  }
  refreshDecide();
}
function refreshDecide() {
  const n = selectedIds.size;
  const btn = $("decideBtn"), note = $("selNote");
  const few = n < 2;
  btn.disabled = few;
  /* 「◯にん せんたくちゅう」で そろえる。かずを いちばん おおきく 出す */
  note.className = "sel-count" + (few ? " few" : "");
  note.innerHTML = `<span class="n">${n}</span>にん せんたくちゅう`
    + (few ? `<span class="sub">あと ${2 - n}にん えらんでね</span>` : "");
}
$("selectAllBtn").onclick = () => {
  Sound.tap();
  allChars.forEach((r) => selectedIds.add(r.id));
  renderGallery();
};
$("clearAllBtn").onclick = () => {
  Sound.tap();
  selectedIds.clear();
  renderGallery();
};

Nav.onLeave(() => Meet.stop());
$("decideBtn").onclick = () => {
  if (selectedIds.size < 2) { Sound.bad(); return; }
  Sound.pon();
  roster = allChars
    .filter((r) => selectedIds.has(r.id))
    .map((r) => ({ rec: r, name: r.name || "", voices: r.voices || null }));
  splitTeams();
  goTeamReveal();
};

/* ============================================================
   2. チームわけ・チーム発表
   ============================================================ */
function splitTeams() {
  const sh = Util.shuffle(roster);
  const half = Math.ceil(sh.length / 2);     // 奇数なら あかが 1人 おおい
  teams.red = sh.slice(0, half);
  teams.blue = sh.slice(half);
  actors = null;                             // メンバーが かわったので つくりなおす
}
function goTeamReveal() { show("teamScreen"); revealTeams(); }

async function revealTeams() {
  const gen = ++teamGen;
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
  $("redMembers").innerHTML = "";
  $("blueMembers").innerHTML = "";
  $("startBtn").disabled = true;
  $("redoBtn").disabled = true;

  const order = [];
  const maxLen = Math.max(teams.red.length, teams.blue.length);
  for (let i = 0; i < maxLen; i++) {
    if (teams.red[i])  order.push(["red", teams.red[i]]);
    if (teams.blue[i]) order.push(["blue", teams.blue[i]]);
  }

  await sleep(300);
  for (const [team, mem] of order) {
    if (gen !== teamGen) return;
    Meet.drumroll();
    await sleep(340);
    if (gen !== teamGen) return;
    const box = $(team === "red" ? "redMembers" : "blueMembers");
    const d = document.createElement("div");
    d.className = "mt-mem";
    d.innerHTML = `<img src="${mem.rec.dataURL}" alt=""><div class="nm">${mem.name}</div>`;
    Ui.thumbFix(d.querySelector("img"), mem.rec);
    box.appendChild(d);
    Sound.pon();
    await sleep(170);
  }
  if (gen !== teamGen) return;
  $("startBtn").disabled = false;
  $("redoBtn").disabled = false;
}

$("redoBtn").onclick = () => { Sound.tap(); splitTeams(); revealTeams(); };
$("startBtn").onclick = () => {
  if ($("startBtn").disabled) return;
  teamGen++;
  Sound.pon();
  startMatch();
};

/* ============================================================
   3. しあい(meet.js の たまいれエンジン)
   ============================================================ */
async function startMatch() {
  Meet.stop();
  show("playScreen");
  $("banner").classList.add("hidden");
  $("timer").classList.add("hidden");
  $("winOver").classList.add("hidden");
  if (!actors) actors = await Meet.actors(teams);

  const res = await Meet.run({ key: "tamaire", cv, actors, names: NAMES, ui });
  if (!res) return;                          // とちゅうで とめられた
  showResult(res);
}

/* ============================================================
   4. けっか はっぴょう
   ============================================================ */
function showResult(res) {
  $("banner").classList.add("hidden");
  $("timer").classList.add("hidden");
  const win = res.win;
  /* まけた チームも のこす(くらくせず、はくしゅで ちがいを 出す) */
  Meet.celebrate({ cv, members: actors.red.concat(actors.blue), teamKey: win });

  const card = $("winCard"), title = $("winTitle");
  card.className = "mt-card result-reveal";
  title.className = "ttl";
  title.textContent = "";
  if (win) {
    const team = document.createElement("span");
    team.className = `uk-team-text ${win}`;
    team.textContent = NAMES[win];
    title.append(team, document.createTextNode("の かち!"));
  } else title.textContent = "ひきわけ!";
  $("winSub").textContent = `${res.score.red}こ  -  ${res.score.blue}こ`;
  $("winOver").classList.remove("hidden");
  Ui.confetti();
}

$("rematchBtn").onclick = () => { Sound.pon(); startMatch(); };
$("reteamBtn").onclick = () => {
  Sound.tap();
  Meet.stop();
  splitTeams();
  goTeamReveal();
};

/* ---- 起動 ---- */
show("selectScreen");
initSelect();
</script>
</body>
</html>
