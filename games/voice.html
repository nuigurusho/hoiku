<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>こえで ジャンプ</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="../assets/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="../css/style.css?v=62">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">← もどる</a>
  <h1><img class="bar-icon" src="../assets/buttons/voice.png" alt=""> こえで ジャンプ</h1>
  <div class="spacer"></div>
</header>

<main>
  <div id="selectScreen" class="panel">
    <h2>こえを だすと キャラが とぶよ!</h2>

    <div class="mode-sec" data-tier="yuru">🌈 ゆるふわ</div>
    <div class="row"><button class="btn big blue" data-mode="ren">れんしゅう</button></div>

    <div class="mode-sec">🔥 ガチンコ</div>
    <div class="row" id="gachiRow">
      <button class="btn big green"  data-mode="g1">かんたん<br><span style="font-size:14px">⭐8こ</span></button>
      <button class="btn big orange" data-mode="g2">ふつう<br><span style="font-size:14px">⭐12こ</span></button>
      <button class="btn big purple" data-mode="g3">むずかしい<br><span style="font-size:14px">⭐16こ</span></button>
    </div>
    <button class="btn rank-open" id="rankBtn" type="button">🏆 ランキング</button>
    <p class="note" id="micNote">※マイクの使用許可が必要です</p>
  </div>

  <div id="playScreen" class="hidden">
    <div class="hud"><span id="scoreHud">⭐ 0</span><span id="timeHud">⏰ 45</span></div>
    <div class="stage-wrap"><canvas id="cv" class="stage" width="1280" height="720"></canvas></div>
    <div class="row hidden" id="honbanRow">
      <button class="btn big green" id="honbanBtn">ほんばんへ</button>
    </div>
    <div class="row hidden" id="endRow">
      <button class="btn big green" id="againBtn">もういちど</button>
      <button class="btn yellow" id="backBtn">やりなおす</button>
    </div>
  </div>
</main>

<script src="../js/core.js?v=48"></script>
<script src="../js/rig.js?v=17"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const GROUND = 640;
const GAME = "voice";
const RANK_LABELS = ["かんたん", "ふつう", "むずかしい"];
/* 小さい環境音は拾わず、普通の声ではしっかり浮く感度にする。
   上昇し始める音量は約0.058（変更前は約0.098）。 */
const VOICE_FLOOR = 0.02;
const VOICE_LIFT = 40000;
const MODES = {
  /* れんしゅうは じかんむせいげん。⭐は 出るし とれるけど かぞえない */
  ren:  { label: "れんしゅう", yuru: true },
  g1: { label: "かんたん",   time: 45, goal: 8,  lv: 1 },
  g2: { label: "ふつう",     time: 45, goal: 12, lv: 2 },
  g3: { label: "むずかしい", time: 45, goal: 16, lv: 3 },
};

let selChar = null, selBg = null, allChars = [], allBgs = [], G = null, mic = null;

async function initSelect() {
  const recs = await Store.forGame();
  allChars = recs.filter((r) => r.cat === "char");
  allBgs = recs.filter((r) => r.cat === "bg");
  selChar = allChars[0];
  selBg = allBgs[0] || null;
}
initSelect();

async function setupMic() {
  if (mic) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const actx = Sound.ensure();
    const src = actx.createMediaStreamSource(stream);
    const an = actx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    mic = { an, buf: new Uint8Array(an.fftSize) };
    return true;
  } catch (e) {
    return false;
  }
}

function volume() {
  if (!mic) return 0;
  mic.an.getByteTimeDomainData(mic.buf);
  let sum = 0;
  for (let i = 0; i < mic.buf.length; i++) {
    const v = (mic.buf[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / mic.buf.length);   // 0〜1くらい
}

/* タッチフォールバック */
let pressing = false;
cv.addEventListener("pointerdown", () => { pressing = true; });
window.addEventListener("pointerup", () => { pressing = false; });

function setupRanking() {
  Tiers.bindRankButton($("rankBtn"), GAME, RANK_LABELS, { unit: "こ" });
}
setupRanking();

document.querySelectorAll("#selectScreen [data-mode]").forEach((b) => {
  b.onclick = async () => {
    const m = MODES[b.dataset.mode];
    Sound.tap();
    /* あそびかたを えらんだ あとに、キャラえらび せんようがめんへ */
    const rec = await Picker.one({
      title: "だれで あそぶ?", records: allChars, selectedId: selChar && selChar.id,
    });
    if (!rec) return;
    selChar = rec;
    if (allBgs.length) {
      const bg = await Picker.one({
        title: "どこで あそぶ?", records: allBgs, selectedId: selBg && selBg.id,
      });
      if (!bg) return;
      selBg = bg;
    }
    const hasMic = await setupMic();
    if (!hasMic) Ui.msg("マイクが つかえないよ", 1800, "#4dabf7");
    start(m);
  };
});
/* れんしゅうは おわらないので、あそびながら ガチンコの かんたんへ 行ける */
$("honbanBtn").onclick = () => {
  if (G) G.stop = true;
  $("playScreen").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
  document.querySelector('#gachiRow [data-mode="g1"]').click();
};
$("againBtn").onclick = () => start(G.mode);
$("backBtn").onclick = () => {
  if (G) G.stop = true;
  $("playScreen").classList.add("hidden");
  $("selectScreen").classList.remove("hidden");
};
Nav.onLeave(() => { if (G) G.stop = true; });

async function start(mode) {
  if (G) G.stop = true;
  const parts = await Rig.load(selChar);
  const bgImg = selBg ? await Util.loadImage(selBg.dataURL) : null;
  const puppet = new Puppet(parts, { x: 300, y: GROUND, h: 170, facing: 1 });
  G = { stop: false, mode, y: GROUND, vy: 0, stars: [], score: 0, t: mode.time || 0, spawn: 0, bgX: 0, over: false, cleared: false };

  $("selectScreen").classList.add("hidden");
  $("playScreen").classList.remove("hidden");
  $("endRow").classList.add("hidden");
  Ui.clearResult("endRow");
  $("honbanRow").classList.toggle("hidden", !!mode.goal);   // れんしゅうから ほんばんへ
  $("timeHud").classList.toggle("hidden", !mode.time);
  updateScoreHud();

  const starCv = Util.emojiCanvas("⭐", 84);
  const cloudCv = Util.emojiCanvas("☁️", 140);
  const clouds = Array.from({ length: 4 }, () => ({ x: Util.rand(0, 1280), y: Util.rand(40, 300), v: Util.rand(15, 40) }));
  let last = performance.now();
  const g = G;

  (function loop(now) {
    if (g.stop) return;
    const dt = Math.min(0.04, (now - last) / 1000); last = now;

    if (!g.over && g.mode.time) {
      g.t -= dt;
      if (g.t <= 0) { g.t = 0; finish(); }
    }

    /* こえ(またはタッチ)で うきあがる */
    const vol = Math.max(volume(), pressing ? 0.25 : 0);
    const lift = Util.clamp((vol - VOICE_FLOOR) * VOICE_LIFT, 0, 5200);
    g.vy += (1500 - lift) * dt;              // 重力 - うきあがる力
    g.vy = Util.clamp(g.vy, -620, 700);
    g.y = Util.clamp(g.y + g.vy * dt, 130, GROUND);
    if (g.y === GROUND && g.vy > 0) g.vy = 0;
    if (g.y === 130 && g.vy < 0) g.vy = 0;

    /* ほし */
    g.spawn -= dt;
    if (g.spawn <= 0 && !g.over) {
      g.spawn = Util.rand(0.9, 1.5);
      g.stars.push({ x: 1330, y: Util.rand(160, GROUND - 60), t: 0 });
    }
    for (const s of g.stars) { s.x -= 230 * dt; s.t += dt; }
    g.stars = g.stars.filter((s) => s.x > -60);
    const py = g.y - puppet.h / 2;
    for (const s of g.stars) {
      if (!s.got && Math.abs(s.x - 300) < 75 && Math.abs(s.y - py) < 90) {
        s.got = true; s.x = -999;
        Sound.pop();
        if (!g.mode.yuru) {
          g.score++;
          updateScoreHud();
          if (g.mode.goal && !g.cleared && g.score >= g.mode.goal) {
            g.cleared = true;
            Ui.msg("ノルマ クリア!⭐", 1200, "#51cf66");  // のこり時間で もっと あつめよう
          }
        }
      }
    }
    if (g.mode.time) $("timeHud").textContent = `⏰ ${Math.ceil(g.t)}`;

    puppet.walking = g.y >= GROUND - 2;
    puppet.update(dt);

    /* --- 描画 --- */
    ctx.clearRect(0, 0, 1280, 720);
    if (bgImg) {
      g.bgX += 78 * dt;
      Util.drawLoopImage(ctx, bgImg, g.bgX, 1280, 720);
    } else {
      const sky = ctx.createLinearGradient(0, 0, 0, 720);
      sky.addColorStop(0, "#74c0fc"); sky.addColorStop(1, "#e7f5ff");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, 1280, 720);
      for (const c of clouds) {
        c.x -= c.v * dt;
        if (c.x < -150) c.x = 1350;
        ctx.drawImage(cloudCv, c.x, c.y);
      }
    }
    ctx.fillStyle = "rgba(116,184,85,.92)"; ctx.fillRect(0, GROUND + 10, 1280, 720 - GROUND);

    for (const s of g.stars) ctx.drawImage(starCv, s.x - 42, s.y - 42 + Math.sin(s.t * 4) * 6);

    puppet.x = 300; puppet.y = GROUND;
    puppet.draw(ctx, GROUND - g.y);

    /* こえメーター */
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.roundRect(30, 80, 44, 560, 22); ctx.fill();
    const mh = Util.clamp(vol * 4, 0, 1) * 552;
    const mg = ctx.createLinearGradient(0, 640, 0, 88);
    mg.addColorStop(0, "#51cf66"); mg.addColorStop(0.6, "#ffd43b"); mg.addColorStop(1, "#ff6b9d");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.roundRect(34, 636 - mh, 36, mh + 2, 18); ctx.fill();
    ctx.font = "34px serif"; ctx.fillText("🎤", 24, 700);

    requestAnimationFrame(loop);
  })(last);

  function finish() {
    g.over = true;
    Sound.fanfare();
    if (g.mode.goal) {
      Tiers.addRank(GAME, g.mode.lv, (selChar && selChar.name) || "?", g.score);
      if (g.cleared) {
        Ui.confetti();
        Ui.msg("クリア！", 1600);
        Ui.result("endRow", "クリア！", `⭐ ${g.score}こ`);
      } else {
        Ui.msg("おしまい！", 1500, "#9775fa");
        Ui.result("endRow", "おしまい", `⭐ ${g.score} / ${g.mode.goal}こ`);
      }
    } else {
      if (g.score >= 10) Ui.confetti();
      Ui.msg("おしまい！", 1500);
      Ui.result("endRow", "おしまい", `⭐ ${g.score}こ`);
    }
    $("endRow").classList.remove("hidden");
  }
}

function updateScoreHud() {
  if (!G) return;
  if (G.mode.yuru) $("scoreHud").textContent = "こえを だそう!🎤";
  else if (G.mode.goal) $("scoreHud").textContent = `⭐ ${G.score} / ${G.mode.goal}`;
  else $("scoreHud").textContent = `⭐ ${G.score}`;
}
</script>
</body>
</html>
