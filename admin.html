<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取り込み</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームパック">
<link rel="stylesheet" href="css/style.css?v=39">
</head>
<body>
<header class="bar">
  <a class="back" href="index.html" id="backLink">← もどる</a>
  <h1><img class="bar-icon" src="assets/buttons/import.png" alt=""> 取り込み</h1>
  <div class="spacer"></div>
</header>

<main class="admin-list">
  <div class="admin-cat-tabs" id="catTabs" role="tablist" aria-label="取り込みカテゴリ">
    <button type="button" role="tab" data-cat="src">✂️<span>元素材</span></button>
    <button type="button" role="tab" data-cat="char" class="active">🧍<span>全身</span></button>
    <button type="button" role="tab" data-cat="fuku">😀<span>顔</span></button>
    <button type="button" role="tab" data-cat="bg">🏞️<span>はいけい</span></button>
  </div>
  <div class="panel import-actions">
    <div class="row">
      <button class="btn blue" id="pickBtn">ファイルを選ぶ</button>
      <button class="btn blue" id="cameraBtn">カメラで撮る</button>
      <button class="info-btn" type="button" id="importInfo" aria-label="とりこみかたの説明">i</button>
    </div>
  </div>
  <div class="admin-cat-swipe" id="catSwipe">
    <section class="admin-cat-panel hidden" data-cat="src"><div id="listSrc"></div></section>
    <section class="admin-cat-panel" data-cat="char"><div id="listChar"></div></section>
    <section class="admin-cat-panel hidden" data-cat="fuku"><div id="listFuku"></div></section>
    <section class="admin-cat-panel hidden" data-cat="bg"><div id="listBg"></div></section>
  </div>
</main>

<div class="modal hidden" id="workInfoModal" role="dialog" aria-modal="true" aria-labelledby="workInfoTitle">
  <form class="panel work-info-panel" id="workInfoForm">
    <h2 id="workInfoTitle">✏️ 作品情報</h2>
    <label class="work-info-field"><span>作品名</span><input id="workInfoName" type="text" maxlength="40" autocomplete="off" placeholder="例: にじいろちゃん"></label>
    <label class="work-info-field"><span>作者名 <small>（任意）</small></span><input id="workInfoAuthor" type="text" maxlength="40" autocomplete="off" placeholder="例: さくらぐみ"></label>
    <label class="work-info-field"><span>絵の種類</span>
      <select id="workInfoCategory">
        <option value="src">✂️ トリミング用の元素材</option>
        <option value="char">🧍 キャラクターの全身</option>
        <option value="fuku">😀 キャラクターの顔</option>
        <option value="bg">🏞️ はいけい</option>
      </select>
    </label>
    <div class="row work-info-actions">
      <button class="btn green" type="submit">✔ 保存する</button>
      <button class="btn gray" type="button" id="workInfoCancel">キャンセル</button>
    </div>
  </form>
</div>

<script src="js/vendor/pdf.min.js"></script>
<script src="js/core.js?v=34"></script>
<script src="js/rig.js?v=17"></script>
<script src="js/editors.js?v=23"></script>
<script>
"use strict";
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "js/vendor/pdf.worker.min.js";
}
const $ = (id) => document.getElementById(id);

/* 「つくる」から来たときは「つくる」へ戻る(トップの歯車から来たときはトップへ) */
if (new URLSearchParams(location.search).get("from") === "create") {
  $("backLink").setAttribute("href", "create.html");
}

const FROM_CREATE = new URLSearchParams(location.search).get("from") === "create";
const IMPORT_SELF = FROM_CREATE ? "admin.html?from=create" : "admin.html";

/* 一覧の並び順:元素材 → キャラ全身 → キャラ顔 → はいけい。
   旧「写真・絵」も同じ一覧に残し、既存データを壊さない。 */
const CATS = [
  [["src"], "listSrc"], [["char"], "listChar"], [["fuku"], "listFuku"],
  [["bg", "pic"], "listBg"],
];
let workInfoRec = null;

function closeWorkInfo() {
  $("workInfoModal").classList.add("hidden");
  workInfoRec = null;
}

function openWorkInfo(r) {
  workInfoRec = r;
  $("workInfoName").value = r.name || "";
  $("workInfoAuthor").value = r.author || "";
  $("workInfoCategory").value = r.cat === "pic" ? "bg" : r.cat;
  $("workInfoModal").classList.remove("hidden");
  requestAnimationFrame(() => $("workInfoName").focus());
}

$("workInfoForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!workInfoRec) return;
  const r = workInfoRec;
  r.name = $("workInfoName").value.trim();
  r.author = $("workInfoAuthor").value.trim();
  r.cat = $("workInfoCategory").value;
  if (r.cat === "char" && !r.rig) r.rig = { ...Rig.DEFAULT };
  if (r.cat === "char" && !r.cutout) r.cutout = { mode: "edge", threshold: 225, gap: 1, strokes: [] };
  await Store.put(r);
  closeWorkInfo();
  Sound.good();
  refresh();
};
$("workInfoCancel").onclick = closeWorkInfo;
$("workInfoModal").onclick = (e) => { if (e.target === $("workInfoModal")) closeWorkInfo(); };

async function refresh() {
  await Store.ensureSamples();
  const all = await Store.all();
  for (const [cats, elId] of CATS) {
    const el = $(elId);
    el.innerHTML = "";
    const recs = all.filter((r) => cats.includes(r.cat));
    if (!recs.length) el.innerHTML = '<p class="note">まだありません</p>';
    for (const r of recs) el.appendChild(row(r));
  }
}
Editors.onChange = refresh;

/* 一覧の1行。キャラクターは取り込み直後に動きまで調整できる。 */
function row(r) {
  const d = document.createElement("div");
  d.className = "admin-row" + (r.hidden ? " is-game-hidden" : "");
  d.innerHTML = `<button class="admin-thumb-btn" type="button" aria-label="画像を拡大して見る"><img src="${r.dataURL}" width="80" height="60" alt=""></button><span class="nm"></span>`;
  const info = r.name || "(名前なし)";
  d.querySelector(".nm").textContent = r.author ? `${info}　作者: ${r.author}` : info;
  const thumb = d.querySelector("img");
  Ui.thumbFix(thumb, r);
  d.querySelector(".admin-thumb-btn").onclick = () => showImagePreview(r, thumb.src);
  const mk = (label, cls, fn) => {
    const b = document.createElement("button");
    b.className = "btn " + cls;
    b.textContent = label;
    b.onclick = fn;
    d.appendChild(b);
    return b;
  };
  const iconButton = (label, cls, svg, fn) => {
    const b = document.createElement("button");
    b.className = `btn icon-btn ${cls}`;
    b.type = "button";
    b.setAttribute("aria-label", label);
    b.title = label;
    b.innerHTML = svg;
    b.onclick = fn;
    d.appendChild(b);
    return b;
  };
  iconButton("作品情報を編集", "blue", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>', () => openWorkInfo(r));
  if (r.cat === "src") mk("トリミング", "blue", () => Editors.cropRecord(r));
  if (r.cat === "char") {
    const p = new URLSearchParams({ edit: r.id, back: IMPORT_SELF });
    mk("かく", "blue", () => { location.href = `draw.html?${p}`; });
    mk("こえ", "blue", () => Editors.openVoice(r));
    mk("うごき", "blue", () => Editors.openRig(r));
  }
  if (r.cat === "fuku") mk("パーツ", "blue", () => Editors.openFuku(r));
  if (r.cat === "bg" || r.cat === "pic") {
    const hasDiff = Array.isArray(r.diffVariants) && r.diffVariants.length > 0;
    mk(hasDiff ? "さぶん" : "＋", "blue", () => Editors.openSpot(r, {
      back: IMPORT_SELF,
      promptAdd: !hasDiff,
    }));
  }

  iconButton("画像をダウンロード", "blue", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>', () => {
    const ext = /^data:image\/png/i.test(r.dataURL) ? "png" : "jpg";
    const a = document.createElement("a");
    a.href = r.dataURL;
    a.download = (r.name || "画像").replace(/[\\/:*?"<>|]/g, "_") + "." + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    Sound.tap();
  });
  mk("削除", "red", async () => {
    if (confirm(`「${r.name}」を削除しますか?`)) { await Store.remove(r.id); refresh(); }
  });

  const visibility = document.createElement("label");
  visibility.className = "game-visibility";
  visibility.title = r.hidden ? "ゲームに表示しない" : "ゲームに表示する";
  visibility.innerHTML = `<input type="checkbox" aria-label="ゲームに表示する"${r.hidden ? "" : " checked"}><span class="game-visibility-track" aria-hidden="true"></span>`;
  const visibilityInput = visibility.querySelector("input");
  visibilityInput.onchange = async () => {
    r.hidden = !visibilityInput.checked;
    visibility.title = r.hidden ? "ゲームに表示しない" : "ゲームに表示する";
    await Store.put(r);
    d.classList.toggle("is-game-hidden", r.hidden);
    Sound.tap();
  };
  d.appendChild(visibility);
  return d;
}

function showImagePreview(r, src) {
  Sound.tap();
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.setAttribute("role", "dialog");
  wrap.setAttribute("aria-modal", "true");
  wrap.setAttribute("aria-label", `${r.name || "画像"}の拡大表示`);
  wrap.innerHTML = `<div class="panel image-preview-panel"><h2></h2><img alt=""><div class="row"><button class="btn blue" type="button">とじる</button></div></div>`;
  wrap.querySelector("h2").textContent = r.name || "画像";
  wrap.querySelector("img").src = src;
  const close = () => wrap.remove();
  wrap.querySelector("button").onclick = close;
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  document.body.appendChild(wrap);
  wrap.querySelector("button").focus();
}

const CAT_KEYS = ["src", "char", "fuku", "bg"];
let activeCat = "char";
let swipeStart = null;

function setActiveCat(cat) {
  if (!CAT_KEYS.includes(cat)) return;
  activeCat = cat;
  $("catTabs").querySelectorAll("[data-cat]").forEach((button) => {
    const on = button.dataset.cat === cat;
    button.classList.toggle("active", on);
    button.setAttribute("aria-selected", on ? "true" : "false");
  });
  $("catSwipe").querySelectorAll(".admin-cat-panel").forEach((panel) =>
    panel.classList.toggle("hidden", panel.dataset.cat !== cat));
}

$("catTabs").querySelectorAll("[data-cat]").forEach((button) => {
  button.onclick = () => { Sound.tap(); setActiveCat(button.dataset.cat); };
});
$("catSwipe").addEventListener("pointerdown", (e) => {
  swipeStart = { x: e.clientX, y: e.clientY };
});
$("catSwipe").addEventListener("pointerup", (e) => {
  if (!swipeStart) return;
  const dx = e.clientX - swipeStart.x;
  const dy = e.clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
  const next = Math.max(0, Math.min(CAT_KEYS.length - 1, CAT_KEYS.indexOf(activeCat) + (dx < 0 ? 1 : -1)));
  if (CAT_KEYS[next] !== activeCat) { Sound.tap(); setActiveCat(CAT_KEYS[next]); }
});
setActiveCat(activeCat);

$("pickBtn").onclick = () => Editors.chooseFiles(activeCat);
$("cameraBtn").onclick = () => Editors.chooseCamera(activeCat);

/* 長い説明は iボタンの中に(読みやすい箇条書きで) */
$("importInfo").onclick = () => {
  Sound.tap();
  Ui.info("とりこみかたの コツ", `
    <h3>カテゴリの えらびかた</h3>
    <ul class="info-list">
      <li><b>✂️ トリミング用の元素材</b> … 大きな紙に何人分も描いてある絵・写真の置き場。ここから何枚でも切り出せます</li>
      <li><b>🧍 キャラクターの全身</b> … 走る・跳ぶゲームで動く絵。取り込んだら「つくる」画面で <b>動き設定</b>(首・腰・中央の3本線)を合わせてください</li>
      <li><b>😀 キャラクターの顔</b> … ふくわらい用。「パーツ」で目・眉・鼻・口を四角く囲みます</li>
      <li><b>🏞️ はいけい</b> … パズル・まちがいさがし・カードあわせ・「おえかきのたび」で使います</li>
    </ul>
    <h3>きれいに取り込むコツ</h3>
    <ul class="info-list">
      <li>白い紙に <b>濃く・はっきり</b> 描く(うすい鉛筆は消えやすい)</li>
      <li>明るい場所で <b>影が入らないよう</b> 真上からまっすぐ撮る</li>
      <li>キャラクターは、紙の外側につながる白だけを自動で透明にします。輪郭の中の白い顔・服・体は残ります</li>
      <li>輪郭が薄い・切れている絵は、「つくる」画面の <b>動き設定 → 高度な設定</b> で白の判定や隙間補正、残す／消す筆を調整できます</li>
      <li>キャラクターは <b>紙いっぱいに大きく</b> 描くと、動かしたときにきれいです</li>
      <li>顔の絵は、目・鼻・口が重ならないよう <b>大きく</b> 描くとパーツを切り出しやすいです</li>
    </ul>
    <h3>画像のサイズ</h3>
    <ul class="info-list">
      <li>取り込むと自動で縮小されるので、<b>元の大きさは気にしなくて大丈夫</b>です</li>
      <li>長辺の目安 … キャラクターの全身・顔は <b>900px</b>、はいけいは <b>1100px</b>、元素材は <b>1600px</b></li>
      <li>比率の決まりはありません。キャラクターは <b>たて長</b>、背景は <b>よこ長(16:9くらい)</b> が画面に収まりやすいです</li>
      <li>スマホやカメラの写真をそのまま入れてOK。PDFはページごとに読み込みます</li>
      <li>PDFを2ファイル以上まとめて選ぶと、全ページを「トリミング用の元素材」へ一括で保存します</li>
    </ul>
  `);
};

async function init() {
  await refresh();
  const spotId = new URLSearchParams(location.search).get("spot");
  if (!spotId) return;
  const rec = (await Store.all()).find((r) => String(r.id) === String(spotId));
  history.replaceState({}, "", IMPORT_SELF);
  if (rec) Editors.openSpot(rec, { back: IMPORT_SELF });
}
init();
</script>
</body>
</html>
