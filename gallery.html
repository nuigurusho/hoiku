<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>みんなの さくひん</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff922b">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ゲームパック">
  <link rel="stylesheet" href="css/style.css?v=64">
  <style>
    body.ingame .collection-main { padding-top: 12px; }
    .exhibit-heading { grid-template-columns: 1fr auto; padding: 0 84px; }
    .exhibit-heading > div { min-width: 0; }
    .work-pager {
      position: fixed;
      top: 50%;
      left: 0;
      z-index: 45;
      width: 100%;
      margin: 0;
      pointer-events: none;
      transform: translateY(-50%);
    }
    .work-pager button {
      width: 68px;
      height: 88px;
      padding: 0;
      border-radius: 0 999px 999px 0;
      background: rgba(255,255,255,.82);
      pointer-events: auto;
    }
    .work-pager button:last-child { border-radius: 999px 0 0 999px; }
    .work-pager svg { width: 30px; height: 30px; vertical-align: middle; }
    .voice-btn:disabled {
      opacity: .35;
      filter: grayscale(1);
      cursor: default;
    }
    .voice-btn:disabled:active { transform: none; box-shadow: 0 4px 0 #c8c8c8; }
    .character-exhibit > .character-stage { grid-row: span 3; }
    .collection-frame { position: relative; }
    .character-category-mark {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 3px solid rgba(121,80,42,.45);
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      box-shadow: 0 3px 0 rgba(121,80,42,.28);
      font-size: 24px;
      line-height: 1;
    }
    .character-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 8px 12px;
      border: 3px solid #ead58d;
      border-radius: 20px;
      background: rgba(255,251,226,.94);
    }
    .character-category {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 18px;
      font-weight: 900;
    }
    .character-category-emoji { font-size: 27px; line-height: 1; }
    .joint-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .joint-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }
    .joint-switch {
      position: relative;
      width: 52px;
      height: 30px;
      border: 3px solid #b9aa94;
      border-radius: 999px;
      background: #d8d0c4;
      transition: background .15s, border-color .15s;
    }
    .joint-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 4px rgba(58,43,27,.25);
      transition: transform .15s;
    }
    .joint-toggle input:checked + .joint-switch { border-color: #dc4c79; background: #f783ac; }
    .joint-toggle input:checked + .joint-switch::after { transform: translateX(22px); }
    .joint-toggle input:focus-visible + .joint-switch { outline: 4px solid #1864ab; outline-offset: 3px; }
    @media (max-width: 760px) {
      .exhibit-heading { grid-template-columns: 1fr auto; padding: 0 54px; }
      .exhibit-heading .exhibit-count { grid-column: auto; grid-row: auto; justify-self: end; }
      .work-pager button { width: 56px; height: 74px; }
      .character-exhibit > .character-stage { grid-row: auto; }
      .character-info { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      .joint-switch, .joint-switch::after { transition: none; }
    }
  </style>
</head>
<body class="collection-page">
<header class="bar">
  <a class="back" href="view.html" id="backLink">← もどる</a>
  <h1><img class="bar-icon" id="pageTitleIcon" src="assets/buttons/character-intro.png" alt=""><span id="pageTitle">みんなの さくひん</span></h1>
  <div class="spacer"></div>
</header>

  <main class="collection-main">
  <section id="shelfScreen">
    <div class="collection-grid" id="collectionGrid"></div>
    <div class="collection-empty hidden" id="emptyState"></div>
  </section>

  <section class="exhibit hidden" id="detailScreen" aria-live="polite">
    <div class="exhibit-heading">
      <div>
        <h2 id="workName"></h2>
        <p id="workAuthor"></p>
      </div>
      <span class="exhibit-count" id="workCount"></span>
    </div>

    <div class="character-exhibit hidden" id="characterExhibit">
      <button class="character-stage" id="characterStage" type="button" aria-label="キャラクターをタップして反応を見る">
        <canvas id="characterCanvas" width="760" height="540"></canvas>
      </button>
      <div class="character-info">
        <span class="character-category" id="characterCategory"></span>
        <label class="joint-toggle">
          <span>かんせつ</span>
          <input id="jointToggle" type="checkbox" role="switch">
          <span class="joint-switch" aria-hidden="true"></span>
        </label>
      </div>
      <div class="control-group">
        <h3>うごき</h3>
        <div class="exhibit-controls">
          <button class="motion-btn" type="button" data-motion="walk">🚶 あるく</button>
          <button class="motion-btn" type="button" data-motion="jump">⬆️ ジャンプ</button>
          <button class="motion-btn" type="button" data-motion="spin">🌀 くるり</button>
          <button class="motion-btn" type="button" data-motion="greet">👋 ごあいさつ</button>
        </div>
      </div>
      <div class="control-group" id="voiceGroup">
        <h3>こえ</h3>
        <div class="exhibit-controls" id="voiceButtons"></div>
      </div>
    </div>

    <div class="background-exhibit hidden" id="backgroundExhibit">
      <div class="museum-wall"><img id="backgroundImage" alt=""></div>
    </div>

    <nav class="work-pager" aria-label="さくひんを きりかえる">
      <button type="button" id="prevWork" aria-label="まえの さくひん"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" id="nextWork" aria-label="つぎの さくひん"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
  </section>
</main>

<script src="js/core.js?v=51"></script>
<script src="js/rig.js?v=18"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const kind = new URLSearchParams(location.search).get("type") === "bg" ? "bg" : "char";
const voiceLabels = { joy: "🎉 よろこび", greet: "👋 あいさつ", ouch: "💥 びっくり", fail: "💧 しっぱい" };
let works = [];
let current = 0;
let puppet = null;
let raf = 0;
let last = performance.now();
let motion = { type: "idle", until: 0, started: 0 };
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const galleryFirstOrder = [
  "sample-bg-crayon-hills-v1",
  "sample-bg-watercolor-playground-v1",
  "sample-bg-watercolor-forest-v1",
  "sample-pic-crayon-picnic-v1",
  "sample-pic-crayon-playroom-v1",
];

function text(el, value) { el.textContent = value || ""; }

function characterCategory(work) {
  const type = (work.rig && work.rig.type) || "biped";
  const kindByType = { biped: "human", skirt: "skirt", quad: "animal", butterfly: "fly", float: "float" };
  return Guide.get(kindByType[type] || "human");
}

function orderGalleryWorks(list) {
  return list.map((work, index) => {
    const key = work.sampleKey || work.id || "";
    const rank = galleryFirstOrder.indexOf(key);
    return { work, index, rank: rank < 0 ? galleryFirstOrder.length : rank };
  }).sort((a, b) => a.rank - b.rank || a.index - b.index).map((item) => item.work);
}

/* 長い作品名だけ、最後まで読める速さで左へ流す。端で1秒、先頭へ戻って4秒休む。 */
function setMarquee(el, value) {
  if (el._marqueeAnimation) el._marqueeAnimation.cancel();
  el._marqueeAnimation = null;
  el.classList.add("marquee-viewport");
  el.dataset.marquee = "";
  el.title = value;
  el.textContent = "";
  const line = document.createElement("span");
  line.className = "marquee-text";
  line.textContent = value;
  el.appendChild(line);
  requestAnimationFrame(() => startMarquee(el));
}

function startMarquee(el) {
  if (el._marqueeAnimation) el._marqueeAnimation.cancel();
  el._marqueeAnimation = null;
  const line = el.querySelector(".marquee-text");
  if (!line) return;
  line.style.transform = "translateX(0)";
  const distance = Math.ceil(line.scrollWidth - el.clientWidth);
  el.classList.toggle("is-overflowing", distance > 1);
  if (distance <= 1 || reducedMotion) return;
  const travel = Math.max(1200, distance / 36 * 1000);
  const total = travel * 2 + 5000;
  el._marqueeAnimation = line.animate([
    { transform: "translateX(0)", offset: 0 },
    { transform: `translateX(-${distance}px)`, offset: travel / total },
    { transform: `translateX(-${distance}px)`, offset: (travel + 1000) / total },
    { transform: "translateX(0)", offset: (travel * 2 + 1000) / total },
    { transform: "translateX(0)", offset: 1 },
  ], { duration: total, iterations: Infinity, easing: "linear" });
}

function setupCopy() {
  const isChar = kind === "char";
  document.title = isChar ? "キャラしょうかい" : "びじゅつかん";
  text($("pageTitle"), isChar ? "キャラしょうかい" : "びじゅつかん");
  $("pageTitleIcon").src = isChar ? "assets/buttons/character-intro.png" : "assets/buttons/museum.png";
  $("emptyState").innerHTML = isChar
    ? "キャラクターが まだ いないよ<br><a href=\"admin.html\">とりこみ</a>で とうろくしてね"
    : "はいけいが まだ ないよ<br><a href=\"admin.html\">とりこみ</a>で とうろくしてね";
}

function renderShelf() {
  const grid = $("collectionGrid");
  grid.innerHTML = "";
  $("emptyState").classList.toggle("hidden", works.length > 0);
  works.forEach((work, index) => {
    const button = document.createElement("button");
    button.className = "collection-card " + kind;
    button.type = "button";
    const frame = document.createElement("span");
    frame.className = "collection-frame";
    const img = document.createElement("img");
    img.src = work.dataURL;
    img.alt = "";
    frame.appendChild(img);
    if (kind === "char") {
      const category = characterCategory(work);
      const mark = document.createElement("span");
      mark.className = "character-category-mark";
      mark.textContent = category.emoji;
      mark.title = category.label;
      mark.setAttribute("aria-label", category.label);
      frame.appendChild(mark);
    }
    const caption = document.createElement("span");
    caption.className = "collection-caption";
    const name = document.createElement("strong");
    setMarquee(name, work.name || (kind === "char" ? "なまえのない キャラクター" : "なまえのない さくひん"));
    caption.appendChild(name);
    if (work.author) {
      const author = document.createElement("small");
      author.textContent = "作者: " + work.author;
      caption.appendChild(author);
    }
    button.append(frame, caption);
    button.onclick = () => openWork(index);
    grid.appendChild(button);
    if (kind === "char") Ui.thumbFix(img, work);
  });
}

async function openWork(index) {
  if (!works.length) return;
  current = (index + works.length) % works.length;
  const work = works[current];
  setMarquee($("workName"), work.name || (kind === "char" ? "なまえのない キャラクター" : "なまえのない さくひん"));
  text($("workAuthor"), work.author ? "作者: " + work.author : "");
  text($("workCount"), `${current + 1} / ${works.length}`);
  $("shelfScreen").classList.add("hidden");
  $("detailScreen").classList.remove("hidden");
  document.body.classList.add("ingame");
  $("characterExhibit").classList.toggle("hidden", kind !== "char");
  $("backgroundExhibit").classList.toggle("hidden", kind !== "bg");
  if (kind === "bg") {
    $("backgroundImage").src = work.dataURL;
    $("backgroundImage").alt = work.name || "はいけいの さくひん";
    return;
  }
  const category = characterCategory(work);
  $("characterCategory").innerHTML = `<span class="character-category-emoji" aria-hidden="true">${category.emoji}</span><span>${category.label}</span>`;
  renderVoiceButtons(work);
  try {
    const parts = await Rig.load(work);
    if (works[current] !== work) return;
    puppet = new Puppet(parts, { x: 380, y: 472, h: Math.min(390, 350 * 560 / Math.max(parts.H, 1)), facing: 1 });
    puppet.showJoints = $("jointToggle").checked;
    puppet.h = Math.min(390, 350 * parts.H / Math.max(parts.W, parts.H));
    resetMotion();
  } catch (e) {
    puppet = null;
  }
}

function renderVoiceButtons(work) {
  const box = $("voiceButtons");
  box.innerHTML = "";
  const keys = Object.keys(voiceLabels).filter((key) => work.voices && work.voices[key]);
  Object.keys(voiceLabels).forEach((key) => {
    const has = keys.includes(key);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "voice-btn";
    b.textContent = voiceLabels[key];
    b.disabled = !has;
    b.onclick = () => {
      Sound.playVoice(work.voices, [key]);
      react(key === "joy" ? "jump" : key === "greet" ? "greet" : key === "ouch" ? "spin" : "walk", false);
    };
    box.appendChild(b);
  });
}

function resetMotion() {
  motion = { type: "idle", until: 0, started: performance.now() };
  if (!puppet) return;
  puppet.walking = false;
  puppet.roll = 0;
  puppet.kick = false;
  puppet.perched = false;
}

function react(type, playGreeting = true) {
  if (!puppet) return;
  const now = performance.now();
  resetMotion();
  motion = { type, started: now, until: now + (type === "walk" ? 2600 : type === "spin" ? 1100 : 900) };
  if (type === "jump" || type === "greet") puppet.hop();
  if (type === "walk") { puppet.walking = true; Sound.step(); }
  if (type === "spin") Sound.pon();
  if (type === "greet" && playGreeting && !Sound.playVoice(works[current].voices, ["greet"])) Sound.good();
}

function randomReaction() {
  const choices = ["walk", "jump", "spin", "greet"];
  const type = Util.choice(choices);
  react(type);
  const voiceKeys = Object.keys(voiceLabels).filter((key) => works[current].voices && works[current].voices[key]);
  if (voiceKeys.length && Math.random() < 0.65) Sound.playVoice(works[current].voices, [Util.choice(voiceKeys)]);
}

function draw(now) {
  raf = requestAnimationFrame(draw);
  const canvas = $("characterCanvas");
  const ctx = canvas.getContext("2d");
  const dt = Math.min(.04, (now - last) / 1000 || 0); last = now;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const glow = ctx.createRadialGradient(380, 330, 20, 380, 330, 330);
  glow.addColorStop(0, "rgba(255,255,255,.96)");
  glow.addColorStop(1, "rgba(255,241,196,.16)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(139,103,64,.12)";
  ctx.beginPath(); ctx.ellipse(380, 482, 150, 24, 0, 0, Math.PI * 2); ctx.fill();
  if (!puppet) return;
  if (!reducedMotion || motion.type !== "idle") puppet.update(dt);
  if (motion.until && now >= motion.until) resetMotion();
  if (motion.type === "walk") {
    const p = (now - motion.started) / Math.max(1, motion.until - motion.started);
    puppet.x = 230 + Math.sin(Math.min(1, p) * Math.PI) * 300;
    puppet.facing = p < .5 ? 1 : -1;
  } else puppet.x = 380;
  if (motion.type === "spin") puppet.roll = Math.min(1, (now - motion.started) / 1100) * Math.PI * 2;
  puppet.draw(ctx);
}

document.querySelectorAll("[data-motion]").forEach((b) => { b.onclick = () => react(b.dataset.motion); });
$("characterStage").onclick = randomReaction;
$("jointToggle").onchange = (e) => {
  Sound.tap();
  if (puppet) puppet.showJoints = e.target.checked;
};
function showShelf(e) {
  if (e) e.preventDefault();
  resetMotion();
  $("detailScreen").classList.add("hidden");
  $("shelfScreen").classList.remove("hidden");
  document.body.classList.remove("ingame");
}
$("prevWork").onclick = () => openWork(current - 1);
$("nextWork").onclick = () => openWork(current + 1);
addEventListener("DOMContentLoaded", () => {
  const back = document.querySelector(".back-float");
  if (back) {
    back.title = "いちらん";
    back.setAttribute("aria-label", "いちらん");
    back.addEventListener("click", showShelf);
  }
});
let marqueeResizeTimer = 0;
addEventListener("resize", () => {
  clearTimeout(marqueeResizeTimer);
  marqueeResizeTimer = setTimeout(() => document.querySelectorAll("[data-marquee]").forEach(startMarquee), 120);
});

(async () => {
  setupCopy();
  const all = await Store.forGame();
  works = kind === "char"
    ? all.filter((r) => r.cat === "char")
    : orderGalleryWorks(all.filter((r) => r.cat === "bg" || r.cat === "pic"));
  renderShelf();
  if (kind === "char") raf = requestAnimationFrame(draw);
})();
</script>
</body>
</html>
