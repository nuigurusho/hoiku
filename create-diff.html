<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくる — まちがいさがし</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
<header class="bar">
  <a class="back" href="create.html">← もどる</a>
  <h1><img class="bar-icon" src="assets/buttons/diff.png" alt=""> まちがいさがしを つくる</h1>
  <div class="spacer"></div>
</header>

<main class="admin-list">
  <div class="make-sec">
    <h2>まちがいさがし<button class="info-btn" type="button" id="picInfo" aria-label="まちがいさがしの説明">i</button></h2>
    <h3>しゃしん・え<span class="make-tag">差分画像とスポットを設定すると あそべます</span></h3>
    <div id="listPic"></div>
  </div>

  <p class="note" style="max-width:1000px;margin:18px auto;text-align:center">
    ここで作った絵は <a href="games/diff.html">まちがいさがし</a>・おえかきパズルなどで つかえます。
  </p>
</main>

<script src="js/vendor/pdf.min.js"></script>
<script src="js/core.js?v=21"></script>
<script src="js/rig.js?v=15"></script>
<script src="js/editors.js?v=13"></script>
<script>
"use strict";
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "js/vendor/pdf.worker.min.js";
}

document.getElementById("picInfo").onclick = () => {
  Sound.tap();
  Ui.info("まちがいさがしの つくりかた", `
    <ul class="info-list">
      <li>元の写真や絵をふやし、<b>差分画像・スポット</b> から2枚目以降の画像を登録します</li>
      <li>差分画像は複数登録でき、遊ぶたびにどれか1枚がランダムで出ます</li>
      <li>差分画像ごとに、右の絵で違う場所をタップします(1枚につき最大8個)</li>
      <li>登録した差分画像は、パズルなどほかのコンテンツの画像一覧には出ません</li>
      <li>園の写真もそのまま使えます(端末の中だけに保存されます)</li>
      <li>大きさは自動で縮小(長辺 <b>1100px</b>)。<b>よこ長</b> が2枚ならべて見やすいです</li>
    </ul>
  `);
};

Editors.mountLists(
  [{ cat: "pic", el: "listPic", what: "しゃしん・え", btns: ["spot"] }],
  { back: "create-diff.html" }
);
</script>
</body>
</html>
