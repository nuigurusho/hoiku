name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 公開しないもの(設計メモ・デザイン提案・引き継ぎメモ)を配信対象から外す
      - run: rm -rf design notes
      # コミットごとに別の完成済みキャッシュを作り、古い版との混在を防ぐ
      - run: PWA_BUILD_ID="$GITHUB_SHA" node tools/build-pwa.mjs
      - run: rm -rf tools CLAUDE.md README.md CONTRIBUTING.md serve.bat serve.sh .gitignore
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
